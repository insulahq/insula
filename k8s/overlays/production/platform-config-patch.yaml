apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: platform
data:
  environment: "production"
  log-level: "warn"
  default-storage-class: "longhorn"
  ingress-base-domain: "${DOMAIN}"
  # Substituted, never literal — see k8s/base/platform-config.yaml for why.
  # The default keeps production on real Let's Encrypt unless bootstrap pinned
  # something else (e.g. an internal ACME endpoint for an air-gapped install).
  cluster-issuer-name: "${CLUSTER_ISSUER_NAME}"
  admin-url: "https://admin.${DOMAIN}"
  tenant-url: "https://tenant.${DOMAIN}"
  cors-origins: "https://admin.${DOMAIN},https://tenant.${DOMAIN}"
  # Passkey (WebAuthn) RP — placeholder-templated. Resolved by Flux
  # postBuild.substituteFrom (or bootstrap envsubst).
  passkey-rp-id: "${DOMAIN}"
  passkey-origins: "https://admin.${DOMAIN},https://tenant.${DOMAIN}"
  # Private Worker — wildcard A record `tunnels.${DOMAIN}` must point
  # at cluster ingress (one-time DNS setup at install).
  tunnel-base-url: "wss://tunnels.${DOMAIN}"
  private-worker-frps-image: "fatedier/frps:v0.69.1"
  private-worker-agent-image: "ghcr.io/insulahq/insula/private-worker-agent:latest"
  # Per-tenant file-manager sidecar image. Without this override the base
  # ConfigMap's bare `file-manager:latest` resolves to docker.io and
  # ImagePullBackOffs — the dev overlay sets this but production didn't, so
  # file-manager was broken on every non-dev cluster (surfaced by the ADR-053
  # prod-mirror staging,).
  file-manager-image: "ghcr.io/insulahq/insula/file-manager:80a71f8@sha256:4326aa1f470d4aaa1d8409cd59f696a8d0e8f131ee18ffade3d96024d509e22d"
  # Mail-archive checkpoint binary. Production does NOT follow the development
  # overlay's CI pin (no cluster tracks a branch here — ADR-053's admin-controlled
  # pull model), so this is stamped at release time. Until cut-release.sh does
  # that, it is the same mutable `:latest` every other job image on this overlay
  # uses; see docs/roadmap/ROADMAP.md.
  rocksdb-secondary-checkpoint-image: "ghcr.io/insulahq/insula/rocksdb-secondary-checkpoint:20260915110120-80a71f8@sha256:0c83f561b364694af9b7eec2a92cb839c72bc966e0f612c1a823bbc4d40a1406"
  # The remaining runtime-launched images. These MUST be listed here even though
  # the values below are placeholders: cut-release.sh stamps each one from the
  # development overlay's digest-pinned value when a release is cut, and it fails
  # closed on a key that is pinned in development but absent here — without the
  # line, production would silently inherit the base `:latest` instead.
  tenant-backup-tools-image: "ghcr.io/insulahq/insula/tenant-backup-tools:c06879a@sha256:3d1378061f74d716975a0c91a5fea0017ad0a915e7af9103c07ae997a6a1faa4"
  migration-tools-image: "ghcr.io/insulahq/insula/migration-tools:80a71f8@sha256:081b87808d7a07eeeea359a32ee038c60184acd459f3bdfc565f5fc3056efc5c"
  claim-validator-image: "ghcr.io/insulahq/insula/claim-validator:80a71f8@sha256:2f5a30ad85ed6870c4f1f0961d525f63a58d25c039cb5c668a98679289775715"
  node-terminal-image: "ghcr.io/insulahq/insula/node-terminal:80a71f8@sha256:2207de07fe9cf0d8f33ad163578acbaefd7542f16bba43b87b511677c5f607e7"
  # Admin node-terminal (ADR-041 — super_admin-only privileged root shell
  # on cluster nodes via nsenter into host PID 1). ENABLED in production:
  # it's a break-glass tool operators need, and it's still gated by the
  # 30-min OIDC step-up freshness check + a 256-bit single-use 60s wsToken.
  # HA-safe with no extra config — the wsToken is validated against the
  # Postgres `node_terminal_sessions` table (any platform-api replica can
  # serve any session; the old "needs single-replica/stickiness" caveat was
  # the obsolete in-memory design), and base already sets the platform-api
  # Service `sessionAffinity: ClientIP`. See docs/operations/NODE_TERMINAL.md.
  node-terminal-enabled: "true"
  # Allowlist for publicWssOrigin — host portion of cors-origins.
  # Belt-and-braces against X-Forwarded-Host spoofing. Populated even
  # when the feature is disabled so flipping the flag above doesn't
  # require a second ConfigMap edit.
  platform-public-hosts: "admin.${DOMAIN},tenant.${DOMAIN}"
  # Share the platform_session cookie across ALL platform subdomains
  # (Domain=.<apex>; SameSite=None; Secure). REQUIRED for the Stalwart
  # web-admin at stalwart.<apex>: the admin panel iframes/opens that
  # subdomain and it is gated by the admin-auth-cookie auth_request, which
  # lands on stalwart.<apex> — NOT admin.<apex>. A host-only cookie (the
  # prior default here) is scoped to admin.<apex> and a browser never sends
  # it cross-subdomain, so the gate 401'd for every operator on
  # staging/production (dev/dind already set this; prod/staging did not —
  # and staging inherits this file via ../production). CSRF-safe: every
  # mutating endpoint is Bearer-only with no cookie fallback (see
  # buildSessionCookie / auth middleware), so SameSite=None opens no
  # state-changing path.
  session-cookie-domain: ".${DOMAIN}"
