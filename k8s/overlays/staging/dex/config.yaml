# Dex configuration for staging environment
#
# Static users for testing:
#   - admin@k8s-platform.test / admin
#   - user@k8s-platform.test  / user
#
# IMPORTANT: bootstrap.sh --env staging --domain <FQDN> regenerates
# this file with correct hostnames. ${DOMAIN} will
# fail loudly if not overridden.

issuer: https://dex.${DOMAIN}/dex

# Postgres-backed storage: Dex auth_request / auth_code / refresh_token /
# device_request rows live in the platform's `platform` database
# (shared with platform-api, same `platform` SQL user). Dex creates its
# own table set on first start (auth_request, auth_code, refresh_token,
# keys, client, connector, password, offline_session, device_request,
# device_token) — none of these names collide with platform's own
# oidc_* / users / clients tables.
#
# Why postgres: SQLite-on-emptyDir stored auth state per-pod, which
# made multi-replica Dex deployments incoherent (auth_request created
# on pod A could not be looked up by /dex/auth/local/login on pod B).
# Surfaced by integration-oidc-dex.sh — see project memory and the
# 0086_oidc_pkce_state.sql migration which fixed the same class of
# bug on platform-api's own PKCE store.
#
# Credentials are pulled from the platform-db-credentials Secret
# (same one platform-api uses; created during bootstrap). $ENV
# substitution is performed by Dex on config load via os.ExpandEnv.
storage:
  type: postgres
  config:
    host: postgres.platform.svc.cluster.local
    port: 5432
    database: platform
    user: $DEX_DB_USER
    password: $DEX_DB_PASSWORD
    ssl:
      mode: disable

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: hosting-platform-admin
    name: Hosting Platform Admin
    secret: staging-secret-admin
    redirectURIs:
      - https://admin.${DOMAIN}/api/v1/auth/oidc/callback
  - id: hosting-platform-tenant
    name: Hosting Platform Tenant
    secret: staging-secret-tenant
    redirectURIs:
      # TENANT host, not admin. The tenant panel calls the API same-origin
      # (API_URL is deliberately empty in k8s/base/tenant-deployment.yaml), so
      # the backend builds the callback from the tenant host's Host header.
      # This said admin.${DOMAIN} until 2026-09-05, which made tenant SSO fail
      # with "Unregistered redirect_uri" at Dex on every non-dind environment.
      - https://tenant.${DOMAIN}/api/v1/auth/oidc/callback
  - id: hosting-platform-oauth2-proxy
    name: OAuth2 Proxy
    # secretEnv, NOT `secret: $VAR`. Dex expands NOTHING in `secret:` — it
    # took the literal string "$OAUTH2_PROXY_CLIENT_SECRET" as the client
    # secret, so every token exchange came back
    # `invalid_client "Invalid client credentials."` and oauth2-proxy answered
    # the callback with a 500. Measured on DEV 2026-09-05: Dex held a 27-char
    # literal while oauth2-proxy sent the real 32-char value.
    #
    # `secretEnv` names an environment variable, which is the supported way to
    # keep a client secret out of a ConfigMap (dex storage.Client.SecretEnv).
    # The Deployment already injects OAUTH2_PROXY_CLIENT_SECRET from the
    # oauth2-proxy-config Secret, so both sides now read the same value.
    secretEnv: OAUTH2_PROXY_CLIENT_SECRET
    redirectURIs:
      # BOTH panels. oauth2-proxy no longer pins a single --redirect-url; it
      # derives the callback from the request host, so whichever panel the
      # visitor actually asked for is the one Dex must accept. Listing only the
      # admin host is what made `protectTenantViaProxy` unusable.
      - https://admin.${DOMAIN}/oauth2/callback
      - https://tenant.${DOMAIN}/oauth2/callback

connectors: []

enablePasswordDB: true

staticPasswords:
  - email: admin@k8s-platform.test
    # password: "admin"
    hash: "$2a$12$CKIgnUHcoyiGpppJxt.03.O9rcptDVj3sD5K.vbx8VR5D/EcYgdua"
    username: admin
    userID: "00000000-0000-0000-0000-000000000001"
  - email: user@k8s-platform.test
    # password: "user"
    hash: "$2a$12$hCtO8LmCEJW7B8UlS3jU7utAoLNHJf6P83ZpuyN6tM8YCnMJSsB5G"
    username: user
    userID: "00000000-0000-0000-0000-000000000003"
