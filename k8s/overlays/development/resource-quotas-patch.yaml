# Staging overlay: medium resource quotas — between dev (4 CPU/4Gi)
# and production (16 CPU/32Gi). Suitable for a 4-8 vCPU staging server.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hosting-quota
  namespace: hosting
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 24Gi
    persistentvolumeclaims: "100"
    pods: "100"
    services: "100"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: hosting-limit-range
  namespace: hosting
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 25m
        memory: 32Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-quota
  namespace: platform
spec:
  hard:
    # NO limits.cpu — platform pods run WITHOUT CPU limits (ADR-037; see
    # k8s/base/resource-quotas.yaml, 2026-06-24). A limits.cpu quota (a)
    # rejects every limitless pod with "must specify limits.cpu" and (b)
    # wedges rolling updates on burst-ceiling accounting even while nodes
    # sit near-idle — which is exactly what stalled the platform-api rollout
    # for a day (2026-06-24). This overlay previously re-added limits.cpu:20
    # (stale from the pre-2026-06-24 CPU-limited model); removed 2026-07-30 to
    # match the base. Guardrails: requests.cpu + limits.memory + node capacity.
    # HA headroom for a 3-server cluster of 4 GB-RAM nodes; limits.memory 20Gi
    # allows over-commit + transient PITR pods (temp postgres + bootstrap-
    # controller + snapshot-recovery Job via LimitRange defaults).
    requests.cpu: "8"
    requests.memory: 8Gi
    limits.memory: 20Gi
---
# LimitRange for platform namespace — supplies default container resource
# requests/limits so pods that don't specify them (e.g. CNPG-managed
# bootstrap-controller / snapshot-recovery Job pods during PITR) still satisfy
# the platform-quota's requests.cpu/requests.memory/limits.memory hard limits.
# Mirrors k8s/base/resource-quotas.yaml; an overlay needs its own copy because
# the base ResourceQuota is fully replaced (ResourceQuota strategic merge
# replaces, not merges). Defaults sized for 4 GB-RAM cluster servers.
#
# NO default/max CPU LIMIT — platform pods run without CPU limits (ADR-037;
# CPU limits cause CFS throttling on high-priority infra, and platform-quota
# no longer tracks limits.cpu). A default CPU REQUEST is still applied for
# scheduling. max.cpu is removed too: with max.cpu set, max becomes the
# implicit default limit. (Aligned with base 2026-07-30.)
apiVersion: v1
kind: LimitRange
metadata:
  name: platform-limit-range
  namespace: platform
spec:
  limits:
    - type: Container
      default:
        memory: 384Mi
      defaultRequest:
        cpu: 20m
        memory: 32Mi
      max:
        memory: 4Gi
      min:
        cpu: 10m
        memory: 32Mi
