apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: platform
data:
  environment: "staging"
  log-level: "info"
  default-storage-class: "longhorn"
  ingress-base-domain: "${DOMAIN}"
  # Substituted, never literal — see k8s/base/platform-config.yaml for why.
  cluster-issuer-name: "${CLUSTER_ISSUER_NAME:=letsencrypt-prod-http01}"
  admin-url: "https://admin.${DOMAIN}"
  tenant-url: "https://tenant.${DOMAIN}"
  # Canonical public URL used to mint CRL distribution URLs in mTLS
  # provider metadata. Set to the admin host so the CRL endpoint
  # matches the JWT-scoped API surface.
  public-url: "https://admin.${DOMAIN}"
  cors-origins: "https://admin.${DOMAIN},https://tenant.${DOMAIN}"
  # Per-tenant sidecar image — pull from GHCR on real clusters.
  file-manager-image: "ghcr.io/insulahq/insula/file-manager:latest"
  # Mail-archive checkpoint binary. CI-MANAGED — rewritten by
  # .github/scripts/pin-config-image.sh from ci-rocksdb-secondary-checkpoint.yml
  # after every push to development. Do not hand-edit; the next build overwrites
  # it. Format is `:<tag>@sha256:<digest>` — the digest is authoritative (proven
  # on k3s v1.31.4: a deliberately WRONG tag with a right digest still ran the
  # digest's image), the tag is there so this line stays readable.
  rocksdb-secondary-checkpoint-image: "ghcr.io/insulahq/insula/rocksdb-secondary-checkpoint:20260807130852-57c285a@sha256:9c310789fa28b64dcaafeefb5c876aa3c6a4ca708c0c114a23f687577c65c77d"
  # Private Worker — clients dial in to this WSS host with their token.
  # The wildcard A record `tunnels.${DOMAIN}` must point at cluster
  # ingress (set up at install time, no per-tenant DNS work needed).
  tunnel-base-url: "wss://tunnels.${DOMAIN}"
  private-worker-frps-image: "fatedier/frps:v0.69.1"
  private-worker-agent-image: "ghcr.io/insulahq/insula/private-worker-agent:latest"
  # CI-MANAGED (pin-config-image.sh) — do not hand-edit; the next build of each
  # image overwrites these with `:<tag>@sha256:<digest>`.
  tenant-backup-tools-image: "ghcr.io/insulahq/insula/tenant-backup-tools:latest"
  migration-tools-image: "ghcr.io/insulahq/insula/migration-tools:13d2914@sha256:b7b995e88dab6b445de7eaad9572ebb9fe26ac140cf4e2fe063e4c6c01e91a68"
  claim-validator-image: "ghcr.io/insulahq/insula/claim-validator:13d2914@sha256:55324b10da116813a398647152ec9b203b33ef07ed08b92e49e45641859cb291"
  node-terminal-image: "ghcr.io/insulahq/insula/node-terminal:13d2914@sha256:b2bcf540d350aba6d462c75473863437683854c9069c04b84a9cf3d7061151c2"
  # Longhorn dashboard URL for the Storage Configuration iframe.
  # 2026-06-12: path route on the admin host (same-origin) — the
  # longhorn.<apex> subdomain was removed.
  longhorn-url: "/longhorn/"
  # platform_session cookie Domain attribute. Shares the cookie across
  # all admin-only subdomains (longhorn, stalwart, future ones) so
  # admin-panel iframes carry the auth automatically. Without this the
  # cookie is host-only to admin.<apex> and cross-subdomain iframes
  # hit the nginx auth_request gate with no cookie → redirect loop.
  session-cookie-domain: ".${DOMAIN}"
  # Passkey (WebAuthn) RP — placeholder-templated. ${DOMAIN} is
  # resolved by Flux postBuild.substituteFrom (and by bootstrap.sh's
  # envsubst pass at install time). Kept in the overlay so Flux's
  # platform-config-patch carries them too — the bootstrap-only path
  # gets overwritten by Flux on every reconcile, so the SoT must be
  # in the overlay for clusters running Flux.
  passkey-rp-id: "${DOMAIN}"
  passkey-rp-name: "Insula (staging)"
  passkey-origins: "https://admin.${DOMAIN},https://tenant.${DOMAIN}"
  # Admin node-terminal (ADR-041 — privileged root shell on cluster
  # nodes via nsenter into host PID 1). super_admin-only with 30-min
  # step-up freshness; audited to audit_logs. Enabled on staging by
  # default so operators have a break-glass tool against k3s host
  # issues without SSH.
  node-terminal-enabled: "true"
  # Allowlist for publicWssOrigin — host portion of cors-origins.
  # Belt-and-braces against X-Forwarded-Host spoofing.
  platform-public-hosts: "admin.${DOMAIN},tenant.${DOMAIN}"
