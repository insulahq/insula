#
# Dev overlay for Roundcube.
#
# Standalone kustomization — deploy independently of the main dev overlay
# so the bootstrap.sh auto-regenerated dev/kustomization.yaml never touches it.
#
# Deploy:
#   ./scripts/local.sh webmail-up
#   # equivalent to: kubectl apply -k k8s/overlays/dind/roundcube/
#
# Differences from base:
#   1. Service type ClusterIP → NodePort 30017 (mapped to host 2017
#      by docker-compose.local.yml)
#   2. Plaintext dev secrets matching .env.local JWT_SECRET and the
#      Stalwart dev master credentials
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mail

resources:
  - ../../../base/roundcube
  # 2026-05-18: webmail feature-visibility ConfigMap. Mounted by the
  # Roundcube Pod; without it the volume reference fails on Pod start.
  - ../../../base/mail-feature-css
  # secret.yaml (mail-secrets) moved to overlays/dind/stalwart-mail/ on
  # 2026-09-01 — it is the mail stack's Secret, not Roundcube's, and
  # `mail-up` must be able to create it without deploying webmail.
  # Roundcube still consumes it by name, so `mail-up` is a prerequisite
  # of `webmail-up` (it always was in practice — Roundcube needs Stalwart).
  - ingress.yaml

patches:
  - path: service-nodeport-patch.yaml
    target:
      kind: Service
      name: roundcube
