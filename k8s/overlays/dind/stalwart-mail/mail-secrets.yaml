#
# Dev-only secret for local DinD k3s — the MAIL stack's shared Secret.
#
# Consumed by Stalwart's master-proxy auth path: platform-api,
# tenant-bundle mailbox Jobs, mail-imapsync Jobs and Roundcube all read
# STALWART_MASTER_PASSWORD from here. Named `roundcube-secrets` until
# 2026-05-22; see bootstrap.sh's mail-secrets block for the rename note.
#
# JWT_AUTH_SECRET MUST equal .env.local JWT_SECRET so the jwt_auth plugin
# can verify webmail tokens issued by the local backend.
#
# STALWART_MASTER_PASSWORD is the cleartext master password (not the bcrypt
# hash). It must match the cleartext that was used to generate the
# MASTER_SECRET bcrypt hash in k8s/overlays/dind/stalwart/secret.yaml.
#
# DO NOT use any of these values in production.
#
apiVersion: v1
kind: Secret
metadata:
  name: mail-secrets
  namespace: mail
  labels:
    # Was `app: roundcube` — stale since the 2026-05-22 rename; this
    # Secret belongs to the mail stack, not to the webmail client.
    app: stalwart-mail
    app.kubernetes.io/part-of: hosting-platform
type: Opaque
stringData:
  # Matches .env.local JWT_SECRET
  JWT_AUTH_SECRET: "local-dev-jwt-secret-not-for-production"
  # Stalwart 0.16's IMAP master-auth requires the FQDN form (the
  # bare `master` short name returns AUTHENTICATIONFAILED).
  # 2026-05-16: ALSO confirmed Stalwart 0.16 hard-rejects the .local
  # TLD on auth entirely (`AUTHENTICATIONFAILED master.local`
  # regardless of password or role). Anchor the master Account under
  # the platform's base domain (matches the bulwark dev secret +
  # the bootstrap.sh contract).
  STALWART_MASTER_USER: "master@insula.host"
  # Cleartext of the master password whose bcrypt hash lives in
  # k8s/overlays/dind/stalwart/secret.yaml as MASTER_SECRET
  STALWART_MASTER_PASSWORD: "stalwart-dev-master"
  # Roundcube's session/cred encryption key — any 24 bytes will do for dev
  ROUNDCUBEMAIL_DES_KEY: "dev-only-roundcube-key24"

  # Postgres session backend config. Points DIRECTLY at the CNPG
  # primary service in the platform namespace — the same host
  # bootstrap.sh writes on real installs. (The old value referenced a
  # platform-postgres.mail.svc "bridge" whose _patch_postgres_bridge
  # helper was removed from local.sh during the M14 CNPG migration, so
  # the hostname never resolved and Roundcube died with a DB error —
  # found during the 2026-06-07 app-password spike.) The roundcube
  # role + database are created by platform-api's
  # roundcube-db-reconciler with the credentials below.
  ROUNDCUBEMAIL_DB_HOST: "system-db-rw.platform.svc.cluster.local"
  ROUNDCUBEMAIL_DB_PORT: "5432"
  ROUNDCUBEMAIL_DB_NAME: "roundcube"
  ROUNDCUBEMAIL_DB_USER: "roundcube"
  ROUNDCUBEMAIL_DB_PASSWORD: "roundcube-local-dev-password"
