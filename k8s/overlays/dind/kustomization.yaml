# Dev overlay — local DinD environment.
#
# Two modes share this overlay:
#   ./scripts/local.sh up   → Full k3s (all pods, production-like)
#   ./scripts/local.sh dev  → Infra only (app pods scaled to 0, run on host)
#
# Uses local-path storage, .local domains, relaxed resource quotas,
# hardcoded dev secrets, and NodePort services for host access.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # Dev-only services
  - dev-secrets.yaml
  - nodeport-services.yaml
  - allow-intra-platform-netpol.yaml
  - allow-mail-to-postgres-netpol.yaml
  # The File Manager upload-raw WAF carve-out used to live here as a
  # hand-written, dev-only IngressRoute, with a note that the reconciler
  # would emit the production equivalent "in Phase 2". It never did, so
  # production buffered every upload through the WAF. The carve-out is now
  # a route inside the reconciler-owned platform-ingress and applies to
  # every environment — see UPLOAD_PATH_REGEXP in
  # backend/src/modules/system-settings/ingress-reconciler.ts.
  # Dev-only sub-stacks (core only — mail/webmail are opt-in via local.sh)
  - dex/
  # oauth2-proxy ships with Dex (moved out of base — see base/kustomization.yaml).
  - ../../base/oauth2-proxy
  - cert-manager/

patches:
  - path: resource-quotas-patch.yaml
  - path: oauth2-proxy-patch.yaml
  - path: platform-config-patch.yaml
  # ingress-patch.yaml was REMOVED in the Traefik migration. platform-ingress
  # is no longer a static resource — platform-api's ingress-reconciler
  # creates an IngressRoute on startup from system_settings. Dev-specific
  # WAF rule overrides (CRS 911100 / 920420 exclusions) now live in the
  # Coraza Middleware config (Phase 3); until that lands the dev cluster
  # runs without WAF.
  - path: backend-patch.yaml
  - path: frontends-grace-patch.yaml
  # CNPG platform Postgres: longhorn → local-path (DinD has no Longhorn).
  - path: postgres-cluster-patch.yaml
    target:
      kind: Cluster
      name: system-db

images:
  - name: ghcr.io/insulahq/insula/backend
    newName: hosting-platform/backend
    newTag: local
  - name: ghcr.io/insulahq/insula/admin-panel
    newName: hosting-platform/admin-panel
    newTag: local
  - name: ghcr.io/insulahq/insula/tenant-panel
    newName: hosting-platform/tenant-panel
    newTag: local
