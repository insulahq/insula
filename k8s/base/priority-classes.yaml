# Cluster-wide PriorityClasses for the multi-tenant platform.
#
# Four classes implement the tiered eviction/placement model
# (ascending: tenants are ALWAYS evicted before platform workloads —
# operator decision 2026-07-25; pairs with the kubelet
# eviction-hard=memory.available<256Mi drop-in from bootstrap
# configure_memory_protection / host-migration 2026.7.2/0001):
#
#   tenant-default            (priority 0, globalDefault=true)
#     Default for every Pod that doesn't set priorityClassName explicitly.
#     The per-tenant ResourceQuota counts these Pods.
#
#   platform-tenant-overhead  (priority 100)
#     For platform-managed Pods that LIVE IN a tenant namespace because
#     they need to mount a tenant PVC (file-manager). Tenant ResourceQuota
#     EXEMPTS this class via scopeSelector — eliminates the previous
#     SYSTEM_CPU_RESERVE/SYSTEM_MEMORY_RESERVE padding.
#     Priority > tenant-default so file-manager survives cluster
#     contention before tenant pods are evicted.
#
#   platform-storage-ops      (priority 1000)
#     For storage-lifecycle Jobs (fsck / snapshot / restore) and other
#     short-lived recovery operations that run in `platform-tenant-ops`
#     namespace. Above tenant tiers because these are recovery
#     actions — losing them mid-flight risks data integrity.
#
#   platform-critical         (priority 10000)
#     The platform's long-running system workloads (platform-api,
#     panels, CNPG system-db, mail, webmail, monitoring, …). Without
#     this they fell to tenant-default (globalDefault) priority 0 and
#     ranked EQUAL to tenant pods in kubelet eviction. Assigned by
#     blanket kustomize patches (base + production overlay) on
#     Deployments/StatefulSets/CronJobs; host-agent DaemonSets keep
#     their explicit system-node-critical (2e9) and are deliberately
#     NOT blanket-patched. Kubelet eviction ranks exceeds-requests
#     pods by ascending priority, so tenant pods (0/100) always go
#     first. Above platform-storage-ops: a storage Job is retryable,
#     the API/DB spine is not.
#
# Cluster-system / node-critical Pods retain their own existing
# PriorityClasses (system-cluster-critical 2_000_000_000 etc.); those
# are unaffected by globalDefault since K8s only applies the default
# when priorityClassName is unset.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: tenant-default
value: 0
globalDefault: true
description: "Default priority for tenant workloads. Counts against the tenant ResourceQuota."
preemptionPolicy: PreemptLowerPriority
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-tenant-overhead
value: 100
globalDefault: false
description: "Platform-managed Pods running inside a tenant namespace (file-manager etc.). Exempt from client ResourceQuota."
preemptionPolicy: PreemptLowerPriority
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-storage-ops
value: 1000
globalDefault: false
description: "Short-lived storage-lifecycle Jobs (fsck / snapshot / restore) running in the platform-tenant-ops namespace."
preemptionPolicy: PreemptLowerPriority
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-critical
value: 10000
globalDefault: false
description: "Insula platform system workloads. Evicted only after every tenant-tier pod; below system-node-critical host agents."
preemptionPolicy: PreemptLowerPriority
