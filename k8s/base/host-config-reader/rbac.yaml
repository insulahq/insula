# Least-privilege identity the host-config converger uses ON WORKER NODES.
#
# Control-plane nodes read the desired-state ConfigMaps via the k3s admin
# kubeconfig (/etc/rancher/k3s/k3s.yaml). Worker nodes (k3s agents) have NO such
# kubeconfig — so `platform-ops host-config` could never reach the cluster on a
# worker and host-migrations / sysctls / packages never converged there.
#
# The host-config-kubeconfig DaemonSet (daemonset.yaml) writes a kubeconfig
# bound to THIS ServiceAccount onto each worker host. Its only power is `get` on
# the five named desired-state ConfigMaps — it can read the host-config policy
# and nothing else (no list, no write, no other resources, no other namespace).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: host-config-reader
  namespace: platform-system
  labels:
    app.kubernetes.io/name: host-config-reader
    app.kubernetes.io/part-of: hosting-platform
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: host-config-reader
  namespace: platform-system
  labels:
    app.kubernetes.io/name: host-config-reader
    app.kubernetes.io/part-of: hosting-platform
rules:
  # get-by-NAME only — host-config reads each desired-state CM by name
  # (readNamespacedConfigMap). resourceNames scopes this to exactly the five
  # policy CMs; it grants no `list` (which can't be name-scoped) so the token
  # can't enumerate other ConfigMaps in the namespace.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - host-config-desired
      - host-packages-desired
      - host-migrations-desired
      - host-ulimits-desired
      - host-modules-desired
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: host-config-reader
  namespace: platform-system
  labels:
    app.kubernetes.io/name: host-config-reader
    app.kubernetes.io/part-of: hosting-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: host-config-reader
subjects:
  - kind: ServiceAccount
    name: host-config-reader
    namespace: platform-system
---
# `platform-version` lives in the `platform` namespace, NOT platform-system, so
# the Role above (which is namespaced to platform-system) never covered it.
#
# That one gap made every WORKER node invisible to release pinning: self-upgrade
# reads this ConfigMap to learn the cluster's target version, the read 403'd, and
# it fell back to the "newest STABLE GitHub Release" path — which can never
# select a prerelease. Control-plane nodes were unaffected because they use the
# k3s admin kubeconfig. Net effect: on any multi-node cluster, host state
# (firewall shape, sysctls, packages, host-migrations) silently diverged between
# control-plane and workers for the whole life of an RC, so nothing host-side was
# ever really validated before a stable cut.
#
# Same least-privilege shape as above: `get` on ONE ConfigMap by name. No list
# (which cannot be name-scoped), no write, nothing else in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: host-config-reader-platform-version
  namespace: platform
  labels:
    app.kubernetes.io/name: host-config-reader
    app.kubernetes.io/part-of: hosting-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["platform-version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: host-config-reader-platform-version
  namespace: platform
  labels:
    app.kubernetes.io/name: host-config-reader
    app.kubernetes.io/part-of: hosting-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: host-config-reader-platform-version
subjects:
  # The SA lives in platform-system; a RoleBinding in `platform` may name a
  # subject from another namespace, which is what keeps this to a single extra
  # grant instead of a second ServiceAccount.
  - kind: ServiceAccount
    name: host-config-reader
    namespace: platform-system
