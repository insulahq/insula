# vmsingle stream-aggregation config (-streamAggr.config).
#
# WHY THIS EXISTS
# Traefik's two latency histograms were 2,288 series — 13% of the whole TSDB
# and the single largest thing in it — because Traefik labels every bucket with
# code x method x protocol on top of entrypoint/service. Both readers throw all
# of that away:
#
#   panel  histogram_quantile(0.95, sum by (le) (
#            rate(traefik_entrypoint_request_duration_seconds_bucket{entrypoint="websecure"}[5m])))
#   rule   1 - sum(rate(traefik_service_request_duration_seconds_bucket{
#                        service=~"(platform|mail)-.*",le="1.2"}[30m]))
#            / sum(rate(... le="+Inf" ...[30m]))
#
# i.e. 1,320 series are stored to answer a question that needs ~11.
#
# Relabeling CANNOT fix this: dropping `code`/`method` off a counter collapses
# several series onto one label set and VM keeps a single arbitrary sample —
# silently wrong, not merely lossy. Summing has to happen BEFORE storage, which
# is exactly what stream aggregation does.
#
# `outputs: [total]` emits the summed counter increase as an ever-increasing
# counter, so rate()/increase() over the aggregate behave exactly as they did
# over the raw series, and counter resets in the inputs are handled.
# `keep_metric_names: true` keeps the metric name unchanged so NO query has to
# change (VM allows it only with a single output).
#
# Matched raw samples are aggregated AND DROPPED — that is vmsingle's default
# (-streamAggr.keepInput=false), which is what makes this a saving rather than
# an addition. Anything not matched here is stored untouched.
#
# `by:` IS THE CONTRACT. It must list every label the readers above group by or
# filter on. Adding a query that filters these histograms on `code`, `method`
# or `protocol` requires changing this file first — the label will not exist.
#
# READ-DRIVEN COUNTERS (second block below). The same reasoning applies to
# Traefik's request/byte/duration COUNTERS, which carry code x method x
# protocol per service: every reader (traffic charts, the bandwidth meter,
# the 5xx SLO rule) groups or filters only by `service` and `node`, or by
# `entrypoint` and `code`. They were 5.8-10.5x more series than any query
# uses, and they grow with every tenant route. See read-driven-relabel.yaml
# for the rest of the read-driven policy.
#
# One known cost, accepted: aggregation state lives in memory, so after each
# vmsingle restart (daily, by the recycler) the first sample of every input is
# a baseline, not an increase — about one scrape interval of Traefik-counted
# traffic per restart is not counted (~0.1%/day). It under-counts, never
# over-counts, which is the safe direction for figures tenants are billed
# against; the bandwidth meter also clamps against measured network bytes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmsingle-streamaggr-config
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: hosting-platform
data:
  streamaggr.yaml: |
    # Per-entrypoint p95 latency panel. Readers group by `le` and filter on
    # `entrypoint`; nothing else is used. 1,320 -> entrypoints x le buckets.
    - match: 'traefik_entrypoint_request_duration_seconds_bucket'
      interval: 60s
      by: [entrypoint, le]
      outputs: [total]
      keep_metric_names: true
      ignore_first_intervals: 1

    # platform/mail latency SLO rule. Reader filters on `service` and `le`.
    # The scrape config already drops this family for tenant services, so the
    # input here is platform/mail only. 968 -> services x le buckets.
    - match: 'traefik_service_request_duration_seconds_bucket'
      interval: 60s
      by: [service, le]
      outputs: [total]
      keep_metric_names: true
      ignore_first_intervals: 1

    # ── Read-driven counters (see header) ──────────────────────────────────
    # Traffic charts, request-rate and latency charts, and the bandwidth meter
    # filter on `service` (and `node` for the node scope) and nothing else.
    - match: 'traefik_service_requests_total'
      interval: 60s
      by: [service, node]
      outputs: [total]
      keep_metric_names: true
      ignore_first_intervals: 1
    - match: 'traefik_service_requests_bytes_total'
      interval: 60s
      by: [service, node]
      outputs: [total]
      keep_metric_names: true
      ignore_first_intervals: 1
    - match: 'traefik_service_responses_bytes_total'
      interval: 60s
      by: [service, node]
      outputs: [total]
      keep_metric_names: true
      ignore_first_intervals: 1
    - match: 'traefik_service_request_duration_seconds_sum'
      interval: 60s
      by: [service, node]
      outputs: [total]
      keep_metric_names: true
      ignore_first_intervals: 1
    - match: 'traefik_service_request_duration_seconds_count'
      interval: 60s
      by: [service, node]
      outputs: [total]
      keep_metric_names: true
      ignore_first_intervals: 1

    # 5xx error-rate SLO rule and panel: `entrypoint` and `code` only.
    - match: 'traefik_entrypoint_requests_total'
      interval: 60s
      by: [entrypoint, code]
      outputs: [total]
      keep_metric_names: true
      ignore_first_intervals: 1
