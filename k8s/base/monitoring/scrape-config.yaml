# vmsingle scrape configuration (Prometheus-compatible, consumed via
# -promscrape.config). Scrape budget is deliberately tiny: 60s interval,
# a hard metric allowlist on the only unbounded job (cadvisor), and only
# endpoints that already exist on the cluster — no exporter sidecars,
# no node-exporter, no kube-state-metrics (ADR-051; the platform's own
# node-health/cluster-health modules cover object state via the K8s API).
#
# ─── envsubst WARNING ────────────────────────────────────────────────
# Flux postBuild.substituteFrom runs envsubst over this rendered file.
# In relabel `replacement` fields ALWAYS write `$1`, NEVER `${1}` —
# `${1}` is eaten/crashed by envsubst (ci-flux-envsubst-check.sh guards
# the class), while a bare `$1` passes through untouched.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmsingle-scrape-config
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: hosting-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 60s
      scrape_timeout: 10s

    scrape_configs:
      # ── vmsingle self ────────────────────────────────────────────
      # -http.pathPrefix=/metrics moves vmsingle's own exposition
      # endpoint from /metrics to /metrics/metrics.
      - job_name: vmsingle
        metrics_path: /metrics/metrics
        static_configs:
          - targets: ['localhost:8428']
        metric_relabel_configs:
          # `flag` is one series per command-line flag (276 of them) whose
          # value never changes while the process lives. It is configuration
          # printed as telemetry — readable any time from the Deployment.
          - source_labels: [__name__]
            regex: 'flag'
            action: drop
          # vmsingle's self-scrape was the largest job in the TSDB after Flux
          # (1366 series on production), and its histograms are the
          # bulk of it: vm_promscrape_push_data_duration_seconds_bucket 96,
          # vm_rows_read_per_query_bucket 53, vmselect_request_duration_seconds_bucket
          # 51, vm_rows_scanned_per_query_bucket 50, vm_rows_per_insert_bucket 44,
          # plus the go_* runtime families.
          #
          # Nothing queries any of them, and they are not what you reach for
          # when this pod is in trouble — diagnosing the OOM-kills that
          # motivated this change used vm_cache_size_bytes, vm_data_size_bytes,
          # go_memstats_heap_inuse_bytes and process_resident_memory_bytes,
          # every one of which is a GAUGE and survives this rule. A monitoring
          # system's own percentile distributions are the first thing to cut
          # when the monitoring system is the thing running out of memory.
          - source_labels: [__name__]
            regex: '.*_bucket'
            action: drop

      # ── kubelet: container CPU/mem/fs (cadvisor) ─────────────────
      # Bearer-token authn against the kubelet's HTTPS port; the k3s
      # kubelet serving cert is not verifiable from the SA CA bundle,
      # so verification is skipped (authn stays cryptographic — same
      # posture kube-prometheus-stack ships on k3s).
      # CARDINALITY GUARD: keep ONLY what the SLO rule pack reads. Extend
      # the regex deliberately, never wholesale.
      # (This used to claim cadvisor was the ONLY job that scales with tenant
      # count. It is not — traefik_service_* is per backend service and grew
      # to 115 bucket series at 6 tenants before it was dropped.
      # Any new job that carries a per-workload label belongs on that list.)
      - job_name: kubelet-cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          # container_network_transmit_bytes_total: per-tenant bandwidth
          # metering (namespace-labelled; the backend sums per namespace via
          # increase(), which absorbs counter resets + pod churn). Bounded
          # extra cardinality (~pods×interfaces); everything else stays dropped.
          # container_oom_events_total: kernel OOM detection —
          # sourced from cgroup memory.events, so it works even where the
          # kubelet's kmsg oomparser is broken ("/dev/kmsg: broken pipe",
          # observed live on DEV: kernel OOM kills produced NO SystemOOM
          # event). id="/" = global kernel OOMs; per-namespace series feed
          # the system-container-oom SLO rule. One series per container.
          - source_labels: [__name__]
            regex: 'container_(memory_working_set_bytes|cpu_usage_seconds_total|network_(transmit|receive)_bytes_total|oom_events_total)|machine_memory_bytes|machine_cpu_cores'
            action: keep
          # Drop the CNI plumbing. cAdvisor attributes every host interface to
          # the root cgroup (and to any hostNetwork pod), so one Calico veth per
          # pod is reported twice over — 570 of 681 network series on the
          # reference cluster, all of it churn that turns over with pod
          # lifetime. What is left is the real thing: `eth0` inside each pod's
          # netns (per-tenant metering, one series per pod per direction) and
          # `eth0` on the root cgroup (the node's actual NIC, which is where
          # per-node and cluster-total traffic come from — no node-exporter
          # required).
          #
          # Safe for billing by measurement, not by argument: every series in a
          # `tenant-*` namespace carries interface="eth0" and nothing else, so
          # the bandwidth meter's totals are untouched. Verified on the
          # reference cluster before this rule was written.
          # Listed by what is virtual rather than by keeping `eth0`: a node's
          # NIC is `eth0` here but `ens3`/`enp1s0`/`eno1` on other providers,
          # and hardcoding one name would silently lose node traffic on any
          # host that does not use it. A mesh interface (`wt0`, `wg0`) carries
          # real traffic and is kept; Calico's own `wireguard.cali` and
          # `vxlan.calico` are encapsulation of pod traffic already counted at
          # the pod, so they are dropped.
          # `vxlan.*`/`wireguard.*` are KEPT, unlike the rest of this list.
          # They are Calico's inter-node encapsulation — one or two series per
          # node, not per pod, so they cost nothing — and they are the only
          # measurement of node-to-node traffic there is. They are a SUBSET of
          # what the NIC already carries (the tunnel rides over it), so the
          # queries must present them as a subset and never add them to the
          # wire total.
          - source_labels: [__name__, interface]
            regex: 'container_network_[^;]*;(cali[0-9a-f].*|tunl.*|veth.*|docker.*|br-.*|flannel.*|cni.*|dummy.*|nodelocaldns.*|kube-ipvs.*|lo)'
            action: drop
          # CHURN GUARD: the pod NAME is a label, so a CronJob that fires every
          # 2 minutes mints a brand-new set of series 720 times a day and every
          # one of them stays in the index for the full 30d retention. Measured
          # on the reference cluster: 577 distinct pods seen in 24h against 98
          # actually running (5.9x), driving the tsid cache 57,265 -> 172,805
          # entries over nineteen days at a dead-linear +6,100/day while only
          # 17,391 series were live. That index growth is what pushed the Go
          # heap into GOMEMLIMIT and OOM-killed this pod.
          #
          # Dropped by pod-name prefix rather than by a generic CronJob-pod
          # regex ON PURPOSE: real batch work (bk-files/bk-mbox/barman/
          # platform-*-backup) DOES get OOM-killed and its
          # container_oom_events_total is load-bearing. These three are
          # short-lived guards and reconcilers whose own failure is already
          # reported as a failed Job. Add a prefix here only when the pod is
          # BOTH high-frequency AND separately monitored.
          #
          # Cadence is deliberately NOT relaxed to buy this back: traefik-plugin-guard
          # runs every 2 min to bound a plugin outage, and that detection window
          # is worth more than the series were costing.
          - source_labels: [pod]
            regex: '(traefik-plugin-guard|ingress-external-ips-reconciler|version-poller)-[0-9]+-[a-z0-9]+'
            action: drop

      # ── kubelet: /metrics/resource — REMOVED ───────────────────
      # This job was 100% redundant. It served five families and NOTHING
      # read any of them:
      #   pod_cpu_usage_seconds_total        456 series  — unread
      #   pod_memory_working_set_bytes       456 series  — unread
      #   container_start_time_seconds       464 series  — unread
      #   container_cpu_usage_seconds_total   —  a DUPLICATE of cadvisor's
      #   container_memory_working_set_bytes  —  a DUPLICATE of cadvisor's
      # Verified against every real query: the code reads
      # container_memory_working_set_bytes{id="/"} and machine_memory_bytes,
      # both of which carry an `id` label this endpoint never emits, so they
      # can only ever have come from cadvisor. The 48h query log on both
      # clusters confirms no reader.
      #
      # It was also an UNGUARDED second source of tenant-scaling, pod-name
      # churn — it had no keep-list at all, only a swap-metric drop — while
      # the cadvisor comment above claimed cadvisor was the only such job.
      #
      # If pod-level (as opposed to container-level) accounting is ever
      # needed, restore this job WITH a keep-list; do not restore it bare.

      # ── kubelet: PVC usage ──────────────────────────────────────
      # kubelet_volume_stats_* live on the kubelet's MAIN /metrics endpoint,
      # not /metrics/cadvisor or /metrics/resource, hence a third kubelet job.
      # This is what makes per-tenant storage usage real: it previously came
      # only from the file-manager sidecar's /disk-usage, and that sidecar runs
      # at replicas: 0 unless a tenant has the file browser open, so usage read
      # 0 nearly always. Two series per PVC — negligible cardinality.
      #
      # The kubelet only reports volumes it has MOUNTED, so a tenant with every
      # workload stopped reports nothing; the backend keeps the file-manager
      # probe as a fallback for that case.
      - job_name: kubelet-volumes
        scheme: https
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'kubelet_volume_stats_(used|capacity|available)_bytes'
            action: keep

      # ── Traefik (entrypoint request/duration metrics, :9100) ────
      # The helm chart (40.x) serves prometheus metrics on the
      # `metrics` entrypoint by default; pod-level scrape, no Service
      # exposure needed.
      - job_name: traefik
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [traefik]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: traefik
            action: keep
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '$1:9100'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
        metric_relabel_configs:
          # CARDINALITY: traefik_service_* is per BACKEND SERVICE, so it grows
          # with tenant workloads exactly like cadvisor does — the header
          # comment above calling cadvisor "the only job whose series count
          # grows with tenant count" was wrong. The _bucket family alone was
          # 115 series on production at 6 tenants, the single
          # largest metric name in this job.
          #
          # It is no longer dropped WHOLESALE. The
          # `platform-latency-slow-share` SLO rule needs per-service buckets to
          # separate the platform's own surfaces from tenant websites — scoring
          # a tenant's slow app as a platform SLO breach is what made the old
          # entrypoint-wide p95 rule unusable. So the buckets are kept for
          # `platform-*` and `mail-*` services and dropped for everything else.
          #
          # The bound is what matters: the Traefik `service` label is
          # `<namespace>-<ingress>-<hash>@kubernetescrd`, and tenant namespaces
          # are always `tenant-*`, so the kept set is FIXED-SIZE (5 services on
          # production) and does NOT grow with tenant count — which was the
          # entire reason for the original drop. Tenant buckets, the part that
          # scaled, stay dropped; their _sum and _count survive, so per-service
          # average latency is still derivable for every tenant.
          #
          # Two steps because RE2 has no negative lookahead: mark the series to
          # keep, then drop unmarked ones. `__tmp_*` is stripped automatically
          # at the end of relabeling, so it never reaches storage.
          - source_labels: [__name__, service]
            separator: ';'
            regex: 'traefik_service_request_duration_seconds_bucket;(platform|mail)-.*'
            target_label: __tmp_keep_service_bucket
            replacement: 'yes'
            action: replace
          - source_labels: [__name__, __tmp_keep_service_bucket]
            separator: ';'
            regex: 'traefik_service_request_duration_seconds_bucket;'
            action: drop
          # Go runtime histograms — GC pause / scheduler latency distributions
          # of the Traefik process. Never queried, and dropped on every Go
          # target in this file for the same reason. Gauges (go_memstats_*,
          # go_goroutines) are kept: they are what you actually read when a
          # component looks unhealthy.
          - source_labels: [__name__]
            regex: 'go_.*_bucket'
            action: drop

          # Families with no reader, verified against the 48h query log on
          # both clusters and against every PromQL string in the backend:
          #   traefik_service_requests_tls_total               196 series
          #   traefik_entrypoint_requests_bytes_total          120
          #   traefik_entrypoint_responses_bytes_total         120
          #   traefik_entrypoint_request_duration_seconds_sum  120
          #   traefik_entrypoint_request_duration_seconds_count 120
          #   traefik_tls_certs_not_after                       37
          # Per-tenant byte accounting comes from traefik_service_{requests,
          # responses}_bytes_total (kept) and per-entrypoint latency comes from
          # the _bucket family (kept, and stream-aggregated — see
          # streamaggr-config.yaml). Certificate expiry is cert-manager's job.
          - source_labels: [__name__]
            regex: 'traefik_(service_requests_tls_total|entrypoint_(requests|responses)_bytes_total|entrypoint_request_duration_seconds_(sum|count)|tls_certs_not_after)'
            action: drop

      # ── cert-manager (certificate expiry/readiness, :9402) ──────
      - job_name: cert-manager
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [cert-manager]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: controller
            action: keep
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '$1:9402'
            target_label: __address__
        metric_relabel_configs:
          # Go runtime histograms — see the traefik job. certmanager_* (the
          # expiry/readiness metrics this job exists for) is untouched.
          - source_labels: [__name__]
            regex: 'go_.*_bucket'
            action: drop

          # Three per-certificate timestamp families (42 series each) that no
          # rule or panel reads. The one the alert pack DOES read —
          # certmanager_certificate_expiration_timestamp_seconds — is kept, as
          # is certmanager_certificate_ready_status. `not_after` is the same
          # instant as `expiration`; `renewal`/`not_before` are unused.
          - source_labels: [__name__]
            regex: 'certmanager_certificate_(renewal|not_before|not_after)_timestamp_seconds'
            action: drop

      # ── Longhorn (volume/node storage metrics, :9500) ────────────
      - job_name: longhorn
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [longhorn-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: longhorn-manager
            action: keep
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '$1:9500'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
        metric_relabel_configs:
          # Longhorn's client-go internals, not Longhorn's storage health:
          # rest_client_* is latency talking to the kube-apiserver, and
          # workqueue_* is its controller queue depth. 2772 series — 17% of
          # the entire TSDB — measuring a library. Volume/replica/snapshot
          # metrics (longhorn_volume_*, longhorn_snapshot_*) are untouched.
          - source_labels: [__name__]
            regex: 'longhorn_(rest_client|workqueue)_.*'
            action: drop
          # Go runtime histograms — see the traefik job.
          - source_labels: [__name__]
            regex: 'go_.*_bucket'
            action: drop

          # Per-volume/replica/engine state gauges: 460 series that grow with
          # tenant count and that nothing queries. The only Longhorn metrics
          # with a reader are longhorn_node_storage_{usage,capacity}_bytes
          # (the node-storage SLO rule + panel) — four series.
          #   longhorn_replica_state           204
          #   longhorn_engine_state            198
          #   longhorn_snapshot_actual_size_bytes 58
          # longhorn_volume_state and longhorn_volume_robustness are KEPT:
          # 'degraded' is the first sign of a replica problem and is worth
          # having in the TSDB even unqueried. Everything dropped here is still
          # live in the Longhorn UI and its API, which the platform already
          # integrates — so the regret on these is bounded.
          - source_labels: [__name__]
            regex: 'longhorn_(replica_state|engine_state|snapshot_actual_size_bytes)'
            action: drop

      # ── Flux controllers (reconcile health, :8080 http-prom) ─────
      - job_name: flux
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [flux-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: (source|kustomize|helm|notification)-controller
            action: keep
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '$1:8080'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: controller
        metric_relabel_configs:
          # Same client-go queue internals as the Longhorn job.
          # NOTE: no platform reader uses any Flux family — the Flux SLO rule
          # reads platform-api's platform_flux_unready_resources — so
          # read-driven-relabel.yaml stores only `up` for this job. These drops
          # still save the relabel work.
          - source_labels: [__name__]
            regex: 'workqueue_.*|rest_client_.*'
            action: drop
          # The four Flux controllers were the single largest job in the TSDB
          # (1226 series on production) and most of it is Go runtime
          # internals: go_gc_heap_allocs_by_size_bytes_bucket and its _frees
          # twin are 48 series EACH per controller, plus five go_sched_pauses_*
          # families at 32 each. None of it is queried.
          - source_labels: [__name__]
            regex: 'go_.*_bucket'
            action: drop
          # controller-runtime's own reconcile-duration histogram (82 series).
          - source_labels: [__name__]
            regex: 'controller_runtime_reconcile_time_seconds_bucket'
            action: drop

      # ── CNPG / system-db (postgres exporter, :9187) ──────────────
      # CNPG instance pods always serve metrics on 9187; scraped
      # directly — the Cluster CR's enablePodMonitor stays false
      # because the PodMonitor CRD (prometheus-operator) is
      # deliberately not installed (ADR-051).
      - job_name: cnpg
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [platform]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            regex: .+
            action: keep
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '$1:9187'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          # One series per Postgres GUC (284 of them), constant until the
          # cluster is reconfigured — configuration, not telemetry, and
          # readable from the CNPG Cluster CR. Postgres runtime metrics
          # (cnpg_backends_*, cnpg_pg_replication_*, …) are kept.
          - source_labels: [__name__]
            regex: 'cnpg_pg_settings_setting'
            action: drop
          # Go runtime histograms — see the traefik job.
          - source_labels: [__name__]
            regex: 'go_.*_bucket'
            action: drop

      # ── platform-api (:9090 — ADR-051 phase 2) ───────────────────
      # First-party metrics: HTTP histogram, ACME order/renewal
      # counters (the #43 LE-storm canary), mail TLS expiry, Stalwart
      # task-queue depth. Dedicated port; netpol
      # allow-monitoring-to-platform-api-metrics scopes it to us.
      - job_name: platform-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [platform]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: platform-api
            action: keep
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '$1:9090'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          # 570 series on production — 72% of everything this job
          # produces, and the largest single metric name in the whole TSDB.
          # It is one series per (route × method × status × le) and grows with
          # the API surface, not with load. Nothing reads it: there is no
          # histogram_quantile() over platform_http_* anywhere in the codebase,
          # and the p95 latency SLO is computed from Traefik's entrypoint
          # histogram instead. _sum and _count are kept, so average request
          # duration per route is still available if a panel ever wants it.
          #
          # If a percentile over first-party HTTP latency is ever needed,
          # re-enable this deliberately AND cut the label set at the same time
          # (drop `route`, or bucket statuses into 2xx/4xx/5xx) — restoring it
          # as-is puts the biggest single contributor straight back.
          - source_labels: [__name__]
            regex: 'platform_(http_request_duration_seconds|nodejs_gc_duration_seconds)_bucket'
            action: drop

      # ── CoreDNS (:9153) ──────────────────────────────────────────
      - job_name: coredns
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kube-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            regex: kube-dns
            action: keep
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '$1:9153'
            target_label: __address__
        metric_relabel_configs:
          # Go runtime histograms — see the traefik job. CoreDNS's own
          # coredns_dns_request_duration_seconds histogram is a different
          # family and is kept; it is the only latency signal for cluster DNS.
          - source_labels: [__name__]
            regex: 'go_.*_bucket'
            action: drop
          # CoreDNS histograms with no reader (306 series):
          #   coredns_proxy_request_duration_seconds_bucket            102
          #   coredns_kubernetes_dns_programming_duration_seconds_bucket 84
          #   coredns_dns_response_size_bytes_bucket                    60
          #   coredns_dns_request_size_bytes_bucket                     60
          # coredns_dns_request_duration_seconds_bucket is deliberately NOT in
          # this list — per the note above it is the only latency signal for
          # cluster DNS, and it is small.
          - source_labels: [__name__]
            regex: 'coredns_(proxy_request_duration_seconds|kubernetes_dns_programming_duration_seconds|dns_(request|response)_size_bytes)_bucket'
            action: drop
