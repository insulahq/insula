# VictoriaMetrics single-node — the entire metrics stack in one pod
# (ADR-051): scraper (-promscrape.config), TSDB, query API, VMUI.
#
# Memory is the design constraint: requests 128Mi / limit 384Mi, held
# by THREE budgets that must be read together, because the first one
# alone does not add up (it OOM-killed this pod every ~2 days until
# and once more — see
# below):
#   -memory.allowedBytes  VM's own caches, allocated OUTSIDE the Go heap
#   GOGC / GOMEMLIMIT     the Go runtime, which allowedBytes cannot see
#   metric_relabel_configs in scrape-config.yaml — series never ingested
# plus two terms that do not depend on load and that no budget above sees:
#   GOMAXPROCS            write buffers sized per CPU core (pinned below)
#   recycler sidecar      memory that grows with UPTIME, bounded by a daily
#                         graceful restart (vmsingle-recycler.yaml)
# The original comment claimed allowedBytes capped the caches "well under
# the limit". True of the caches (192MiB of 384Mi) and irrelevant to the
# outcome: allowedBytes budgets ONLY the caches, while the Go runtime
# needs the same cgroup. 192 MiB of caches + ~246 MiB of Go runtime does
# not fit in 384 MiB, and the limit only held because the caches never
# claimed what they had been permitted. See the per-flag notes below. The
# PVC is 2Gi on purpose — ~10-15k series at 60s is ~15-30MB/day at
# VM's sub-byte/sample compression, so 30d retention fits in <1GB;
# -storage.minFreeDiskSpaceBytes flips ingestion read-only before the
# disk fills (queries keep working, scrape-target alerts surface it)
# instead of crash-looping.
#
# ───, after the 08-30 three-budget fix ───────────
# The fix reduced the OOM cadence (~2 days → ~4) but did not end it: one
# more kill at 05:03. Live numbers from the running pod:
#   vm_cache_size_bytes total        105.8 MiB   (was ~126)
#     ...of which storage/tsid 32 + metricIDs 31.2 + metricName 31.2
#        = 94.4 MiB is fastcache's hard 32-MiB-per-cache FLOOR
#   go_memstats_heap_inuse_bytes     144.8 MiB
#   go_memstats_heap_sys_bytes       220.2 MiB  (51.7 released)
#   process_resident_memory_bytes    294.6 MiB
#   cgroup working set               325 MiB of the 384 MiB limit (85%)
#   live series                      6742
# So steady state leaves ~59 MiB of headroom and any transient crosses it.
#
# The limit was deliberately NOT raised — the platform's whole footprint is
# the budget, and this pod is ~10% of it.
# Acting on this file's own guidance ("the lever is storing LESS —
# retention, or a harder series cut"), and with retention held at 30d by
# the same decision, the change is a series cut in scrape-config.yaml:
# unqueried histogram _bucket families on the four jobs that had no
# metric_relabel_configs at all, plus Go-runtime histograms everywhere.
#
# GOGC and GOMEMLIMIT were left alone ON PURPOSE. Both are derived from
# measurements recorded below, GOGC's target scales off live heap (so the
# series cut lowers the absolute target for free), and this file has a
# history of predictions here being wrong twice over. Re-derive them from
# a fresh vm_cache_size_bytes reading if the cut proves insufficient —
# do not guess.
#
# Version pin: latest stable OSS release (golden rule). The original
# ADR-051 intent was the v1.136.x LTS line, but VictoriaMetrics ships
# LTS images for ENTERPRISE only — the OSS image has just the rolling
# line (discovered live: v1.136.11 = ImagePullBackOff, only
# -enterprise tags exist). Bumps flow through the ADR-050 component
# watch. Registry entry: security/components.yaml `victoria-metrics`
# (pin_check enforces this file matches).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmsingle
  namespace: monitoring
  labels:
    app: vmsingle
    app.kubernetes.io/part-of: hosting-platform
spec:
  replicas: 1
  # RWO PVC — never two pods against the same volume during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vmsingle
  template:
    metadata:
      labels:
        app: vmsingle
        app.kubernetes.io/part-of: hosting-platform
    spec:
      serviceAccountName: vmsingle
      # Needed for kubernetes_sd_configs + kubelet bearer-token scrape.
      automountServiceAccountToken: true
      # Lets the `recycler` sidecar signal vmsingle for its daily graceful
      # restart (vmsingle-recycler.yaml). Both containers run as the same
      # unprivileged UID with no capabilities; the sidecar gains nothing it
      # does not already have (it mounts the same service-account token).
      shareProcessNamespace: true
      # Pin to server nodes: the system-node-affinity component only
      # patches the platform/platform-system/mail namespaces, so this
      # Deployment carries its own selector + toleration inline.
      nodeSelector:
        insula.host/node-role: server
      tolerations:
        - key: insula.host/server-only
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmsingle
          image: victoriametrics/victoria-metrics:v1.148.0
          args:
            - -promscrape.config=/config/prometheus.yml
            # Re-read the scrape config every minute — without this VM
            # NEVER reloads it (default configCheckInterval=0), so
            # ConfigMap-delivered job changes only land on pod restart
            # (caught live: the platform-api job sat unloaded
            # after the PR #52 rollout).
            - -promscrape.configCheckInterval=1m
            - -storageDataPath=/storage
            - -retentionPeriod=30d
            # This bounds the WORST CASE, not the steady state. Read the
            # measurement before changing it — the obvious assumption is wrong.
            #
            # What it does do: every cache CEILING is derived from this number,
            # and the sum of ceilings fell from ~530 MiB to ~361 MiB when it
            # went 192MiB → 64MiB. That matters, because ~530 MiB of permitted
            # cache above a 384 MiB container limit meant a single cache-warming
            # query could OOM the pod outright.
            #
            # What it does NOT do: reduce the memory actually held. Measured on
            # DEV before and after the change, same workload, ~15.5k series:
            #   vm_cache_size_bytes total   123.8 MiB  →  ~123 MiB
            # i.e. no change. VictoriaMetrics enforces internal FLOORS these
            # caches never drop below — storage/tsid, metricIDs and metricName
            # each sit at 32 MiB whether the ceiling is 128 MiB or 64 MiB, and
            # metricIDs/metricName kept a 64 MiB ceiling at BOTH settings. An
            # earlier version of this comment predicted "~30 MiB" here; that
            # was a projection from the flag value and the measurement
            # disproved it.
            #
            # So lowering this further buys nothing, and the ~126 MiB of
            # fastcache is a fixed cost of running VictoriaMetrics at all. That
            # number is load-bearing: GOMEMLIMIT below is derived from it,
            # because it is exactly the part of the cgroup the Go runtime
            # cannot see. If more headroom is ever needed the lever is storing
            # LESS — retention, or a harder series cut — not this flag.
            #
            # These caches are fastcache-backed = anonymous mmap OUTSIDE the
            # Go heap, so they are invisible to GOMEMLIMIT too and are the
            # reason GOMEMLIMIT is set well below the container limit.
            # Re-measure vm_cache_size_bytes against vm_cache_entries before
            # trusting any prediction about this value, including this one.
            - -memory.allowedBytes=64MiB
            # PER-CACHE CEILINGS. -memory.allowedBytes budgets the caches only
            # as a GROUP; these bound them individually.
            #
            # ★ WHAT THIS DOES AND DOES NOT DO — MEASURED, because the obvious
            # reading is wrong in both directions:
            #
            # It DOES apply. The startup log is the proof, not
            # vm_cache_size_max_bytes:
            #     loaded cache at /storage/cache/metricName_tsid
            #       in modeWhole with maxSize 16777216 bytes
            # ★ vm_cache_size_max_bytes{type="storage/tsid"} MISREPORTS these —
            # it keeps reporting the -memory.allowedBytes budget (64 MiB) no
            # matter what the override is set to. Read the startup log instead.
            # The indexdb caches below DO report their override correctly.
            #
            # It does NOT reduce resident memory. storage/tsid, metricIDs and
            # metricName each report vm_cache_size_bytes = exactly 33,554,432
            # (32 MiB) — and measured on DEV, that number was identical before
            # and after this flag. 32 MiB is fastcache's own allocation floor
            # (512 buckets x 64 KiB chunk), so the caches cannot be made
            # smaller than that by any flag. The earlier "~126 MiB of fastcache
            # is a fixed cost" conclusion was therefore RIGHT about the floor —
            # what was wrong was believing the CEILING could not be bounded.
            #
            # So this is a worst-case bound, not a saving: it caps the ceiling
            # at the value these caches already occupy, instead of leaving them
            # free to grow to the 64 MiB that -memory.allowedBytes permits.
            # That is worth having — a cache-warming query reaching 64 MiB on
            # each of two caches is 64 MiB of headroom gone — but do NOT budget
            # any freed memory against it.
            #
            # 32MiB, not lower: the floor is 32 MiB anyway, so a smaller value
            # buys nothing and only risks eviction (the flag's own help warns a
            # too-small value costs CPU and disk IO — the exact failure being
            # fixed here). storage/metricIDs has NO override flag.
            - -storage.cacheSizeStorageTSID=32MiB
            - -storage.cacheSizeStorageMetricName=32MiB
            # Bound the indexdb caches too. Both sit well under these today
            # (dataBlocks 6.4 MiB, indexBlocks 0.7 MiB) so this changes nothing
            # now; it caps the worst case a cache-warming query can reach.
            - -storage.cacheSizeIndexDBDataBlocks=16MiB
            - -storage.cacheSizeIndexDBIndexBlocks=8MiB
            # Sum traefik's latency histograms BEFORE storage instead of
            # storing every code x method x protocol permutation and throwing
            # them away at query time. See streamaggr-config.yaml — the `by:`
            # lists there are a contract with the queries in
            # backend/src/modules/monitoring/{rules,routes}.ts.
            # Matched samples are aggregated and DROPPED (VM's default);
            # unmatched samples are stored untouched.
            - -streamAggr.config=/streamaggr/streamaggr.yaml
            # 4 → 2. The -memory.allowedBytes note above records
            # that the failure mode is "a single cache-warming query could OOM
            # the pod outright"; this is the flag that bounds how many of those
            # can be in flight at once. The consumers are the admin panel's
            # monitoring tab and the SLO rule evaluator — neither issues
            # anything like 4 concurrent queries, and VM queues rather than
            # rejects beyond the limit, so the only cost is serialisation on a
            # burst. Bounds the transient; the steady-state lever is the series
            # cut in scrape-config.yaml.
            - -search.maxConcurrentRequests=2
            - -storage.minFreeDiskSpaceBytes=209715200
            # Serve EVERYTHING (VMUI, /api/v1/query*, /health, own
            # /metrics) under /metrics so the UI rides the admin host
            # as a path (Host(admin.<apex>) && PathPrefix(/metrics) —
            # see vmui-ingressroute.yaml) instead of a dedicated
            # subdomain + certificate. Consumers that changed with it:
            # backend vm-client DEFAULT_VM_BASE_URL, the self-scrape
            # job's metrics_path, and the probes below.
            - -http.pathPrefix=/metrics
            # Batch in-memory parts to disk every 10 min (default 5s).
            # In-memory parts stay fully queryable; the cost is up to
            # 10 min of metrics lost on an UNCLEAN shutdown (graceful
            # stops flush) — acceptable for recreatable monitoring
            # data, and it cuts steady-state write load ~100× so the
            # HA-replicated Longhorn volume (platform-storage-policy
            # scales it 1↔3 with the system tier) isn't replicating a
            # constant small-write stream across nodes.
            - -inmemoryDataFlushInterval=10m
          env:
            # Go's default GOGC=100 lets the heap double before collecting.
            # Measured in production: live heap ~89 MiB but
            # go_memstats_heap_sys 234 MiB with only 66 MiB released back —
            # ~168 MiB RESIDENT to service an 89 MiB working set. That
            # headroom is what pushed RSS to 348 MiB against a 384 MiB
            # limit and OOM-killed the pod every ~2 days.
            #
            # GOGC=40 collects at 1.4x live heap instead of 2x. The trade is
            # CPU for memory, and this pod has CPU to spare: it uses 6m of a
            # 100m request (0.6% of one core), so even tripling GC work is
            # free here. Do not copy this value to a CPU-bound service.
            - name: GOGC
              value: "40"
            # A soft ceiling the runtime GCs harder to stay under, so growth
            # degrades into GC pressure instead of an OOM kill.
            #
            # SIZED FROM THE MEASURED off-heap total, not a predicted one. This
            # was 256Mi for one afternoon and that value was useless:
            #   GOMEMLIMIT 256 MiB  (Go memory only)
            # + fastcache  126 MiB  (anonymous mmap, invisible to GOMEMLIMIT)
            # = 382 MiB             ≈ the 384 MiB cgroup limit
            # i.e. the backstop sat exactly at the OOM point and could never
            # fire before the kernel did. RSS climbed straight back to the
            # pre-change baseline (294 MiB → 292 MiB in two hours) with Go at
            # 136 MiB, far below its own ceiling, restrained by nothing.
            #
            # The error was sizing this against a PREDICTED ~30 MiB of
            # fastcache. Measurement put fastcache at ~126 MiB and did not move
            # when -memory.allowedBytes was cut (see the note above it).
            #
            #   384 MiB limit − 126 fastcache − ~40 binary/stacks/slab/slack
            #   ≈ 218 MiB available to the Go runtime
            #
            # STAYS AT 192Mi. This was briefly raised to 224Mi on the theory
            # that the per-cache ceilings above had freed ~32 MiB of off-heap
            # fastcache. MEASUREMENT REFUTED IT: vm_cache_size_bytes for
            # storage/tsid and storage/metricName read exactly 32 MiB both
            # before and after that change, because 32 MiB is fastcache's
            # allocation floor. Nothing was freed, so nothing can be spent.
            #
            # The budget that still applies, with the worst case each cache is
            # actually allowed to reach:
            #   384 MiB limit
            #   − 96 fastcache (tsid + metricIDs + metricName, 32 MiB each)
            #   − 64 promql/rollupResult (its ceiling IS -memory.allowedBytes)
            #   − ~26 indexdb caches + storage/indexBlocks
            #   − ~40 binary/stacks/slab/slack
            #   ≈ 158 MiB worst case, ~230 MiB at the caches' measured sizes
            # 192Mi sits between those, which is the same bet as before.
            #
            # What actually fixes the GC spiral is not this number — it is the
            # smaller index. Measured on DEV across this change, live heap fell
            # 138 -> 93 MiB and next_gc/alloc recovered to ~1.26.
            #
            # ★ THE 192Mi VALUE FAILED IN PRODUCTION and the reason matters
            # more than the number. It was derived from a
            # live heap MEASURED AT ~89 MiB and treated as fixed. The heap is
            # not fixed — it grows with the index, and index growth is what
            # series churn produces. It reached 164 MiB over 19 days, at which
            # point go_memstats_next_gc_bytes/go_memstats_alloc_bytes had
            # collapsed 1.21 → 1.00: the GC target equalled the live heap, so
            # Go collected continuously. GC went 0.12 → 4.88 cycles/sec (40x)
            # and user CPU 0.01 → 0.21 cores (20x) on a FLAT-LOOKING RSS,
            # because RSS was clamped by the cgroup and could not show it.
            #
            # So the number below is NOT the durable guard — the ratio is.
            # next_gc/alloc should sit near 1 + GOGC/100 (1.40 here). Drifting
            # under ~1.1 means GOMEMLIMIT is binding again and the heap, not
            # this value, is what needs attention.
            - name: GOMEMLIMIT
              value: "201326592"
            # Pins vmsingle's parallelism — and with it a fixed slice of its
            # memory — so the footprint no longer depends on the node it lands
            # on. VictoriaMetrics sizes its write buffers by CPU count
            # (v1.148.0 lib/storage/raw_row.go: numRawRowsShards =
            # cgroup.AvailableCPUs(), 8 MiB per shard, PER MONTHLY PARTITION).
            # This pod has no CPU limit, so without this it takes every core
            # of the node: 64 MiB on 8 cores, 256 MiB on 32 cores, twice that
            # once a process lives across a month boundary. With 2 it is
            # 16 MiB (32 across a boundary) on every install.
            #
            # vmsingle honours an explicit GOMAXPROCS instead of deriving one
            # (lib/cgroup/cpu.go). Two cores are far beyond this workload's
            # need (it ingests a few thousand samples per minute and uses
            # ~0.01-0.2 cores). Raise it with an overlay patch only if a very
            # large cluster shows ingestion or query latency; every step
            # costs 8 MiB per partition.
            - name: GOMAXPROCS
              value: "2"
          ports:
            - name: http
              containerPort: 8428
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: scrape-config
              mountPath: /config
              readOnly: true
            - name: streamaggr-config
              mountPath: /streamaggr
              readOnly: true
          readinessProbe:
            httpGet:
              # -http.pathPrefix moves every endpoint under /metrics.
              path: /metrics/health
              port: 8428
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics/health
              port: 8428
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # Daily graceful restart of vmsingle, so memory that accumulates with
        # uptime is bounded by a day instead of by how long the process lives.
        # Why, how and how to configure: vmsingle-recycler.yaml.
        - name: recycler
          # Same digest-pinned busybox as host-config-reader
          # (security/components.yaml `busybox`).
          image: busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
          command: ["/bin/sh", "/recycler/recycle.sh"]
          env:
            # "HH:MM" in UTC, or "off". Override with an overlay patch.
            - name: RECYCLE_AT_UTC
              value: "22:30"
          # Steady state is a shell asleep in `sleep`, ~1 MiB resident. The
          # limit is NOT sized from that: `kubectl exec` into this container
          # starts `runc init` inside the container's own memory cgroup
          # (~7 MiB anon + ~7 MiB file measured). At an 8Mi limit one exec
          # OOM-killed the sidecar, and since a pod is Ready only while EVERY
          # container is, vmsingle dropped out of its Service until the
          # sidecar came back. 32Mi leaves room for an exec session; the
          # request stays at what it actually uses.
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: recycler-script
              mountPath: /recycler
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: vmsingle-storage
        - name: recycler-script
          configMap:
            name: vmsingle-recycler
        - name: scrape-config
          configMap:
            name: vmsingle-scrape-config
        - name: streamaggr-config
          configMap:
            name: vmsingle-streamaggr-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vmsingle-storage
  namespace: monitoring
  labels:
    app: vmsingle
    app.kubernetes.io/part-of: hosting-platform
spec:
  accessModes:
    - ReadWriteOnce
  # Single Longhorn replica: metric history is recreatable by design —
  # losing the disk costs at most 30d of charts, never platform state
  # (alert state lives in the platform DB). Saves the 2× replication
  # RAM/disk/network a -ha class volume would cost (ADR-051).
  storageClassName: longhorn-system-local
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vmsingle
  namespace: monitoring
  labels:
    app: vmsingle
    app.kubernetes.io/part-of: hosting-platform
spec:
  selector:
    app: vmsingle
  ports:
    - name: http
      port: 8428
      targetPort: 8428
