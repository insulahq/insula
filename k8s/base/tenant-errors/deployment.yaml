# NOTE: the page content + nginx config are NOT inlined here. They are
# generated from the sibling directory by a configMapGenerator with the
# name-suffix hash ON, so editing either file rolls this Deployment.
#
# Both files live in ONE ConfigMap that is mounted twice: the HTML at
# /usr/share/nginx/html (re-read per request, so it was always fine) and the
# nginx config at /etc/nginx/conf.d (read once at startup, so it was NOT).
# Before a change to this ConfigMap therefore applied by halves —
# the page updated while its server config silently did not.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-errors
  namespace: platform-system
  labels:
    app.kubernetes.io/name: tenant-errors
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: tenant-errors
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-errors
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-errors
    spec:
      securityContext:
        runAsNonRoot: false
        fsGroup: 0
      # Tolerate the "no tenants here" taint (Can host tenant workloads off,
      # set by Drain tenants): a system workload must still be able to
      # start on a server whose tenants were drained.
      tolerations:
        - key: insula.host/server-only
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
      volumes:
        - name: content
          configMap:
            name: tenant-errors-content
            items:
              - key: 500.html
                path: 500.html
        - name: conf
          configMap:
            name: tenant-errors-content
            items:
              - key: default.conf
                path: default.conf
      # One replica per server, hard. Preferred anti-affinity put both on the
      # first server back after a full-cluster restart and on the only server
      # of a fresh install, and nothing moved them when the others came up.
      # The system-node-affinity component pins it to servers, so only servers
      # are spread domains: a one-server cluster still runs both (one domain,
      # skew 0). Counted per rollout revision so a rolling update never waits
      # on its own old pods. platform-api moves a doubled-up replica once a
      # server has room (system-pod-placement).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tenant-errors
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-errors
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: tenant-errors
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenant-errors
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
