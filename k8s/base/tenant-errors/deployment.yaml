# NOTE: the page content + nginx config are NOT inlined here. They are
# generated from the sibling directory by a configMapGenerator with the
# name-suffix hash ON, so editing either file rolls this Deployment.
#
# Both files live in ONE ConfigMap that is mounted twice: the HTML at
# /usr/share/nginx/html (re-read per request, so it was always fine) and the
# nginx config at /etc/nginx/conf.d (read once at startup, so it was NOT).
# Before 2026-09-05 a change to this ConfigMap therefore applied by halves —
# the page updated while its server config silently did not.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-errors
  namespace: platform-system
  labels:
    app.kubernetes.io/name: tenant-errors
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: tenant-errors
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-errors
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-errors
    spec:
      securityContext:
        runAsNonRoot: false
        fsGroup: 0
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
      volumes:
        - name: content
          configMap:
            name: tenant-errors-content
            items:
              - key: 500.html
                path: 500.html
        - name: conf
          configMap:
            name: tenant-errors-content
            items:
              - key: default.conf
                path: default.conf
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tenant-errors
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-errors
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: tenant-errors
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenant-errors
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
