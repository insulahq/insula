# NOTE: the pages and the nginx config are NOT inlined here. They are
# generated from content/ by configMapGenerators with the name-suffix hash ON
# (kustomization.yaml), so editing either rolls this Deployment.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-errors
  namespace: platform-system
  labels:
    app.kubernetes.io/name: tenant-errors
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: tenant-errors
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-errors
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-errors
    spec:
      securityContext:
        runAsNonRoot: false
        fsGroup: 0
      # Tolerate the "no tenants here" taint (Can host tenant workloads off,
      # set by Drain tenants): a system workload must still be able to
      # start on a server whose tenants were drained.
      tolerations:
        - key: insula.host/server-only
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          # The panels' nginx image; scripts/ci-nginx-image-sync.sh keeps the two equal.
          image: nginx:1.31-alpine@sha256:0563c36f94a6d3ec3584161b77859f740f7e20b4853f52c796a864ce6908e8ea
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
      volumes:
        - name: content
          configMap:
            name: tenant-errors-pages
        - name: conf
          configMap:
            name: tenant-errors-conf
      # One replica per server, hard. Preferred anti-affinity put both on the
      # first server back after a full-cluster restart and on the only server
      # of a fresh install, and nothing moved them when the others came up.
      # The system-node-affinity component pins it to servers, so only servers
      # are spread domains: a one-server cluster still runs both (one domain,
      # skew 0). Counted per rollout revision so a rolling update never waits
      # on its own old pods. platform-api moves a doubled-up replica once a
      # server has room (system-pod-placement).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tenant-errors
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-errors
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: tenant-errors
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenant-errors
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
