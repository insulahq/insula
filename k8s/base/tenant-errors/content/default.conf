# The status a page is for. Traefik's errors middleware asks for
# /{status}.html (annotation-sync.ts) and keeps the original status on the
# response, so the code in the name is the code the visitor got. Read from
# $request_uri, which an internal redirect to the template does not change
# (Traefik sends the name literally; a percent-encoded one falls to 503).
# Any other path reaches this service only through a tenant's redirect sink
# (redirect-sink.ts), when a redirect route's middleware is missing; that is
# answered as a 503.
map $request_uri $error_code {
  "~^/(?<code>[45][0-9][0-9])\.html(\?.*)?$" $code;
  default 503;
}

map $error_code $error_title {
  400 "Bad request";
  401 "Sign-in required";
  403 "Access denied";
  404 "Page not found";
  405 "Method not allowed";
  408 "Request timed out";
  410 "Page removed";
  413 "Request too large";
  429 "Too many requests";
  500 "Internal server error";
  502 "Bad gateway";
  503 "Service unavailable";
  504 "Gateway timeout";
  "~^4" "Request error";
  default "Server error";
}

map $error_code $error_message {
  400 "The request could not be understood.";
  401 "You need to sign in to see this page.";
  403 "You do not have permission to see this page.";
  404 "The page you asked for does not exist or has moved.";
  405 "This page does not accept that kind of request.";
  408 "The request took too long. Please try again.";
  410 "This page has been removed.";
  413 "The request is larger than this site accepts.";
  429 "Too many requests in a short time. Please wait a moment and try again.";
  502 "The site did not answer properly. Please try again in a few minutes.";
  503 "The site is temporarily unavailable. Please try again in a few minutes.";
  504 "The site took too long to answer. Please try again in a few minutes.";
  "~^4" "The request could not be completed.";
  default "The site ran into a problem. Please try again later.";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  server_tokens off;
  # Traefik passes these headers on with the page: an error page must not be
  # cached in place of the site.
  add_header Cache-Control "no-store" always;

  # A page shipped under the code's own name (an operator overlay merging
  # 404.html into tenant-errors-pages) wins; every other code gets the
  # template with its code, title and message filled in.
  location ~ "^/[45][0-9][0-9]\.html$" {
    try_files $uri /error.html;
  }

  location = /error.html {
    internal;
    sub_filter_once off;
    sub_filter "{{code}}" $error_code;
    sub_filter "{{title}}" $error_title;
    sub_filter "{{message}}" $error_message;
  }

  # Health check for the readiness probe.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location / {
    error_page 503 /error.html;
    return 503;
  }
}
