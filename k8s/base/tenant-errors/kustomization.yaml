# Platform-shared tenant error pages. Lives in the `platform-system`
# namespace and is referenced via explicit cross-namespace ref from
# tenant route `errors` Middlewares (set in annotation-sync.ts).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-system

resources:
  - deployment.yaml

# Generated so the name-suffix hash rolls the Deployment on any edit: nginx
# reads default.conf once at startup, so a fixed name applied changes by halves.
#
# The pages are their own ConfigMap, mounted whole at /usr/share/nginx/html,
# so an operator can brand a code by merging a page of that name into it from
# an overlay (a configMapGenerator for tenant-errors-pages with
# behavior: merge, adding e.g. 404.html). error.html is the template every
# other code is served from (content/default.conf).
configMapGenerator:
  - name: tenant-errors-pages
    files:
      - content/error.html
    options:
      labels:
        app.kubernetes.io/part-of: hosting-platform
        app.kubernetes.io/component: error-pages
  - name: tenant-errors-conf
    files:
      - content/default.conf
    options:
      labels:
        app.kubernetes.io/part-of: hosting-platform
        app.kubernetes.io/component: error-pages
