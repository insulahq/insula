# http-crawl-non_statics is SIMULATED: it still raises alerts (visible in
# `cscli alerts list` and the admin panel) but issues no ban. Promote it by
# removing the line below once you have reviewed a week of alerts and confirmed
# no legitimate crawler is caught.
#
# http-probing enforces from the start: requesting /.env, /wp-login.php and
# /phpmyadmin in sequence has no benign reading.
#
# NOTE THE UNDERSCORE in `non_statics`. The hub scenario is
# crowdsecurity/http-crawl-non_statics while every piece of documentation —
# including CrowdSec's own — writes it with a hyphen. cscli does NOT validate
# these names: an exclusion naming a scenario that does not exist is accepted
# silently and `cscli simulation status` echoes it back, so the config LOOKS
# correct while the real scenario runs live and bans. Verified on DEV
# 2026-09-05, where exactly that had happened.
# scripts/integration-waf-crowdsec.sh asserts every excluded name against
# `cscli scenarios list`.
simulation: false
exclusions:
  - crowdsecurity/http-crawl-non_statics
