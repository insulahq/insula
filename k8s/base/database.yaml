# Platform Postgres — managed by CloudNativePG operator.
#
# WHY CNPG instead of vanilla StatefulSet:
#   - Scaling 1 → 3 instances is a single CR field flip; no data
#     migration. Apply HA can flip instance count atomically.
#   - Built-in streaming replication, automatic failover, PITR
#     (point-in-time-recovery) via barman-cloud + WAL archive.
#   - Operator already installed (M10) — no new infra component.
#
# CONTRACT FOR APP CONNECTIONS:
#   The Service named `postgres` (defined below) ALWAYS routes to
#   the current primary pod (via cnpg.io/role=primary label
#   selector). Apps continue to use postgres.platform.svc:5432 —
#   no DATABASE_URL change required when failover happens or when
#   instances scale up/down. CNPG also exposes its own
#   <name>-rw / <name>-ro / <name>-r services automatically; we
#   keep the platform-named Service as a stable alias.
#
# SECRET CONTRACT:
#   platform-db-credentials must contain BOTH:
#     - username: platform   (CNPG initdb owner)
#     - password: <pwd>      (CNPG initdb password)
#     - url: postgresql://...  (consumed by backend DATABASE_URL)
#   bootstrap.sh's generate_platform_secrets() builds all three.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: system-db
  namespace: platform
  labels:
    app: postgres
    app.kubernetes.io/part-of: hosting-platform
  annotations:
    # Tell Flux to merge-patch (don't claim ownership of every field
    # via SSA Apply). Without this, Apply HA / PITR-normalize-bootstrap
    # / storage-policy reconciler patches to spec.instances or
    # spec.bootstrap or spec.storage are reverted on the next Flux
    # reconcile because Flux owns those fields and reasserts the
    # manifest values. With merge mode, runtime patches stick and
    # Flux only enforces fields the manifest explicitly sets.
    kustomize.toolkit.fluxcd.io/ssa: merge
spec:
  # Apply our `app: postgres` label to every Pod CNPG creates so
  # existing K8s NetworkPolicies (allow-platform-internal selects
  # by app=postgres) match. Without this, platform-api can't reach
  # the DB through the cluster's deny-by-default ingress posture.
  inheritedMetadata:
    labels:
      app: postgres
      app.kubernetes.io/part-of: hosting-platform
      # Canonical labels — propagate to every CNPG-created PVC/Pod/Service,
      # then mirrored from PVC → bound PV by the storage-policy reconciler.
      # Operators can do `kubectl get pv -L platform/role,platform/owner` and
      # see meaningful columns alongside the CSI-generated PV UUID.
      # canonical-name is omitted here because each CNPG instance gets its
      # own PVC name (system-db-1, system-db-2, …); only role/owner are
      # cluster-wide.
      platform/role: system-db
      platform/owner: system
      # Hourly in-volume snapshots — the `hourly-snap` RecurringJob selects
      # this group, and inheritedMetadata puts every instance PVC
      # (system-db-1/2/3 under HA) in it automatically.
      #
      # The job used to select `default`, which every tenant PVC also carries,
      # so tenant volumes were being snapshotted hourly as well — invisible in
      # both panels and unreachable by the tenant-snapshot reaper. Scoping the
      # job needs a group the platform database is alone in, and this is where
      # it joins.
      recurring-job-group.longhorn.io/system-critical: enabled
      platform/managed-by: platform-api

  # spec.instances is INTENTIONALLY OMITTED. CNPG defaults to 1 on
  # first init. Apply HA patches this imperatively via
  # patchCnpgClusters() and the patch sticks because Flux's merge-
  # patch (per the ssa: merge annotation) only re-asserts fields
  # PRESENT in the manifest. Setting `instances: 1` here would mean
  # every Flux reconcile (every 60s) reverts Apply HA's patch to 1,
  # producing the oscillation observed
  # (mail-pg-2 created → 2 min later "Scaling down — removing
  # mail-pg-2" → repeat forever).

  # PostgreSQL 18.3 on Debian 13 (Trixie). The `minimal-trixie`
  # variant excludes barman-cloud (we use the cnpg-i barman-cloud
  # plugin instead — see k8s/base/cnpg-system/ + system-backup
  # module), PGAudit, pgvector, Failover Slots. Adequate for our
  # workload (only plpgsql + 45 stock extensions used).
  # `system-*` images are deprecated as of CNPG 1.27 — never use.
  # `standard-trixie` is the upgrade path if pgvector / PGAudit /
  # failover-slots are needed in the future.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-minimal-trixie

  postgresql:
    parameters:
      # CNPG defaults this to 5min. That is an RPO control — it forces a
      # WAL segment switch so the archive is never more than one interval
      # behind — but a segment is a fixed 16 MB file whether it holds
      # 16 MB or 900 KB, and this database generates ~10 MB of WAL an
      # HOUR. Measured on production: 10.5 MB/h of actual WAL content
      # against 193.8 MB/h of segments shipped. An 18x amplification,
      # ~5% of each segment real and the rest padding.
      #
      # It is not free padding either. Postgres recycles segments by
      # renaming and overwriting them in place, so the same disk blocks
      # are rewritten twelve times an hour — the worst possible input to
      # block-level snapshots. Six retained hourly Longhorn snapshots of
      # a 124 MB database were holding 1.8 GiB of chain, all of it WAL
      # that had been rewritten rather than changed.
      #
      # 1h keeps a bounded RPO on the archive at a twelfth of the write
      # volume. Lower it again on a cluster whose write rate actually
      # fills segments, where the amplification disappears on its own.
      archive_timeout: 1h

  bootstrap:
    initdb:
      database: platform
      owner: platform
      # Secret with username + password keys. bootstrap.sh creates
      # this; CNPG reads it once at first init and stores the
      # result in <cluster>-app afterwards. We set ownerLessSecret
      # to keep our existing Secret usable as the source of truth
      # for both initdb AND the backend's DATABASE_URL.
      secret:
        name: platform-db-credentials
      # Grant CREATEROLE to the application user so the existing
      # Drizzle migrations can `CREATE ROLE stalwart_reader` etc.
      # CNPG's initdb-created app user is unprivileged by default
      # (the cluster's `postgres` superuser handles ops). Without
      # this grant, platform-api's migrate step fails with
      # "permission denied to create role".
      postInitApplicationSQL:
        # Match vanilla-postgres initdb behaviour: the application
        # user is SUPERUSER. Existing migrations (0024_…sql etc.)
        # `CREATE DATABASE roundcube OWNER roundcube` and similar
        # require: CREATEROLE + CREATEDB + ability to SET ROLE
        # to the new owner. Granting SUPERUSER is the simplest
        # match. Trade-off: anyone with platform-db-credentials
        # can do anything in the cluster — same surface as the
        # previous StatefulSet-managed `platform` user.
        - "ALTER USER platform WITH SUPERUSER"

  storage:
    # 4Gi base for fresh installs. The DATA is small and stays small —
    # a production cluster with 27 tenants holds 124 MB across all
    # databases, and every large table is pruned (audit_logs 180d,
    # usage_metrics rolled hourly→daily, waf_logs, crowdsec decisions on
    # a 7-day window). What needs the room is WAL:
    #
    #   `wal_keep_size` 512MB is a permanent floor, and `max_wal_size`
    #   1GB is the checkpoint trigger, so pg_wal can reach ~1.5 GB during
    #   a write burst — a migration, a restore, a bulk import — and stays
    #   there until archiving drains it. On a 2Gi volume (1945 MiB of ext4
    #   once the filesystem takes its overhead) that left a few hundred MB
    #   of margin, and the failure mode is not graceful: Postgres PANICs
    #   when it cannot write WAL, and this cluster IS the control plane.
    #
    # This has bitten before — the staging WAL runaway that grew that
    # cluster 10→20Gi. 4Gi costs 2 GiB of a 500 GiB disk and retires the
    # whole class.
    #
    # CNPG supports ONLINE expansion (`spec.storage.size` edit + Longhorn
    # resize, no pod restart), so growing further later is zero-downtime.
    # SHRINKING is not possible — the CNPG webhook rejects any decrease,
    # so a cluster already larger than this base must be patched per
    # overlay or the platform Kustomization deadlocks Ready=False.
    # Operators right-size at any time via Settings → System DB Storage
    # (SystemPvcResize), which grows the PVC directly and so does not
    # fight Flux over the Cluster CR.
    size: 4Gi
    # System PVCs MUST use longhorn-system-local (or -ha when policy
    # is HA — operator flip via Apply Tier patches both numberOfReplicas
    # and nodeSelector on the live volume). The bare `longhorn` class
    # has no nodeSelector, so any new PVC bound through it could land
    # a replica on a worker node — never desired for postgres.
    storageClass: longhorn-system-local

  # Per-instance resources. Sized for low-traffic single-tenant install.
  # Live observation: actual usage 75-110 Mi / 5-13m on
  # staging across 3 replicas. Dropping limits.memory 1Gi → 512Mi
  # gives ~4.5× headroom over peak observed (110 Mi); saves 1.5 GiB
  # of namespace quota commitment (3 replicas × 512Mi saved).
  # Production overlays can bump higher when their workload demands;
  # the storage-policy advisor also surfaces resource recommendations.
  #
  # requests.memory 128Mi → 256Mi. Re-measured working set:
  # 86 Mi (staging) / 69 Mi (VM tier) for the `postgres` container alone,
  # 108-148 Mi for the whole pod. 128Mi left the container's own usage
  # sitting at ~70-90% of its request, so a modest spike (checkpoint,
  # vacuum, a burst of connections) pushes the pod OVER its requests —
  # and the kubelet ranks pods that exceed their requests for eviction
  # AHEAD of pods that do not. Since a single-instance primary IS the
  # control plane, being an early eviction candidate is the wrong trade;
  # 256Mi keeps steady-state usage at ~35% of request with real headroom.
  # Cost is 128Mi of quota commitment per instance. Peak observed is far
  # below limits.memory (512Mi), so the limit is unchanged.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      # No CPU limit — high-priority platform postgres.
      memory: 512Mi

  # Slow the instance-manager probes from CNPG defaults (10s) to 60s.
  # Each probe runs `pg_isready` against the local socket — a free
  # operation on a healthy DB but, on a low-traffic single-tenant
  # install, 10s adds up to ~8 600 invocations per pod per day. 60s
  # reduces this to ~1 440 with no observable failure-detection
  # impact (failover still triggers on actual crash via the operator's
  # event watch — the periodic probe is a backstop, not a primary
  # signal). startup keeps the default 5s so first-boot detection
  # stays snappy.
  probes:
    liveness:
      periodSeconds: 60
    readiness:
      periodSeconds: 60

  # Bind to the system-only nodes via the same toleration the
  # rest of the platform Deployments use. Without it, CNPG pods
  # would land on tenant-tainted server nodes too.
  #
  # nodeSelector pins CNPG pods to nodes labelled
  # `insula.host/node-role=server` — same shape that
  # the system-node-affinity Kustomize Component applies to every
  # other system Deployment. CNPG `Cluster.spec.affinity` has its
  # own schema (no nodeAffinity sub-field through 1.21), so we set
  # nodeSelector here instead of patching via the component.
  # Evicted only after every tenant-tier pod (operator decision
  # ) — the platform DB is the spine, tenants go first.
  priorityClassName: platform-critical
  affinity:
    nodeSelector:
      insula.host/node-role: server
    tolerations:
      - key: insula.host/server-only
        operator: Exists
        effect: NoSchedule
    # Spread across nodes when instances >= 2 — prevents a
    # multi-instance cluster from co-locating on one server.
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname

  # Monitoring: CNPG instance pods ALWAYS serve Postgres metrics on
  # :9187; vmsingle (k8s/base/monitoring, ADR-051) scrapes them
  # directly via pod discovery. enablePodMonitor stays false on
  # purpose — PodMonitor is a prometheus-operator CRD and that
  # operator is deliberately not installed.
  monitoring:
    enablePodMonitor: false

  # Backup integration: when backup-credentials Secret has S3
  # creds, the CNPG operator picks them up via barman-cloud +
  # ScheduledBackup CR (defined separately). Leaving disabled
  # by default; the existing postgres-dump cronjob still works
  # (connects via the postgres Service like any client) and
  # provides logical backup coverage in parallel.

  # R-X6: barman-cloud plugin wiring. The plugin Deployment lives in
  # cnpg-system (k8s/base/cnpg-system/); the ObjectStore + ScheduledBackup
  # CRs + the Cluster `spec.plugins[]` barman entry are ALL materialised by
  # platform-api's postgres-objectstore reconciler based on the SYSTEM-class
  # shim target binding.
  #
  # NO STATIC `spec.plugins` ENTRY HERE — intentional, and enforced by
  # ci-backup-rclone-shim-check.sh (Invariant 10). Real WAL archiving is gated
  # by the barman-cloud plugin entry's PRESENCE, INDEPENDENT of `isWALArchiver`.
  # If the entry shipped statically, a freshly-bootstrapped cluster with NO
  # backup target would keep trying to archive every WAL segment to the
  # (unstarted) shim — every attempt FAILS, Postgres can't recycle un-archived
  # WAL, and `pg_wal/` fills until the volume runs out of disk and CNPG halts
  # Postgres — a guaranteed self-destruct in ~2 days
  # (project_wal_archive_runaway_2026_06_02). So a fresh cluster starts with NO
  # barman plugin: with no archiver attached, CNPG's `wal-archive` no-op-succeeds
  # (archive_mode stays on) and WAL recycles. The reconciler ADDS the entry
  # (isWALArchiver:true) only once a SYSTEM target is bound — after it
  # materialises the ObjectStore the entry references — and REMOVES it when
  # SYSTEM is unassigned. The reconciler is the entry's sole owner (Flux
  # ssa:merge leaves the absent field alone).
---
# Stub ObjectStore CR + creds Secret — present so the plugin can be ADDED
# cleanly once a SYSTEM backup target is bound.
#
# The Cluster above ships with NO barman plugin (see the long note there),
# so a fresh cluster has no archiving and no pre-reconcile-hook stall — it
# just starts. When an operator binds a SYSTEM target, the reconciler ADDS
# the plugin entry; the barman-cloud plugin's pre-reconcile hook then stops
# the Cluster's reconcile until the referenced ObjectStore CR exists. By
# shipping the stub ObjectStore here (and the reconciler also materialises
# it in step 4 BEFORE patching the plugin), that hook is satisfied
# immediately — no Cluster-reconcile stall on plugin-add.
#
# The stub spec is byte-identical to what
# `backend/src/modules/backup-rclone-shim/postgres-objectstore.ts`
# (`buildObjectStoreSpec()` + `SHIM_S3_CREDS_SECRET_NAME`) produces, so
# the reconciler's merge-patch is a no-op once it runs.
# Field-ownership note: the Secret intentionally has NO `data` block —
# the reconciler ADDS `access_key` + `secret_key` fields once
# BACKUP_TARGET_KEY is loaded. Because Flux's SSA manifest doesn't
# include `data`, Flux doesn't claim ownership of those fields; the
# reconciler-applied values stick across subsequent Flux reconciles.
#
# Lifecycle (no SYSTEM target — the common fresh-bootstrap case):
#   1. Flux applies this stub → ObjectStore CR + empty Secret exist.
#   2. Cluster starts with no barman plugin → CNPG's wal-archive no-op-
#      succeeds → pg_wal recycles normally (no archive failures, no fill).
#   3. platform-api boots; postgres-objectstore reconciler keeps the
#      plugin ABSENT until a SYSTEM target is bound, then ADDS it
#      (isWALArchiver:true) after merge-patching the Secret `data`.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: system-postgres-objectstore
  namespace: platform
  labels:
    app: backup-rclone-shim
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: backup
    app.kubernetes.io/managed-by: platform-api-postgres-objectstore
  annotations:
    # Seed-then-disown: Flux seeds this with the legacy `s3://system/postgres`
    # default, then steps back so platform-api's postgres-objectstore reconciler
    # owns the live destinationPath — which it namespaces by the stable
    # cluster_id (s3://system/<cluster_id>/postgres) for cross-cluster collision
    # safety. Without this, Flux would revert the reconciler's path on every sync.
    kustomize.toolkit.fluxcd.io/reconcile: disabled
spec:
  configuration:
    # Legacy day-0 default — the reconciler rewrites this to include cluster_id.
    destinationPath: 's3://system/postgres'
    endpointURL: 'http://backup-rclone-shim.platform.svc.cluster.local:9000'
    s3Credentials:
      accessKeyId:
        name: backup-rclone-shim-creds
        key: access_key
      secretAccessKey:
        name: backup-rclone-shim-creds
        key: secret_key
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        # No CPU limit — high-priority platform pod.
        memory: 1Gi
  retentionPolicy: 30d
---
# Stub creds Secret. `data` intentionally absent — see comment above.
# backup-coverage: excluded:cluster-infrastructure
apiVersion: v1
kind: Secret
metadata:
  name: backup-rclone-shim-creds
  namespace: platform
  labels:
    app: backup-rclone-shim
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: backup
    app.kubernetes.io/managed-by: platform-api-postgres-objectstore
type: Opaque
---
# Stable Service alias. Keeps app connection strings unchanged
# (postgres.platform.svc:5432) across CNPG instance scaling +
# failover AND across PG-major bumps + cluster renames (the
# externalName updates, the Service name does NOT — apps'
# DATABASE_URL stays valid).
#
# Bump+rename history: postgres-rw (PG 17.5) → postgres-18-rw
# → system-db-rw (PG 18.3, renamed
# to drop version baggage from the cluster name).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: platform
  labels:
    app: postgres
    app.kubernetes.io/part-of: hosting-platform
spec:
  type: ExternalName
  externalName: system-db-rw.platform.svc.cluster.local
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
