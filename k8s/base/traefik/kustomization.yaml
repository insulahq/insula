apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - middlewares-global.yaml
  - middlewares-admin-auth.yaml
  - middlewares-crowdsec.yaml
  - middlewares-modsecurity.yaml
  # Must be applied wherever middlewares-modsecurity is: the WAF plugin reads
  # the whole request body with no limit of its own.
  - middlewares-waf-body-limit.yaml
  # Runtime self-heal for the plugin-download failure that silently 404s both
  # panels. bootstrap.sh only checks this at install time; see the file header.
  - plugin-guard.yaml
  # middlewares-waf.yaml is DEAD CODE — Coraza scaffolding kept in tree
  # for when upstream stabilises. See the file's header comment.
  # - middlewares-waf.yaml

# Insula's copy of the ModSecurity plugin (plugins/modsecurity/README.md),
# which the Traefik DaemonSet mounts as a local plugin
# (experimental.localPlugins.modsecurity). Only the three files Traefik loads
# go in; the tests stay out.
#
# * Fixed name: the DaemonSet's volume names it. Traefik reads plugin source
#   only at startup, so a content change reaches the process through the
#   `insula.host/modsecurity-plugin-sha256` pod annotation, which a
#   host-migration re-stamps — scripts/ci-migration-coverage.sh fails an edit to
#   these files without one.
# * prune: disabled — rolling back to a release without this ConfigMap must not
#   delete it from under a DaemonSet that mounts it: a Traefik pod restarting
#   on any node would then hang in ContainerCreating.
configMapGenerator:
  - name: traefik-plugin-modsecurity
    namespace: traefik
    files:
      - modsecurity.go=plugins/modsecurity/modsecurity.go
      - go.mod=plugins/modsecurity/go.mod
      - .traefik.yml=plugins/modsecurity/.traefik.yml
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/prune: disabled
      labels:
        app.kubernetes.io/name: traefik-plugin-modsecurity

labels:
  - pairs:
      app.kubernetes.io/part-of: hosting-platform
      app.kubernetes.io/component: traefik
