# Traefik plugin-load self-heal (runtime).
#
# WHY THIS EXISTS
# Traefik downloads its Yaegi plugins from plugins.traefik.io at PROCESS START.
# If any single plugin fails to download it disables the WHOLE plugin subsystem
# and keeps serving:
#
#   INF Loading plugins... plugins=["crowdsec","modsecurity"]
#   ERR Plugins are disabled because an error has occurred.
#       unable to install plugin crowdsec: ... context deadline exceeded
#   ERR invalid middleware "traefik-modsecurity-crs@kubernetescrd" ... does not exist
#       routerName=platform-platform-ingress-...@kubernetescrd
#
# Every router whose middleware is a plugin is then dropped — including
# platform-ingress, which carries BOTH panels. The cluster looks perfect:
# pods Running and Ready, valid certs, Flux READY=True, API healthy — and
# admin.<apex> / tenant.<apex> return Traefik's bare `404 page not found`.
#
# Nothing self-heals: plugins are only installed at process start.
#
# bootstrap.sh has had a detector+recycler (ensure_traefik_plugins_loaded) since
# the 2026-08-04 fresh-install occurrence, but it is only called from
# install_traefik and verify_install — INSTALL-TIME ONLY. A node reboot re-enters
# the identical failure with nothing watching, which took production down on
# 2026-08-20 and stayed down until an operator restarted the pod by hand.
#
# A persisted plugin cache does NOT fix this: measured 2026-08-20 against
# traefik:v3.7.6 with both archives present in /plugins-storage and no network,
# Traefik still calls the registry unconditionally and still disables plugins
# ("dial tcp: lookup plugins.traefik.io: network is unreachable"). The download
# is not cache-gated, so only vendoring (--experimental.localPlugins) removes
# the startup network dependency. Until then, this guard bounds the outage.
#
# ─────────────────────────────────────────────────────────────────────────────
# SECOND CONCERN: a plugin's CONFIG is also read only at process start.
#
# Traefik instantiates a Yaegi plugin once, with the Middleware's settings as
# they were at that moment, and keeps its goroutines running with those values.
# Editing the Middleware CR updates the API object and changes NOTHING in the
# running process. There is no watch, no reload, and no log line saying so.
#
# Measured on DEV 2026-09-06. `updateMaxFailure: -1` (never block when the
# CrowdSec LAPI is unreachable) was applied by Flux at 00:52:06. The LAPI was
# stopped at 00:54. The plugin — an 8h-old pod — still counted to its OLD
# threshold and blocked:
#
#   00:57:09 updateFailure:3 isCrowdsecStreamHealthy:true   <- old value, 3
#   00:58:09 updateFailure:4 isCrowdsecStreamHealthy:false  <- every site 403s
#
# After recycling the pod, the identical outage produced:
#
#   updateFailure:7 isCrowdsecStreamHealthy:true            <- 0/48 probes 403
#
# So a fix shipped as a Middleware edit is INERT until something happens to
# restart Traefik, which on a stable cluster may be weeks. That is the worst
# shape a safety fix can have: released, documented, believed, and not running.
#
# This guard therefore also recycles any Traefik pod that started BEFORE the
# newest plugin-middleware change. `managedFields[].time` is the right signal
# and not merely the latest reconcile: verified on DEV that Flux's 1-minute
# no-op applies do NOT bump it (steady at 00:52:06 while now was 01:03:59), so
# an unchanged config can never cause a recycle.
#
# One pod per run, deliberately: on a multi-node cluster deleting every Traefik
# pod at once is a total ingress outage, which is precisely the thing this file
# exists to prevent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-plugin-guard
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: traefik-plugin-guard
---
# Namespace-scoped: read Traefik's logs, and delete ONLY Traefik pods.
# No cluster-wide delete — the blast radius of this guard is one DaemonSet.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik-plugin-guard
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: hosting-platform
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # delete is NOT resourceName-scoped because DaemonSet pod names are random;
  # the guard filters by label itself and only ever deletes what it inspected.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # Read-only, and only in this namespace: the guard needs each plugin
  # middleware's last-change time to tell a stale Traefik process from a
  # current one. It never writes them.
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-plugin-guard
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: hosting-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: traefik-plugin-guard
subjects:
  - kind: ServiceAccount
    name: traefik-plugin-guard
    namespace: traefik
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: traefik-plugin-guard
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: traefik-plugin-guard
spec:
  # Every 2 min: bounds the outage to roughly one detection window plus a pod
  # restart. Forbid + the verdict-line check below make a tight restart loop
  # impossible even while egress is still down — worst case is one recycle
  # per pod per 2 minutes, which is the correct behaviour when the cause is a
  # transient network fault that has not cleared yet.
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: hosting-platform
            app.kubernetes.io/component: traefik-plugin-guard
        spec:
          serviceAccountName: traefik-plugin-guard
          restartPolicy: OnFailure
          tolerations:
            - key: insula.host/server-only
              operator: Equal
              value: "true"
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 1
                  preference:
                    matchExpressions:
                      - key: insula.host/node-role
                        operator: In
                        values: ["server"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: guard
              # alpine/k8s ships kubectl on Alpine and provides /bin/sh
              # (rancher/kubectl is distroless — no shell). Pinned to match
              # the cluster's k3s v1.33.x, same as ingress-external-ips.
              image: alpine/k8s:1.33.13
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # NOTE: every shell variable below is written $${VAR}. An
                  # unescaped one is expanded by Flux postBuild.substituteFrom
                  # against platform-cluster-config and blanked out before the
                  # pod ever runs.
                  NS=traefik
                  SEL=app.kubernetes.io/name=traefik
                  FAIL_MARKER='Plugins are disabled because an error has occurred'
                  OK_MARKER='Plugins loaded.'

                  # Capture the exit code SEPARATELY from the output. Folding a
                  # kubectl failure (RBAC change, API-server blip, bad context)
                  # into an empty result would make it indistinguishable from
                  # "no Traefik pods" and exit 0 — a guard against a fail-open
                  # bug must not itself fail open. A non-zero exit here lands in
                  # failedJobsHistoryLimit where an operator can see it.
                  set +e
                  pods=$$(kubectl -n "$${NS}" get pods -l "$${SEL}" \
                            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>&1)
                  kubectl_rc=$$?
                  set -e

                  if [ "$${kubectl_rc}" -ne 0 ]; then
                    echo "traefik-plugin-guard: kubectl get pods FAILED (rc=$${kubectl_rc}): $${pods}" >&2
                    exit 1
                  fi

                  if [ -z "$${pods}" ]; then
                    echo "traefik-plugin-guard: no Traefik pods found (selector $${SEL}) — nothing to check"
                    exit 0
                  fi

                  # Decide from the VERDICT LINE, never from pod age. Traefik
                  # logs exactly one of these within seconds of start, so a pod
                  # that has logged neither has not decided yet and must be left
                  # alone. An age heuristic would need `date -d` on an RFC3339
                  # stamp, which BusyBox does not parse reliably — and it would
                  # still be a guess where an exact signal exists.
                  # Newest change to any plugin-backed Middleware in this
                  # namespace. Empty is a legitimate answer (no plugin
                  # middlewares yet) and disables only the staleness check.
                  #
                  # Compared LEXICOGRAPHICALLY, never with `date -d`: both
                  # strings come from the API server as RFC3339 UTC
                  # (2026-09-06T00:52:06Z), which sorts correctly as text, and
                  # BusyBox cannot parse that format reliably anyway.
                  # No exit-code check here, unlike the pod query above, and
                  # for a reason: this pipeline ends in `head`, so $? would be
                  # head's status and would report success even when kubectl
                  # failed. Emptiness is the honest signal, and an empty result
                  # fails SAFE — it skips the staleness check and recycles
                  # nothing, rather than recycling on a bad read.
                  cfg_changed=$$(kubectl -n "$${NS}" get middlewares.traefik.io \
                      -o jsonpath='{range .items[?(@.spec.plugin)]}{range .metadata.managedFields[*]}{.time}{"\n"}{end}{end}' 2>/dev/null \
                      | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}T' | sort -r | head -1 || true)
                  if [ -z "$${cfg_changed}" ]; then
                    echo "traefik-plugin-guard: no plugin-middleware change time available — staleness check skipped"
                  else
                    echo "traefik-plugin-guard: newest plugin-middleware change $${cfg_changed}"
                  fi

                  recycled=0
                  for name in $${pods}; do
                    # --since as well as --tail: the plugin verdict is logged ONCE at
                    # startup, so if access logging is ever enabled a busy node could
                    # scroll it out of a line-bounded window and the pod would be
                    # classified "no verdict yet" forever, i.e. never recycled.
                    logs=$$(kubectl -n "$${NS}" logs "$${name}" --tail=2000 --since=24h 2>/dev/null || true)

                    if printf '%s' "$${logs}" | grep -qF "$${FAIL_MARKER}"; then
                      echo "traefik-plugin-guard: $${name} has NO PLUGINS — both panels would 404. Recycling."
                      if kubectl -n "$${NS}" delete pod "$${name}" --wait=false >/dev/null 2>&1; then
                        echo "traefik-plugin-guard: recycled $${name}"
                        recycled=1
                      else
                        echo "traefik-plugin-guard: FAILED to delete $${name}" >&2
                      fi
                      continue
                    fi

                    if printf '%s' "$${logs}" | grep -qF "$${OK_MARKER}"; then
                      echo "traefik-plugin-guard: $${name} plugins OK"
                    else
                      echo "traefik-plugin-guard: $${name} has not logged a plugin verdict yet — skipping"
                      continue
                    fi

                    # Stale plugin CONFIG. Only one recycle per run: taking
                    # every Traefik pod down together is the outage this file
                    # exists to prevent, and the next run continues the roll.
                    [ -n "$${cfg_changed}" ] || continue
                    [ "$${recycled}" -eq 0 ] || continue

                    started=$$(kubectl -n "$${NS}" get pod "$${name}" \
                                 -o jsonpath='{.status.startTime}' 2>/dev/null || true)
                    if [ -z "$${started}" ]; then
                      echo "traefik-plugin-guard: $${name} has no startTime yet — skipping staleness check"
                      continue
                    fi

                    if [ "$${started}" \< "$${cfg_changed}" ]; then
                      echo "traefik-plugin-guard: $${name} started $${started}, BEFORE the plugin config changed at $${cfg_changed} — it is running the old settings. Recycling."
                      if kubectl -n "$${NS}" delete pod "$${name}" --wait=false >/dev/null 2>&1; then
                        echo "traefik-plugin-guard: recycled $${name} (stale plugin config)"
                        recycled=1
                      else
                        echo "traefik-plugin-guard: FAILED to delete $${name}" >&2
                      fi
                    else
                      echo "traefik-plugin-guard: $${name} started $${started} — plugin config current"
                    fi
                  done

                  echo "traefik-plugin-guard: pass complete"
