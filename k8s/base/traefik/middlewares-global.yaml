# Global Traefik Middleware CRs — shared by all namespaces via
# providers.kubernetesCRD.allowCrossNamespace=true.
#
# Reference from an IngressRoute in another namespace using:
#   middlewares:
#     - name: compress
#       namespace: traefik
#
# Route order: inflight-per-client BEFORE compress (see each Middleware below).
#
# compress — replaces ingress-nginx's gzip directives. gzip ONLY, and only for
# an allowlist of text types. Both limits exist because this middleware
# OOM-killed the Traefik DaemonSet on a production cluster (two nodes 9 s
# apart), and both are guarded by scripts/ci-traefik-compress-check.sh.
#
# Every response being compressed holds its own compression writer for as
# long as the client takes to read it. The writers are pooled and survive two
# GC cycles, and an idle Traefik only collects every 2 minutes, so the memory
# outlives the burst by minutes. Measured with traefik:v3.7.6 at a 512Mi
# limit, 100 parallel 220 KB images to a slow HTTP/2 client:
#
#   no compression 62 MiB peak · gzip 120 · zstd 263 · brotli 292-295
#
# and 250 parallel 300 KB text responses from ONE client (three HTTP/2
# connections) OOM-killed Traefik under brotli within 5 s; this config peaks
# at 254 MiB. Go reserves ~11 MiB of heap per brotli writer and touches more
# of it the larger the response; a slow reader just holds it longer.
#
# * gzip only, not "gzip first": the CLIENT picks the encoding. With br or
#   zstd anywhere in the list, `Accept-Encoding: br` alone selects it, and the
#   costly path is one header away for anyone on an unauthenticated route
#   (the webmail ingress has no auth in front). gzip's ratio on text is a few
#   percent worse than brotli's; that is the price of a bounded ingress.
# * includedContentTypes is an ALLOWLIST: images, video, archives, PDFs and
#   octet-stream mail attachments are already compressed — re-compressing
#   them burned a writer per image for nothing (the production trigger was
#   a webmail thread loading dozens of inline signature images at once).
#   text/event-stream (JMAP push) is deliberately absent: an SSE response
#   stays open for as long as the client listens, and a compressed one would
#   pin a writer for that whole time — one per open webmail tab.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: traefik
spec:
  compress:
    # Match nginx's gzip-min-length=256.
    minResponseBodyBytes: 256
    encodings:
      - gzip
    # A type without parameters matches the same type with any parameters
    # (text/html matches text/html; charset=utf-8).
    includedContentTypes:
      - text/html
      - text/css
      - text/plain
      - text/javascript
      - text/xml
      - application/javascript
      - application/x-javascript
      - application/json
      - application/manifest+json
      - application/xml
      - application/wasm
      - image/svg+xml
---
# inflight-per-client — at most 100 requests in flight per client on each
# route that uses it; the 101st gets 429 until one finishes. It sits before
# `compress` on every route that compresses (ci-traefik-compress-check.sh), so
# what one client can hold open is bounded however many connections it opens —
# the HTTP/2 stream cap (bootstrap.sh) only bounds a single connection.
#
# * sourceCriterion is REQUIRED, not decoration: without one, Traefik keys
#   inFlightReq by the Host header, i.e. ONE shared budget of 100 for every
#   user of the route together.
# * ipStrategy without depth/excludedIPs = the connection's remote address.
#   Traefik runs on hostPorts and trusts forwarded headers from 127.0.0.1
#   only, so that address is the client — a client cannot pick its own key
#   with X-Forwarded-For. IPv6 clients are grouped by /64: one host owns a
#   whole /64 and could otherwise rotate addresses past the limit.
# * 100: production access logs (two weeks, every compressing route) show at
#   most 39 in flight for one client on one route; the burst that OOM-killed
#   Traefik peaked at 51. 100 matches the per-connection stream cap.
# Instances are per router: the budget is per client PER ROUTE.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: inflight-per-client
  namespace: traefik
spec:
  inFlightReq:
    amount: 100
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: 64
