# ModSecurity-CRS WAF Middleware — tenant-opt-in.
#
# Attached to a tenant route when ingress_routes.waf_enabled=1; emitted
# by backend/src/modules/ingress-routes/annotation-sync.ts:
# buildMiddlewaresForRoute (WAF branch).
#
# Also attached unconditionally to the platform-ingress panel routes
# (admin / client) — they're sensitive surfaces, so the WAF runs there
# regardless of tenant-level waf_enabled (which only controls tenant
# routes).
#
# Plugin: Insula's own copy of madebymode/traefik-modsecurity-plugin v1.6.0,
# k8s/base/traefik/plugins/modsecurity/ (README.md there says why and what
# changed). Traefik loads it as a LOCAL plugin under the key `modsecurity`
# from the traefik-plugin-modsecurity ConfigMap. It forwards each request —
# method, URI, headers, body — to the ModSecurity-CRS sidecar
# (k8s/base/modsecurity-crs/) and passes it on only on a 2xx verdict.
#
# Single shared sidecar — option-C hybrid per-route directives are not
# achievable with this plugin (it lacks a Middleware-level config knob
# for SecRule directives). Operators wanting differentiated rule sets
# per tenant can run multiple modsec-crs Deployments and emit one
# Middleware per backend; today every wafEnabled route hits the same
# CRS config (paranoia level + anomaly thresholds baked into the
# modsec-crs Deployment's env).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: modsecurity-crs
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: waf
spec:
  plugin:
    modsecurity:
      # URL the plugin POSTs request bodies to. The modsec-crs Service
      # in the same namespace (Service DNS short form is fine).
      modSecurityUrl: http://modsec-crs.traefik.svc.cluster.local
      # Request bodies: the plugin reuses the buffer `waf-body-limit` (always
      # chained right before it) already holds, so a body is never copied into
      # Traefik's heap — upstream v1.6.0 did exactly that, up to the cap, for
      # the whole request. Its own maxBodyBytes defaults to the same 12.5 MiB
      # (413 above it), so a route missing waf-body-limit is still bounded.
      #
      # Plugin settings are read when Traefik STARTS; an edit here reaches the
      # process only once traefik-plugin-guard recycles the pods.
      #
      # Timeout (ms) for the verdict once the request has been sent. If the
      # sidecar errors, times out or answers 5xx, the request FAILS CLOSED with
      # 502 (the plugin's opt-in fail-open back-off stays off: a WAF an
      # attacker can switch off by overloading it is not a WAF). Sending the
      # body has its own budget (bodyTimeoutMillis, default 10 s), so a large
      # upload cannot eat this one. 3000 rather than the 2000 default because
      # paranoia-level-1 CRS evaluation is 5–50 ms but tails exist; at 99p the
      # round-trip stays under 50 ms in the smoke test, so this is a safety
      # net, not a planned cost.
      timeoutMillis: 3000
---
# The same plugin and sidecar in DETECTION-ONLY mode, for a tenant route whose
# WAF is set to "Detection only" (ingress_routes.waf_detection_only=1). Every
# request is still checked and every rule match logged (it shows in the route's
# WAF LOGS, marked as not blocked), but the verdict is never acted on — so an
# operator can run the rules against real traffic for as long as they like
# before enforcing them. A sidecar that cannot be reached lets the request
# through rather than answering 502: a route on trial must not go down with its
# WAF. The check carries X-Insula-Waf-Mode: detect; the plugin removes a
# client-sent copy of that header on every route.
#
# Settings other than detectOnly mirror modsecurity-crs above.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: modsecurity-crs-detect
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: waf
spec:
  plugin:
    modsecurity:
      modSecurityUrl: http://modsec-crs.traefik.svc.cluster.local
      timeoutMillis: 3000
      detectOnly: true
