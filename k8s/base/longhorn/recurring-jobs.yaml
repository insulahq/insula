# Longhorn RecurringJobs — LOCAL snapshot + fstrim schedule for any volume
# opted into the `default` job group.
#
# READ THIS BEFORE CALLING THE GROUP LABEL A "BACKUP" SETTING: it is not one,
# and has not been since 2026-08-26. Membership of the `default` group buys a
# volume exactly two things — an hourly in-volume snapshot (retain 6) and a
# daily filesystem trim. Both are local to this cluster and neither survives
# losing the node. Off-cluster protection is the tenant-bundle / system / mail
# 3-class shim pipeline, which is driven by backup target ASSIGNMENTS in the
# admin panel and knows nothing about this label.
#
# A volume opts in by either:
#   (a) carrying label `recurring-job-group.longhorn.io/default: enabled`
#       (direct, per-PVC), OR
#   (b) being provisioned by a StorageClass whose parameters include
#       `recurringJobSelector` listing this group (cluster-wide, applies
#       to every future volume). For staging we rely on (a) + a one-time
#       labelling pass on existing PVCs, since the default longhorn
#       StorageClass was already created by the Longhorn installer and
#       modifying its parameters post-hoc is awkward.
#
# Local-only housekeeping: hourly snapshots (short in-volume rollback
# chain) + daily fstrim. The daily/weekly Longhorn BACKUP jobs were
# removed 2026-08-26 (operator decision): off-cluster protection is the
# tenant-bundle/system/mail 3-class shim pipeline, and the volume-level
# backup jobs — dependent on a Longhorn BackupTarget nobody configures
# under the shim model — failed every night while their pods reported
# Complete. Flux prunes the two RecurringJobs from existing clusters.
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: hourly-snap
  namespace: longhorn-system
  labels:
    app.kubernetes.io/part-of: hosting-platform
spec:
  # Top of the hour + 5 minutes, out of the way of the other jobs.
  cron: "5 * * * *"
  task: snapshot
  # 6 hourly snapshots kept — last six hours of in-volume rollback. A
  # shorter chain dramatically speeds up Longhorn replica rebuilds.
  # Anything older than six hours must come from the shim pipeline's
  # off-cluster bundles, NOT from here. These snapshots earn their keep
  # regardless: the 2026-09-02 tenant-database datadir recovery was only
  # possible because an hourly snapshot existed to fall back on.
  retain: 6
  concurrency: 2
  groups:
    - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-fstrim
  namespace: longhorn-system
  labels:
    app.kubernetes.io/part-of: hosting-platform
spec:
  # 01:30 — early, quiet, and clear of the nightly DR CronJobs so a trim
  # and a bundle upload never contend for the same volume. (It used to be
  # timed against a 02:00 Longhorn backup job; that job is gone.)
  #
  # Why this job exists (2026-06-05 audit): deleted-file blocks are
  # never returned to Longhorn without an explicit trim — the staging
  # system-db volume carried 10.8 GB of incident-era WAL blocks through
  # every snapshot rotation for days (12.7 GB actualSize for an 18 MB
  # database). FITRIM from inside the workload pod is not possible
  # (needs CAP_SYS_ADMIN, which platform pods rightly drop) — Longhorn's
  # filesystem-trim task runs through the engine instead. Pairs with the
  # removeSnapshotsDuringFilesystemTrim default setting (bootstrap.sh)
  # so trimmed blocks are also released from the snapshot chain.
  cron: "30 1 * * *"
  task: filesystem-trim
  # retain is meaningless for filesystem-trim (nothing is created);
  # 0 is the conventional value.
  retain: 0
  concurrency: 2
  groups:
    - default
