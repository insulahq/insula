server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # JSON endpoint for programmatic clients.
  location = /api/status {
    default_type application/json;
    return 200 '{"status":"bandwidth_exceeded","message":"This site has reached its monthly bandwidth limit"}';
  }
  location / {
    try_files $uri /index.html;
  }
}
