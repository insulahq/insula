apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: platform
  labels:
    app: oauth2-proxy
spec:
  # M14: replicas owned by platform-storage-policy reconciler.
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      # 2026-05-11: DoNotSchedule enforces strict one-per-server placement
      # so on a 3-server HA cluster every server runs an oauth2-proxy pod.
      # Operator-visible invariant: "all servers same state for ease of
      # maintenance". Failover headroom (cluster_capacity − one_server)
      # is what prevents this hard constraint from wedging Pending pods
      # — see backend/src/modules/platform-storage-policy/failover-headroom.ts.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: oauth2-proxy
      # Wait until oauth2-proxy can complete OIDC discovery exactly the
      # way the main container will: GET ${OIDC_ISSUER_URL}/.well-known
      # /openid-configuration with strict TLS verify. This is the same
      # call the main container makes on startup, so if this initContainer
      # passes, the main container will too.
      #
      # Two failure modes this catches on a fresh bootstrap:
      #   (1) dex Pending / mail-pg Pending — nginx 404 from the public
      #       ingress because no Service endpoints
      #   (2) LE cert not yet issued — nginx serves the default
      #       ingress.local self-signed cert; curl refuses TLS verify
      #
      # Without the wait, the main container hits one of those errors
      # at startup, exits, k8s applies exponential backoff, and even
      # after dex+cert come up the pod stays in long CrashLoopBackOff
      # — empirically requires manual `kubectl delete pod` (caught on
      # testing.example.test 2026-05-08).
      #
      # We pull OIDC_ISSUER_URL from the same Secret the main container
      # uses, so any environment-specific override (dev uses internal
      # cluster DNS) is honored automatically. 60×5s = 5 min cap is
      # longer than any plausible cold boot window; if it expires, the
      # init container exits non-zero and the pod stays Pending with a
      # visible reason in `kubectl describe`.
      initContainers:
        - name: wait-for-dex-discovery
          image: curlimages/curl:8.21.0
          envFrom:
            - secretRef:
                name: oauth2-proxy-config
          command:
            - sh
            - -c
            # CRITICAL: every shell ${VAR} below is escaped as $${VAR}
            # so Flux's postBuild envsubst leaves it alone for the
            # shell to expand at runtime. Without the escape, envsubst
            # nukes OIDC_ISSUER_URL (which isn't in the cluster-config
            # substitution sources) to empty string, leaving curl with
            # url="/.well-known/..." which fails as "URL rejected: No
            # host part in the URL". Caught on testing.example.test
            # 2026-05-08; same gotcha as project_valkey_phase1_2.
            - |
              set -eu
              url="$${OIDC_ISSUER_URL%/}/.well-known/openid-configuration"
              echo "polling: $${url}"
              for i in $$(seq 1 60); do
                if curl -fsS -o /dev/null --max-time 8 "$${url}"; then
                  echo "OIDC discovery ready (attempt $${i})"
                  exit 0
                fi
                echo "waiting for OIDC discovery (cert + dex)... ($${i}/60)"
                sleep 5
              done
              echo "OIDC discovery never succeeded after 5 min — main container would crashloop too" >&2
              exit 1
          resources:
            # Floor of 32Mi memory matches the platform LimitRange minimum
            # (k8s/base/limit-ranges.yaml). 16Mi is rejected with "minimum
            # memory usage per Container is 32Mi, but request is 16Mi" and
            # the entire pod is denied admission, including the main
            # container — caught on testing.example.test 2026-05-08.
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # No CPU limit — high-priority platform pod (2026-06-24).
              memory: 64Mi
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=static://200
            - --email-domain=*
            - --provider=oidc
            - --oidc-issuer-url=$(OIDC_ISSUER_URL)
            - --client-id=$(OAUTH2_PROXY_CLIENT_ID)
            - --client-secret=$(OAUTH2_PROXY_CLIENT_SECRET)
            - --cookie-secret=$(OAUTH2_PROXY_COOKIE_SECRET)
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-name=_platform_oauth2
            # Shared across the panel subdomains. Without it the cookie is
            # host-only, so a session established on one panel host is invisible
            # to the other and the gate loops forever.
            - --cookie-domain=.${DOMAIN}
            # Post-auth redirect targets. oauth2-proxy refuses to bounce back to
            # a host that is not listed here, so the tenant panel could not
            # complete a sign-in even once its callback existed.
            - --whitelist-domain=.${DOMAIN}
            # DELIBERATELY LAST and deliberately empty by default.
            #
            # oauth2-proxy takes ONE --redirect-url. Pinning it to the admin
            # host — which bootstrap.sh did for every environment — meant a
            # visitor to the TENANT panel was sent to the IdP with
            # `redirect_uri=https://admin.<apex>/oauth2/callback`, came back on
            # the admin host, and had a cookie for a host they were not trying
            # to reach. Tenant-panel protection could not work by construction.
            #
            # Left empty, oauth2-proxy derives the callback per request from
            # X-Forwarded-Host (verified against v7.15.3 on 2026-09-05: the
            # tenant host yields the tenant callback, the admin host the admin
            # one), which is exactly what a two-panel platform needs.
            - --redirect-url=$(OAUTH2_PROXY_REDIRECT_URL)
            - --skip-provider-button=true
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --skip-auth-route=^/api/
            - --skip-auth-route=^/oauth2/
            - --silence-ping-logging=true
          envFrom:
            - secretRef:
                name: oauth2-proxy-config
          ports:
            - containerPort: 4180
              name: http
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # No CPU limit — high-priority platform pod (2026-06-24).
              memory: 128Mi
