# NOTE: the page content + nginx config are NOT inlined here. They are
# generated from the sibling directory by a configMapGenerator with the
# name-suffix hash ON, so editing either file rolls this Deployment.
#
# Both files live in ONE ConfigMap that is mounted twice: the HTML at
# /usr/share/nginx/html (re-read per request, so it was always fine) and the
# nginx config at /etc/nginx/conf.d (read once at startup, so it was NOT).
# Before 2026-09-05 a change to this ConfigMap therefore applied by halves —
# the page updated while its server config silently did not.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-suspended
  namespace: platform
  labels:
    app: platform-suspended
    platform.io/system: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-suspended
  template:
    metadata:
      labels:
        app: platform-suspended
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            # Match the platform-limit-range minimum (memory: 32Mi).
            # An nginx:alpine static-content pod barely touches RAM,
            # but the LimitRange's floor is 32Mi — anything lower is
            # rejected with "minimum memory usage per Container is 32Mi"
            # and the Deployment never produces a pod. Caught on
            # testing.example.test fresh-bootstrap 2026-05-21.
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { memory: "64Mi" } # no CPU limit — high-priority platform pod
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
      volumes:
        - name: content
          configMap:
            name: platform-suspended-content
            items:
              - key: index.html
                path: index.html
        - name: conf
          configMap:
            name: platform-suspended-content
            items:
              - key: nginx.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: platform-suspended
  namespace: platform
  labels:
    app: platform-suspended
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: platform-suspended
---
# IngressRoute for the centralized suspension page. Tenant IngressRoutes
# on suspend get a RedirectRegex Middleware that sends 30x redirects to
# this hostname (see backend/src/modules/tenant-lifecycle/ingress-suspend.ts).
# Overlays override the hostname via JSON Patch on routes[0].match.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-suspended
  namespace: platform
  labels:
    app.kubernetes.io/part-of: hosting-platform
spec:
  entryPoints:
    - web
  routes:
    - match: "Host(`suspended.platform.local`)"
      kind: Rule
      services:
        - name: platform-suspended
          port: 80
