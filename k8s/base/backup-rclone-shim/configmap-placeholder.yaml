# Initial ConfigMap with launcher.sh.
#
# R-X20 — always-combined rclone-serve-s3 architecture:
#   - One `rclone serve s3` per pod, ALWAYS in `combined:` mode
#   - The full rclone.conf is rendered by platform-api in TypeScript
#     (rclone-config.ts) with passwords obscured via the canonical
#     rclone AES-CTR — stored in the credentials Secret at
#     /etc/rclone-credentials/rclone.conf
#   - The launcher just sources shim creds from upstream.env, then
#     execs rclone serve s3 against `combined:`. No per-protocol
#     dispatch logic — the [combined] section in rclone.conf encodes
#     all routing.
#   - All upstream protocols (S3 / SFTP / SMB) supported uniformly.
#     Each class can target a different backup_configurations row;
#     the renderer emits N per-target sections + N class aliases.
#   - Pod runs fully unprivileged: runAsUser:65534, drop:[ALL] caps.
#     No FUSE, no kernel mounts, no CAP_SYS_ADMIN, no /dev/fuse.
#
# Memory tuning(v3-tuned per bench, holds for R-X20):
#   - GOGC=20 + GOMEMLIMIT=200MiB (aggressive Go GC + soft cap)
#   - --s3-disable-http2 (HTTP/1.1 = parallel TCP, no HoL blocking)
#   - --s3-upload-concurrency 3 (upstream is the bottleneck; ~15 MiB
#     in-flight buffer per stream is the memory price for parallelism)
#   - --buffer-size 1M (read-ahead per ranged GET — see the exec line)
#   - --s3-memory-pool-flush-time 30s (idle pool returns memory faster)
#
# Owned at runtime by platform-api's backup-rclone-shim/reconciler.ts:
# operator assigns a target to a class → reconciler MERGE-patches
# `data.classes.txt` here + writes `data.upstream.env` and
# `data.rclone.conf` into the Secret + bumps DaemonSet annotation
# hash → rolling restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-rclone-shim-config
  namespace: platform
  labels:
    app: backup-rclone-shim
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: backup
  annotations:
    insula.host/managed-by: backup-rclone-shim/config-renderer
    # Flux must use merge-patch (not full SSA) on this ConfigMap so
    # `data.classes.txt` isn't reset to "" each tick when the
    # reconciler has populated it. Without this annotation, every Flux
    # reconcile wipes the runtime state.
    kustomize.toolkit.fluxcd.io/ssa: merge
data:
  # classes.txt is INTENTIONALLY ABSENT here so Flux doesn't claim
  # ownership of the field. The reconciler creates + maintains it
  # with one line per bound class (system, tenant, mail).

  # The shim's entrypoint. Reads classes.txt + upstream.env + the
  # rendered rclone.conf; if any is missing / empty it sleeps (does not
  # bind :9000), but STILL reports Ready via the readiness marker so a
  # DaemonSet RollingUpdate can complete on a target-less cluster. When a
  # target is configured it serves :9000 and is Ready only once it does;
  # an idle pod serves nothing and no client connects without a target.
  launcher.sh: |
    #!/bin/sh
    set -eu

    UPSTREAM_ENV=/etc/rclone-credentials/upstream.env
    RCLONE_CONF=/etc/rclone-credentials/rclone.conf
    CLASSES_FILE=/etc/rclone-static/classes.txt
    ADDR=":9000"

    log() { printf '[backup-rclone-shim] %s\n' "$*" >&2; }

    # ─── Readiness marker (rollout-decoupling) ───────────────────────
    # The readinessProbe checks THIS FILE, not tcp :9000. A shim with no
    # backup target legitimately sleeps without binding :9000 — but the pod
    # is ALIVE and must report Ready so a DaemonSet RollingUpdate (e.g. an
    # image-pin bump) completes instead of stalling forever on an idle node
    # (the :9000-gated probe made a target-less shim un-updatable). We mark
    # ready in BOTH the idle (sleep) branch and the serving one — there once
    # rclone listens on :9000 (the watchdog below); the Service only
    # carries real backup traffic once a target is configured (all pods then
    # serve :9000), so an idle-but-Ready pod is harmless — it serves nothing
    # and no client runs without a target. The `rm` clears a stale marker
    # left in the pod-lifetime emptyDir by a prior crashed container instance.
    READY=/var/run/backup-rclone/ready
    rm -f "$READY"
    ready() { : > "$READY"; }
    # idle: report Ready (alive, not serving) then park.
    idle() { ready; while :; do sleep 30; done; }

    # ─── Pre-flight: env file + rclone.conf + classes.txt must exist ─
    if [ ! -f "$UPSTREAM_ENV" ]; then
      log "$UPSTREAM_ENV missing — reconciler has not rendered yet."
      idle
    fi
    if [ ! -f "$RCLONE_CONF" ]; then
      log "$RCLONE_CONF missing — reconciler has not rendered yet."
      idle
    fi
    # Validate that the conf has actual content (a [combined] section).
    # A comment-only placeholder would let the launcher proceed to
    # `rclone serve s3 combined:` which would fail-fast (remote not
    # found), crashlooping the pod. Sleep on partial-materialise.
    if ! grep -q '^\[combined\]' "$RCLONE_CONF"; then
      log "$RCLONE_CONF has no [combined] section — partial materialise. Sleeping."
      idle
    fi
    if [ ! -s "$CLASSES_FILE" ]; then
      log "$CLASSES_FILE empty — no class-target assignments."
      idle
    fi

    # ─── Validate classes.txt against strict allowlist ────────────────
    # Each line must be exactly one of: system / tenant / mail.
    # Defends against:
    #   - shell-meta injection (`; rm -rf /`, $(curl ...), backticks)
    #   - argument injection (`--config /tmp/evil`, extra flags)
    #   - IFS / whitespace pathology
    CLASSES_OK=""
    LINE=""
    while IFS= read -r LINE || [ -n "$LINE" ]; do
      LINE=$(printf '%s' "$LINE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
      [ -z "$LINE" ] && continue
      case "$LINE" in
        system|tenant|mail) ;;
        *) log "FATAL: classes.txt contains invalid class: '$LINE'"; exit 2 ;;
      esac
      # Flux postBuild substituteFrom escape: `$$` keeps literal `$`
      # past envsubst.
      CLASSES_OK="$${CLASSES_OK}$${LINE} "
    done < "$CLASSES_FILE"
    if [ -z "$CLASSES_OK" ]; then
      log "$CLASSES_FILE present but yielded zero valid classes — sleeping."
      idle
    fi

    # ─── Load shim creds from env file (HKDF-derived ROOT_*) ──────────
    # upstream.env carries only ROOT_ACCESS_KEY + ROOT_SECRET_KEY now —
    # all upstream credentials live in rclone.conf, rendered by the
    # platform-api with passwords obscured at render time.
    set -a
    . "$UPSTREAM_ENV"
    set +a

    if [ -z "$${ROOT_ACCESS_KEY:-}" ] || [ -z "$${ROOT_SECRET_KEY:-}" ]; then
      log "FATAL: ROOT_ACCESS_KEY / ROOT_SECRET_KEY missing from upstream.env"
      idle
    fi

    log "shim launcher: classes='$${CLASSES_OK}' rendering rclone.conf-driven combined: remote"

    # ─── Go runtime memory tuning ─────────────────────────────────────
    # GOMEMLIMIT is a SOFT cap — Go will exceed it but trigger more
    # frequent GC. The pod's memory limit is the hard ceiling. The
    # combined remote with N upstreams adds ~50 MiB per additional
    # upstream type to RSS; the soft cap accommodates 2-3 upstreams
    # before the pod limit becomes the constraint.
    export GOGC="$${GOGC:-20}"
    export GOMEMLIMIT="$${GOMEMLIMIT:-200MiB}"
    export HOME=/tmp

    # ─── VFS cache dir (only used when --vfs-cache-mode != off) ───────
    # Mounted at /var/cache/rclone-shim from the daemonset's
    # rclone-cache emptyDir volume. SFTP/SMB upstreams need writes
    # cached locally; S3 upstreams pass through directly.
    CACHE_DIR=/var/cache/rclone-shim
    mkdir -p "$CACHE_DIR"

    # ─── exec rclone serve s3 against combined: ──────────────────────
    # rclone serves the `combined:` remote — clients see N buckets
    # (one per bound class) and writes route to the per-class upstream
    # backend (S3/SFTP/SMB) via the [combined] section's `upstreams =`
    # mapping.
    #
    # --vfs-cache-mode writes is needed because the combined: root may
    # include POSIX-backed (SFTP/SMB) upstreams. For S3-only operators,
    # the cache is effectively unused (vfs-write-back 0s flushes
    # immediately; cache files are evicted within seconds).
    #
    # --dir-cache-time 3s: read-after-write CONSISTENCY. The shim is a per-node
    # DaemonSet (internalTrafficPolicy: Local), so a capture and a later restore
    # can hit DIFFERENT pods, each with its own VFS directory cache. At rclone's
    # 5m default, a restore issued minutes after a capture was served a STALE
    # `snapshots/` listing that omitted the just-written snapshot, so restic
    # restore failed with NoSuchKey on an object that WAS durably on the backend
    # (SFTP has no ChangeNotify, so only dir-cache-time refreshes it). 3s bounds
    # that window well under any capture→restore gap; listings are small + rare
    # during a restore, so the extra re-list cost is negligible. (:
    # broke tenant DR restore on the staging SSH-storagebox tenant store.)
    # ─── Ready once it serves, or stop it ────────────────────────────
    # rclone opens EVERY upstream before it binds :9000, and one that never
    # answers holds them all: an SFTP server that accepts the login but never
    # sends its SFTP version (OpenSSH's chrooted internal-sftp closes every
    # possible fd first — minutes under a container's ~1e9 open-files limit)
    # left the shim serving nothing for any class. It used to mark Ready just
    # before exec, so that shim read healthy and a target switch to it
    # "succeeded". Now the serving branch is Ready only once :9000 listens, and
    # a launch not listening after STARTUP_DEADLINE seconds is stopped: the
    # container exits, kubelet restarts it with back-off (CrashLoopBackOff, which
    # the switch reports), and a fresh attempt retries a connection that hung.
    STARTUP_DEADLINE=60
    # :9000 is 2328 in /proc/net's hex, 0A is LISTEN. rclone binds [::] (tcp6)
    # or 0.0.0.0 (tcp) depending on whether the pod has IPv6.
    listening() { cat /proc/net/tcp6 /proc/net/tcp 2>/dev/null | grep -qE '^ *[0-9]+: [0-9A-F]+:2328 [0-9A-F]+:0000 0A '; }
    # This shell's pid, which is rclone's once it is exec'd ($$ is Flux's escape).
    read -r SELF _ < /proc/self/stat
    watchdog() {
      for _ in $(seq 1 "$STARTUP_DEADLINE"); do
        if listening; then ready; return 0; fi
        sleep 1
      done
      # Once more: it may have bound during the last sleep.
      if listening; then ready; return 0; fi
      log "FATAL: rclone is not serving :9000 after $STARTUP_DEADLINE s — an upstream is not answering (a target that cannot be reached, or an SFTP server that accepts the login but never starts its SFTP session). Stopping it; the pod restarts."
      kill -TERM "$SELF" 2>/dev/null || true
      sleep 10
      kill -KILL "$SELF" 2>/dev/null || true
    }
    # Double-forked, so the watchdog belongs to tini (PID 1), which reaps it —
    # not to rclone, which would not.
    ( watchdog & )
    log "launching rclone serve s3 combined:"
    # --buffer-size 1M, NOT 2M: every ranged GET pulls the requested bytes
    # PLUS up to this much read-ahead from the upstream, and the read-ahead is
    # discarded when the range ends. restic reads data one blob at a time, so
    # at 2M a bundle export pulled ~2.2x what it delivered. Measured against a
    # CIFS upstream, bytes pulled per byte served:
    #     request    2M (old)   1M      0
    #     512 KiB    4.0x       2.0x    1.01x
    #     1.6 MiB    1.88x      1.25x   1.01x
    #     16 MiB     1.13x      1.06x   1.01x   (0.52 s / 0.54 s / 2.2 s)
    # 1M halves the waste at the same speed. 0 removes it but makes big
    # sequential reads ~6x slower per stream (synchronous upstream reads),
    # which is restore time. Values under 1M behave like 0.
    exec rclone serve s3 \
      --config "$RCLONE_CONF" \
      --addr "$ADDR" \
      --auth-key "$${ROOT_ACCESS_KEY},$${ROOT_SECRET_KEY}" \
      --vfs-cache-mode writes \
      --vfs-cache-max-size 512M \
      --vfs-cache-max-age 24h \
      --vfs-cache-poll-interval 1m \
      --vfs-write-back 0s \
      --dir-cache-time 3s \
      --vfs-read-ahead 0 \
      --buffer-size 1M \
      --no-modtime \
      --no-checksum \
      --s3-chunk-size 5M \
      --s3-upload-concurrency 3 \
      --s3-memory-pool-flush-time 30s \
      --s3-disable-http2 \
      --cache-dir "$CACHE_DIR" \
      --log-level NOTICE \
      combined:
