# NOTE: the page content + nginx config are NOT inlined here. They are
# generated from the sibling directory by a configMapGenerator with the
# name-suffix hash ON, so editing either file rolls this Deployment.
#
# Both files live in ONE ConfigMap that is mounted twice: the HTML at
# /usr/share/nginx/html (re-read per request, so it was always fine) and the
# nginx config at /etc/nginx/conf.d (read once at startup, so it was NOT).
# Before 2026-09-05 a change to this ConfigMap therefore applied by halves —
# the page updated while its server config silently did not.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-bandwidth-exceeded
  namespace: platform
  labels:
    app: platform-bandwidth-exceeded
    platform.io/system: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-bandwidth-exceeded
  template:
    metadata:
      labels:
        app: platform-bandwidth-exceeded
    spec:
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            # LimitRange floor is 32Mi (see platform-suspended.yaml note).
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { memory: "64Mi" }
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
      volumes:
        - name: content
          configMap:
            name: platform-bandwidth-exceeded-content
            items:
              - key: index.html
                path: index.html
        - name: conf
          configMap:
            name: platform-bandwidth-exceeded-content
            items:
              - key: nginx.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: platform-bandwidth-exceeded
  namespace: platform
  labels:
    app: platform-bandwidth-exceeded
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: platform-bandwidth-exceeded
---
# IngressRoute for the centralized bandwidth-exceeded page. Capped tenant
# IngressRoutes get a RedirectRegex Middleware that 30x-redirects to this
# hostname. Overlays override the hostname via JSON Patch on routes[0].match
# (mirrors platform-suspended), and set BANDWIDTH_EXCEEDED_REDIRECT_URL on the
# backend Deployment to the matching URL.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-bandwidth-exceeded
  namespace: platform
  labels:
    app.kubernetes.io/part-of: hosting-platform
spec:
  entryPoints:
    - web
  routes:
    - match: "Host(`bandwidth-exceeded.platform.local`)"
      kind: Rule
      services:
        - name: platform-bandwidth-exceeded
          port: 80
