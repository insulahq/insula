# Make the barman-cloud plugin survive a single node loss.
#
# WHY THIS EXISTS (2026-09-11 node-outage drill):
#
# The vendored upstream manifest ships `replicas: 1` with
# `strategy: Recreate` and no topology constraint. During a staging drill
# the node hosting the single barman-cloud pod was killed. The CNPG
# operator could not reach the plugin:
#
#   Reconciler error … while getting plugin connection:
#   rpc error: code = Unavailable … connect: connection refused
#
# and therefore **stopped reconciling the Cluster entirely** — so it never
# promoted a new Postgres primary. The platform database and the whole
# management API stayed down for ~6.5 minutes, clearing only when
# Kubernetes' default 300 s not-ready eviction finally rescheduled the pod.
#
# The plugin already runs with `--leader-elect`, so multiple replicas are
# safe and upstream clearly anticipates them. `cnpg-cloudnative-pg` was
# already in the platform's LEADER_ELECT_DEPLOYMENTS list; barman-cloud was
# simply omitted — which made the operator's own HA pointless, because a
# reachable operator that cannot load its plugin does not reconcile.
#
# WHAT THIS PATCH DOES
#
# 1. Removes `spec.replicas` so Flux's server-side apply does not claim the
#    field. The platform-storage-policy reconciler then owns it via the
#    /scale subresource (1 in local tier, 2 in HA), exactly as it already
#    does for cert-manager, Flux and the CNPG operator itself. Without this
#    removal Flux would reset the count to 1 on every reconcile.
# 2. Spreads replicas one-per-node (DoNotSchedule), matching the
#    "all servers same state" invariant — two replicas on one node would
#    not have helped at all during the drill.
# 3. Replaces `Recreate` with a RollingUpdate so an image bump does not drop
#    every replica at once.
#
# WHY maxUnavailable IS 1 AND NOT 0 (learned the hard way on staging
# 2026-09-11, v2026.9.18-rc.2):
#
# Only the LEADER is ever Ready. The readiness probe is a TCP check on :9090,
# and the plugin opens that port only after it wins the leader lease — a
# standby sits in "Attempting to acquire leader lease..." with the port shut.
# So `readyReplicas` is 1 no matter how many replicas run.
#
# With `maxUnavailable: 0` the rollout therefore DEADLOCKS: Kubernetes will
# not remove the old leader until a new pod reports Ready, and no new pod can
# report Ready while the old leader still holds the lease. Observed exactly
# that on staging — 1/2 ready, two new pods stuck at 0/1, the old ReplicaSet's
# pod still serving, and the rollout never finishing.
#
# `maxUnavailable: 1` lets the old leader go first. The lease frees, a new pod
# takes it within the lease timeout (~15s) and opens :9090. That brief gap is
# strictly better than upstream's `Recreate`, which took every replica down.
#
# None of this weakens the node-failure fix, which is the point of the extra
# replica: when the leader's NODE dies, the standby is already running and
# acquires the lease as soon as it expires — seconds, versus the ~6.5 minutes
# it took when a single pod had to wait for Kubernetes' 300s eviction before
# being rescheduled.
#
# WHY THERE IS NO PodDisruptionBudget (measured on staging, 2026-09-11):
#
# A PDB cannot protect this workload, because its readiness reflects
# LEADERSHIP, not health. With exactly one Ready pod by design, every
# non-trivial PDB computes zero allowed disruptions:
#
#   maxUnavailable: 1 -> desiredHealthy = expectedPods - 1 = 1
#                        currentHealthy = 1  (only the leader is Ready)
#                        disruptionsAllowed = 0        <- drains blocked
#   minAvailable: 1   -> same answer by the other route.
#
# Both were tried on a live cluster and both reported
# `disruptionsAllowed: 0`, which turns routine node maintenance into a
# "delete the PDB first" ritual — strictly worse than no PDB.
#
# What actually provides the protection a PDB would have:
#   - topologySpreadConstraints below pins the two replicas to different
#     nodes, so draining one node can never take both.
#   - The standby exists precisely so evicting the leader is safe: the
#     lease transfers within its timeout (~15s) and the standby serves.
# Upstream ships no PDB either.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: barman-cloud
  namespace: cnpg-system
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: barman-cloud
