# Allow node maintenance to proceed one node at a time, while never taking
# every barman-cloud pod down at once.
#
# `maxUnavailable: 1`, NOT `minAvailable: 1` (corrected on staging 2026-09-11).
#
# Only the LEADER is ever Ready — the readiness probe is a TCP check on :9090
# and the plugin opens that port only after winning the leader lease, so a warm
# standby reports 0/1 by design. `minAvailable: 1` against a permanently
# ready-count of 1 therefore computes ALLOWED DISRUPTIONS = 0 and blocks
# draining the leader's node FOREVER — turning a safety net into a maintenance
# deadlock. Confirmed on staging: `kubectl get pdb` showed 0 allowed
# disruptions with two replicas running.
#
# `maxUnavailable: 1` permits evicting one pod — the leader — at which point
# the standby acquires the lease within the lease timeout and serves. Draining
# a second node concurrently is still refused, which is the protection worth
# keeping: the 2026-09-11 drill showed that losing every plugin replica stops
# the CNPG operator reconciling the database at all, including promoting a new
# primary.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: barman-cloud
  namespace: cnpg-system
  labels:
    app: barman-cloud
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: barman-cloud
