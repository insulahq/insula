# OWASP CRS exclusion rules for the platform-api host.
#
# Mounted into modsec-crs at
# /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
# (CRS auto-loads every *.conf in that dir; the "-BEFORE-CRS" name
# ensures we run before the main rules so `ctl:ruleRemoveTargetById`
# takes effect.)
#
# The class of false-positives this fixes: CRS LFI rules (930xxx)
# scan `ARGS_NAMES` — the NAMES of POST/JSON body fields — against
# a dictionary of "interesting" path fragments like `.secrets`,
# `.passwd`, `.config`. JSON APIs with camelCase field names like
# `secretsRestoredCount`, `configPath`, `lastLogin` match these
# substrings constantly. The fix is to remove ARGS_NAMES from each
# 930xxx rule's variable list — ARG VALUES, REQUEST_FILENAME, and
# headers are STILL scanned, so real LFI is still detected. Only
# the false-positive surface (the field NAMES themselves) is dropped.
#
# Scoped to the platform-api hostnames only:
#   admin.<apex>, client.<apex>, api.<apex>
# Tenant-facing routes (tenant.<tenant-domain>) keep full WAF
# coverage so any user-uploaded-file endpoint there still benefits
# from ARGS_NAMES inspection.
#
# Hit pattern that caused this exclusion (staging 2026-05-19):
#   POST /api/v1/system-backup/dr-drill/runs body field
#   `secretsRestoredCount` matched `.secrets` in CRS's
#   lfi-os-files.data dictionary → 403 from rule 930120.
apiVersion: v1
kind: ConfigMap
metadata:
  name: modsec-crs-exclusions
  namespace: traefik
  labels:
    app.kubernetes.io/name: modsec-crs
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: waf
data:
  REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf: |
    # ── Platform-API JSON-field-name LFI false-positive exclusion ──
    #
    # Match only requests to the platform-api hosts. The expression
    # `^(admin|tenant|api)\.` covers admin.<apex>, tenant.<apex>, and
    # api.<apex> across every cluster (staging/prod/dev). Customer
    # workload hosts (their own apex domains) and webmail etc. are
    # NOT matched and get the full CRS variable scope.
    # IMPORTANT: the Traefik modsecurity plugin proxies every
    # forwarded request with `Host: modsec-crs.traefik.svc.cluster.
    # local` (the modsec Service hostname) and puts the ORIGINAL
    # hostname in X-Forwarded-Host. Matching Host directly never
    # fires — match X-Forwarded-Host instead. Found 2026-05-19
    # debugging staging POST /system-backup/dr-drill/runs that
    # silently kept getting 403 even after the exclusion was
    # mounted + modsec rolled.
    SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx ^(admin|tenant|api)\." \
        "id:9000100,\
         phase:1,\
         pass,\
         nolog,\
         ctl:ruleRemoveTargetById=930100;ARGS_NAMES,\
         ctl:ruleRemoveTargetById=930110;ARGS_NAMES,\
         ctl:ruleRemoveTargetById=930120;ARGS_NAMES,\
         ctl:ruleRemoveTargetById=930130;ARGS_NAMES"

    # ── Same false-positive class on RFI rules (931xxx) ──
    # `ARGS_NAMES` of a JSON field can match common URL fragments
    # the RFI rules look for. Same scope, same defense preserved on
    # ARG values + headers.
    # IMPORTANT: the Traefik modsecurity plugin proxies every
    # forwarded request with `Host: modsec-crs.traefik.svc.cluster.
    # local` (the modsec Service hostname) and puts the ORIGINAL
    # hostname in X-Forwarded-Host. Matching Host directly never
    # fires — match X-Forwarded-Host instead. Found 2026-05-19
    # debugging staging POST /system-backup/dr-drill/runs that
    # silently kept getting 403 even after the exclusion was
    # mounted + modsec rolled.
    SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx ^(admin|tenant|api)\." \
        "id:9000101,\
         phase:1,\
         pass,\
         nolog,\
         ctl:ruleRemoveTargetById=931100;ARGS_NAMES,\
         ctl:ruleRemoveTargetById=931110;ARGS_NAMES,\
         ctl:ruleRemoveTargetById=931120;ARGS_NAMES,\
         ctl:ruleRemoveTargetById=931130;ARGS_NAMES"

    # ── Operator-supplied endpoint URLs containing an IP literal ──
    # CRS 931100 "URL Parameter using IP Address" matches any ARG VALUE
    # of the form `http(s)://<ip-literal>`, scores 5, and 949110 blocks
    # the request outright — the operator sees a bare nginx 403 page
    # that never reaches platform-api, so nothing appears in the API log
    # and the panel can only render "403".
    #
    # The platform API's whole job includes storing endpoints the
    # operator points it at: a self-hosted PowerDNS on a mesh IP, a
    # MinIO backup target on a LAN IP, a private registry, an ACME
    # server. Those are *configuration values*, not injected includes.
    # Every one of these routes is Bearer-authenticated (admin /
    # super_admin), and Node never include()s a value — so RFI, the
    # attack 931100 models, does not exist here. It also isn't an SSRF
    # control: it only rejects IP LITERALS, and anyone who could reach
    # these routes could pass a hostname instead and sail straight
    # through. So it costs nothing real to drop, and leaving it on
    # breaks every mesh/LAN deployment on first use.
    #
    # 9000101 above only removes ARGS_NAMES from this rule — the field
    # NAMES. This is the ARG VALUE, which that exclusion does not cover.
    #
    # Chained so the removal needs BOTH the platform-API host and the
    # /api/v1/ prefix: a tenant's own workload serving /api/v1/ on their
    # own domain keeps full 931100 coverage. Placed BEFORE the
    # single-rule 9000102 below on purpose — a chain that ends a file
    # swallows the first rule of the next-loaded (901 dynamic) file.
    # (Reported 2026-08-03: POST /api/v1/admin/dns-servers with
    # connection_config.api_url = http://<mesh-ip>:8081 → 403.)
    SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx ^(admin|tenant|api)\." \
        "id:9000103,\
         phase:1,\
         pass,\
         nolog,\
         chain,\
         ctl:ruleRemoveById=931100"
        SecRule REQUEST_URI "@rx ^/api/v1/"

    # NOTE — bearer tokens and session cookies in the audit log (FIXED).
    # SecAuditLogParts is ABIJDEFHZ, and part B is request headers, so
    # every blocked request writes the caller's full `Authorization:
    # Bearer <jwt>` and `platform_session` / `platform_refresh` cookies
    # in cleartext to this pod's stdout. The obvious fix does NOT work:
    # libmodsecurity 3.0.16 rejects the action outright at config-parse
    # time —
    #   [emerg] Action: SanitiseRequestHeader is not yet supported
    # — which crash-loops the WAF, so do not re-add it on a future pass.
    # (Verified 2026-08-03 against
    # owasp/modsecurity-crs:4.28.0-nginx-alpine-202607160307: control
    # file 855 rules OK, with the sanitise action [emerg].)
    # Dropping part B instead would break WAF Events, which resolves the
    # original hostname from request.headers["X-Forwarded-Host"] (see
    # backend/src/modules/ingress-routes/waf-log-scraper.ts).
    # RESOLVED 2026-08-04 by a third route: the JSON audit record is written to
    # a file (MODSEC_AUDIT_LOG) and the `audit-redactor` sidecar streams it to
    # stdout with the credential headers masked — see deployment.yaml. Nothing
    # here changes; do NOT re-add the sanitise action.

    # ── mTLS CRL download (crl.pem) — CRS 920440 false-positive ──
    # Rule 920440 "URL file extension is restricted by policy" matches
    # the `.pem` suffix of the CRL-download endpoint
    #   GET /api/v1/tenants/:id/mtls-providers/:pid/crl.pem
    # pushing the inbound anomaly score to 5 → 949110 blocks it with a
    # 403 (nginx page from the modsec sidecar). It's an API endpoint,
    # not a served file, so the extension check is a false positive.
    # Single (non-chained) rule matching the crl.pem URI only — that path
    # is platform-API-specific (no tenant workload serves it), so a host
    # guard is unnecessary, and avoiding the chain keeps the rule from
    # leaving a dangling `chain` that would bleed into the next-loaded
    # (dynamic) exclusion file. 920440 still guards `.bak`/`.key`/etc.
    # everywhere else. (ADR-054; confirmed 2026-07-01 via the modsec audit
    # log — ruleId 920440, TX:EXTENSION=`.pem`.)
    SecRule REQUEST_URI "@rx /mtls-providers/[^/]+/crl\.pem" \
        "id:9000102,\
         phase:1,\
         pass,\
         nolog,\
         ctl:ruleRemoveById=920440"
