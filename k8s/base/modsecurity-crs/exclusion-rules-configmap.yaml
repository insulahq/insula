# OWASP CRS exclusion rules for the platform-api host.
#
# Mounted into modsec-crs at
# /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
# (CRS auto-loads every *.conf in that dir; the "-BEFORE-CRS" name
# ensures we run before the main rules so `ctl:ruleRemoveTargetById`
# takes effect.)
#
# The class of false-positives this fixes: CRS LFI rules (930xxx)
# scan `ARGS_NAMES` — the NAMES of POST/JSON body fields — against
# a dictionary of "interesting" path fragments like `.secrets`,
# `.passwd`, `.config`. JSON APIs with camelCase field names like
# `secretsRestoredCount`, `configPath`, `lastLogin` match these
# substrings constantly. The fix is to remove ARGS_NAMES from each
# 930xxx rule's variable list — ARG VALUES, REQUEST_FILENAME, and
# headers are STILL scanned, so real LFI is still detected. Only
# the false-positive surface (the field NAMES themselves) is dropped.
#
# Scoped to the platform-api hostnames only:
#   admin.<apex>, client.<apex>, api.<apex>
# Tenant-facing routes (tenant.<tenant-domain>) keep full WAF
# coverage so any user-uploaded-file endpoint there still benefits
# from ARGS_NAMES inspection.
#
# Hit pattern that caused this exclusion (staging 2026-05-19):
#   POST /api/v1/system-backup/dr-drill/runs body field
#   `secretsRestoredCount` matched `.secrets` in CRS's
#   lfi-os-files.data dictionary → 403 from rule 930120.
apiVersion: v1
kind: ConfigMap
metadata:
  name: modsec-crs-exclusions
  namespace: traefik
  labels:
    app.kubernetes.io/name: modsec-crs
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: waf
data:
  REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf: |
    # ── Platform-API JSON-field-name LFI false-positive exclusion ──
    #
    # Match only requests to the platform-api hosts. The expression
    # `^(admin|tenant|api)\.` covers admin.<apex>, tenant.<apex>, and
    # api.<apex> across every cluster (staging/prod/dev). Customer
    # workload hosts (their own apex domains) and webmail etc. are
    # NOT matched and get the full CRS variable scope.
    # IMPORTANT: the Traefik modsecurity plugin proxies every
    # forwarded request with `Host: modsec-crs.traefik.svc.cluster.
    # local` (the modsec Service hostname) and puts the ORIGINAL
    # hostname in X-Forwarded-Host. Matching Host directly never
    # fires — match X-Forwarded-Host instead. Found 2026-05-19
    # debugging staging POST /system-backup/dr-drill/runs that
    # silently kept getting 403 even after the exclusion was
    # mounted + modsec rolled.
    SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx ^(admin|tenant|api)\." \
        "id:9000100,\
         phase:1,\
         pass,\
         nolog,\
         ctl:ruleRemoveTargetById=930100;ARGS_NAMES,\
         ctl:ruleRemoveTargetById=930110;ARGS_NAMES,\
         ctl:ruleRemoveTargetById=930120;ARGS_NAMES,\
         ctl:ruleRemoveTargetById=930130;ARGS_NAMES"

    # ── Same false-positive class on RFI rules (931xxx) ──
    # `ARGS_NAMES` of a JSON field can match common URL fragments
    # the RFI rules look for. Same scope, same defense preserved on
    # ARG values + headers.
    # IMPORTANT: the Traefik modsecurity plugin proxies every
    # forwarded request with `Host: modsec-crs.traefik.svc.cluster.
    # local` (the modsec Service hostname) and puts the ORIGINAL
    # hostname in X-Forwarded-Host. Matching Host directly never
    # fires — match X-Forwarded-Host instead. Found 2026-05-19
    # debugging staging POST /system-backup/dr-drill/runs that
    # silently kept getting 403 even after the exclusion was
    # mounted + modsec rolled.
    SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx ^(admin|tenant|api)\." \
        "id:9000101,\
         phase:1,\
         pass,\
         nolog,\
         ctl:ruleRemoveTargetById=931100;ARGS_NAMES,\
         ctl:ruleRemoveTargetById=931110;ARGS_NAMES,\
         ctl:ruleRemoveTargetById=931120;ARGS_NAMES,\
         ctl:ruleRemoveTargetById=931130;ARGS_NAMES"

    # ── Operator-supplied endpoint URLs containing an IP literal ──
    # CRS 931100 "URL Parameter using IP Address" matches any ARG VALUE
    # of the form `http(s)://<ip-literal>`, scores 5, and 949110 blocks
    # the request outright — the operator sees a bare nginx 403 page
    # that never reaches platform-api, so nothing appears in the API log
    # and the panel can only render "403".
    #
    # The platform API's whole job includes storing endpoints the
    # operator points it at: a self-hosted PowerDNS on a mesh IP, a
    # MinIO backup target on a LAN IP, a private registry, an ACME
    # server. Those are *configuration values*, not injected includes.
    # Every one of these routes is Bearer-authenticated (admin /
    # super_admin), and Node never include()s a value — so RFI, the
    # attack 931100 models, does not exist here. It also isn't an SSRF
    # control: it only rejects IP LITERALS, and anyone who could reach
    # these routes could pass a hostname instead and sail straight
    # through. So it costs nothing real to drop, and leaving it on
    # breaks every mesh/LAN deployment on first use.
    #
    # 9000101 above only removes ARGS_NAMES from this rule — the field
    # NAMES. This is the ARG VALUE, which that exclusion does not cover.
    #
    # Chained so the removal needs BOTH the platform-API host and the
    # /api/v1/ prefix: a tenant's own workload serving /api/v1/ on their
    # own domain keeps full 931100 coverage. Placed BEFORE the
    # single-rule 9000102 below on purpose — a chain that ends a file
    # swallows the first rule of the next-loaded (901 dynamic) file.
    # (Reported 2026-08-03: POST /api/v1/admin/dns-servers with
    # connection_config.api_url = http://<mesh-ip>:8081 → 403.)
    SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx ^(admin|tenant|api)\." \
        "id:9000103,\
         phase:1,\
         pass,\
         nolog,\
         chain,\
         ctl:ruleRemoveById=931100"
        SecRule REQUEST_URI "@rx ^/api/v1/"

    # ── Catalog deploys: parameter VALUES are container config, not
    #    paths the platform opens ──────────────────────────────────────
    #
    # POST /api/v1/tenants/:id/deployments (and PATCH …/deployments/:id)
    # carry the catalog entry's parameter values as
    # ARGS:json.configuration.<KEY>. Two catalog entries ship a docroot
    # default of `/var/www/html` (apache-php APACHE_DOCUMENT_ROOT,
    # nginx-php NGINX_WEBROOT); CRS 930120 matches the `var/www` entry
    # of lfi-os-files.data inside that VALUE, scores 5, and 949110
    # blocks the deploy at the edge — every deploy of either entry
    # failed before the API ever saw it. Measured 2026-08-26 on a live
    # cluster (CRS 4.28.0): "Matched Data: var/www found within
    # ARGS:json.configuration.APACHE_DOCUMENT_ROOT: /var/www/html".
    # The parameter's own help text recommends `/var/www/html/public`
    # for Laravel — also blocked — and the PATCH edit path blocks the
    # same body, so a hit could not even be corrected afterwards.
    #
    # Why removing this target costs nothing: configuration values
    # are rendered into the TENANT's own container spec (env vars) by
    # the provisioner. platform-api never opens them as paths, never
    # executes them, and never renders them into an admin page
    # unescaped. 9000100 already dropped the field-NAME half of this
    # class; this is the VALUE half, on this endpoint family only.
    #
    # Shape note: the precise form — removing only the
    # ARGS:/^json\.configuration\./ members — is NOT available:
    # libmodsecurity 3.0.16 rejects regex-form targets in
    # ctl:ruleRemoveTarget* at config-parse time ("Expecting an
    # action"), which crash-loops the WAF exactly like the
    # SanitiseRequestHeader note below. (Verified 2026-08-26 against
    # owasp/modsecurity-crs:4.28.0-nginx-alpine-202607160307.) So the
    # whole ARGS collection is dropped from 930120 for THIS endpoint
    # family only. 930120 keeps its cookie targets here; traversal
    # (930100/110) and restricted-files (930130) keep full ARGS
    # coverage even here — `storage_path=../../etc/passwd` still
    # blocks; only the path-DICTIONARY match is off, and a dictionary
    # is no real guard for an authenticated config API anyway (any
    # attacker can name a path not in it).
    #
    # The other half of this class is the 932xxx "Remote Command Execution"
    # family, which by design matches shell text — and the endpoints below
    # exist precisely to ACCEPT shell text and container configuration.
    # Measured on a live cluster 2026-08-31 (CRS 4.28.0), every one a bare
    # edge 403 the API never saw, read from the modsec audit log:
    #
    #   932160  `dev/stderr` in PHP_ERROR_LOG=/dev/stderr — the platform's
    #           OWN Apache+PHP catalog default. Container logs must go to
    #           stderr to appear in `kubectl logs`, so EVERY Apache+PHP
    #           deploy with untouched defaults was refused. Not an edge
    #           case: the default path.
    #   932160  `bin/sh` in `/bin/sh -c …`
    #   932250  `/bin/sh -c` — the canonical container entrypoint
    #   932260  `docker-` in `docker-php-entrypoint apache2-foreground`,
    #           the official PHP-Apache image's own entrypoint
    #   932235  `&& exec ` in `… migrate --force && exec php-fpm`, the
    #           standard PID-1 signal-handling idiom
    #
    # Chasing these one id at a time is a treadmill. 9000108/9000109/9000110
    # previously carried THREE DIFFERENT subsets of the family across three
    # sibling endpoints, so /dev/stderr was allowed on /deployments but
    # blocked on /cron-jobs, while `&& exec` was blocked on /deployments and
    # allowed on /cron-jobs. Whichever id was not yet listed produced the
    # next "the WAF blocks my deploy" report. They are now ONE rule.
    #
    # So: remove the WHOLE 932000-932999 family from ARGS on this endpoint
    # group. A cron command, a container entrypoint and an app-terminal
    # command ARE shell code — an RCE rule matching them is definitionally a
    # false positive, not a detection. The tenant is authorised to run shell
    # in their own container; the controls that matter are authn/authz and
    # the container sandbox, and the WAF was never one of them here.
    #
    # STILL fully enforced on these endpoints: traversal 930100/930110
    # (`../` in any field still blocks — the probe asserts this as a
    # control), restricted-files 930130, and the 941/942/933 XSS / SQLi /
    # PHP-injection families on every field. The 932xxx family keeps FULL
    # coverage on every other endpoint, and on the URI, headers and cookies
    # even here.
    #
    # ⚠ USE ruleRemoveById FOR THE RANGE, NOT ruleRemoveTargetById.
    # Measured 2026-08-31 on libmodsecurity 3.0.16 / CRS 4.28.0:
    #
    #   ctl:ruleRemoveTargetById=932000-932999;ARGS   parses, NO EFFECT
    #   ctl:ruleRemoveById=932000-932999              parses, WORKS
    #
    # Both pass `nginx -t` and both appear in the running container, so
    # neither "it loaded" nor "the directive is there" distinguishes them —
    # only a request does. The first form was deployed to DEV and left all
    # 30 matrix cells at 403 while the 930120 removal in the SAME action
    # list worked, which is what isolated it. This is the third time a rule
    # in this file loaded cleanly and did nothing (see 930130 above, and
    # args_names_only in the DB-backed exclusions); assert the REQUEST,
    # never the config. `make waf-probe` is the assertion.
    #
    # Trade-off of ruleRemoveById: it disables 932xxx entirely for matching
    # requests, so the family no longer inspects the URI/headers/cookies on
    # these four endpoint groups either — not just ARGS. Acceptable here:
    # the URIs are fixed platform API paths, and traversal (930100/930110),
    # restricted-files (930130) and the 941/942/933 families still cover
    # every field. The probe asserts SQLi on /deployments still 403s.
    #
    # Covers, including all subpaths: deployments (and …/<id>/terminal —
    # the app terminal), custom-deployments (+ /validate), tenant cron-jobs
    # (+ /run) and admin cron-jobs (+ /bulk).
    #
    # Chained host+URI like 9000103: a tenant workload serving its own
    # /api/v1/tenants/…/deployments on a tenant domain keeps coverage.
    SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx ^(admin|tenant|api)\." \
        "id:9000108,\
         phase:1,\
         pass,\
         nolog,\
         chain,\
         ctl:ruleRemoveTargetById=930120;ARGS,\
         ctl:ruleRemoveById=932000-932999"
        SecRule REQUEST_URI "@rx ^/api/v1/(tenants/[^/]+/(deployments|custom-deployments|cron-jobs)|admin/cron-jobs)(/|\?|$)"

    # ── Custom containers: env values, commands, mount paths and
    #    compose documents are the tenant's own container spec ────────
    #
    # POST/PUT/PATCH /api/v1/tenants/:id/custom-deployments[/:id] and
    # …/custom-deployments/validate carry free-text fields that are, by
    # definition, filesystem paths and shell text for the TENANT's own
    # container. Measured blocks on a live cluster 2026-08-26
    # (CRS 4.28.0), all as bare edge 403s the API never saw:
    #
    #   volumes[].containerPath /var/lib/mysql        930120 (var/lib/mysql)
    #   volumes[].containerPath /var/www/html         930120 (var/www)
    #   env[].value /etc/app/config.yaml              930120 — matched on
    #       `config.yaml` alone, not the /etc prefix; `wp-config.php`
    #       in any env value blocks the same way
    #   command "… migrate --force && exec php-fpm"   932235 — the
    #       `… && exec <word>` idiom, i.e. the canonical container
    #       entrypoint pattern for PID-1 signal handling
    #   compose_yaml with `db_data:/var/lib/mysql`    930120 — the
    #       canonical WordPress+MySQL compose file; /validate blocks
    #       too, so the editor could not even preview it
    #
    # These fields are opaque data: the backend Zod-validates the
    # structure (containerPath already rejects `..`, `//` and
    # system-reserved dirs server-side; env NAMES are regex-locked),
    # renders them into k8s specs, and never executes or opens any of
    # it. Same category error as scanning file-manager content
    # (9000104-9000106).
    #
    # Per-field member removal (ARGS:/^json\.env\.array_\d+\.value$/ …)
    # is the shape we wanted, but libmodsecurity 3.0.16 rejects
    # regex-form ctl targets at parse time (see 9000108), and the
    # array_N member names are unbounded, so literals cannot enumerate
    # them. Fallback: drop the ARGS collection from the two rule ids
    # measured to fire on legitimate container specs, on this endpoint
    # family only. Everything else — 941/942/933 injection families on
    # every field, traversal 930100/110 (a `../` mount path or query
    # arg still blocks), 930130, and all rules on cookies/URI/headers —
    # stays on, so e.g. SQLi in `image` still blocks here. Add further
    # ids ONLY with a measured false positive.
    #
    # 9000109 (custom-deployments) was RETIRED 2026-08-31 — folded into
    # 9000108, which now covers this URI with the whole 932xxx family
    # instead of just 932235. Keeping three sibling endpoints on three
    # different subsets was the bug, not the fix.

    # ── Cron jobs: the command IS shell text for the tenant's pod ────
    #
    # POST/PATCH /api/v1/tenants/:id/cron-jobs[/:id] carry
    # ARGS:json.command — a shell command line run inside the tenant's
    # own workload container. `php /var/www/html/artisan schedule:run`
    # (the textbook Laravel cron) blocked via 930120 on `var/www`
    # (measured 2026-08-26); any `… && exec …` or path-bearing command
    # would trip the same families. Same data-not-parameter reasoning
    # and same two measured rule ids as 9000109 (ARGS-collection
    # removal — see 9000108 for why per-member removal is not
    # available). `schedule` is regex-locked server-side; traversal
    # rules and every other family keep full coverage on all fields,
    # including a webcron `url` with `../` in it.
    #
    # 9000110 (cron-jobs) was RETIRED 2026-08-31 — folded into 9000108.
    # Two gaps it had, both fixed by the consolidation:
    #   · it carried 932235 but NOT 932160, so a cron command containing
    #     `/dev/stderr` or `/bin/sh` was blocked while `&& exec` passed;
    #   · it matched ONLY `/api/v1/tenants/<id>/cron-jobs`, so the ADMIN
    #     endpoints `/api/v1/admin/cron-jobs` and `…/bulk` had no
    #     exclusion at all — an admin-created cron job carrying an
    #     ordinary shell command was blocked outright.

    # NOTE — bearer tokens and session cookies in the audit log (FIXED).
    # SecAuditLogParts is ABIJDEFHZ, and part B is request headers, so
    # every blocked request writes the caller's full `Authorization:
    # Bearer <jwt>` and `platform_session` / `platform_refresh` cookies
    # in cleartext to this pod's stdout. The obvious fix does NOT work:
    # libmodsecurity 3.0.16 rejects the action outright at config-parse
    # time —
    #   [emerg] Action: SanitiseRequestHeader is not yet supported
    # — which crash-loops the WAF, so do not re-add it on a future pass.
    # (Verified 2026-08-03 against
    # owasp/modsecurity-crs:4.28.0-nginx-alpine-202607160307: control
    # file 855 rules OK, with the sanitise action [emerg].)
    # Dropping part B instead would break WAF Events, which resolves the
    # original hostname from request.headers["X-Forwarded-Host"] (see
    # backend/src/modules/ingress-routes/waf-log-scraper.ts).
    # RESOLVED 2026-08-04 by a third route: the JSON audit record is written to
    # a file (MODSEC_AUDIT_LOG) and the `audit-redactor` sidecar streams it to
    # stdout with the credential headers masked — see deployment.yaml. Nothing
    # here changes; do NOT re-add the sanitise action.

    # ── mTLS CRL download (crl.pem) — CRS 920440 false-positive ──
    # Rule 920440 "URL file extension is restricted by policy" matches
    # the `.pem` suffix of the CRL-download endpoint
    #   GET /api/v1/tenants/:id/mtls-providers/:pid/crl.pem
    # pushing the inbound anomaly score to 5 → 949110 blocks it with a
    # 403 (nginx page from the modsec sidecar). It's an API endpoint,
    # not a served file, so the extension check is a false positive.
    # Single (non-chained) rule matching the crl.pem URI only — that path
    # is platform-API-specific (no tenant workload serves it), so a host
    # guard is unnecessary, and avoiding the chain keeps the rule from
    # leaving a dangling `chain` that would bleed into the next-loaded
    # (dynamic) exclusion file. 920440 still guards `.bak`/`.key`/etc.
    # everywhere else. (ADR-054; confirmed 2026-07-01 via the modsec audit
    # log — ruleId 920440, TX:EXTENSION=`.pem`.)
    SecRule REQUEST_URI "@rx /mtls-providers/[^/]+/crl\.pem" \
        "id:9000102,\
         phase:1,\
         pass,\
         nolog,\
         ctl:ruleRemoveById=920440"

    # ── File-manager content is opaque DATA, not a request parameter ──
    #
    # POST /api/v1/tenants/:id/files/write carries the bytes of a file the
    # tenant is saving into their own volume, as ARGS:json.content. CRS scans
    # it as though it were a parameter the platform interprets, so writing an
    # ordinary website file is refused. Measured on a live cluster (CRS 4.28.0):
    #
    #   <h1>hello</h1>                          reaches the app
    #   <!doctype html><html>…</html>           403   941100 + 941160
    #   <html><head><script src=…>              403
    #   <?php echo $_GET["q"]; ?>               403
    #   #!/bin/sh … cat /etc/passwd             403
    #   SELECT * FROM users WHERE id=1 OR 1=1   403
    #
    # A tenant could not save index.html or index.php through the file manager
    # — on a web hosting platform. The block happens at the edge, so the API
    # never sees the request and the panel surfaces a bare nginx 403 with no
    # usable error.
    #
    # Why removing this target costs nothing: the SAME bytes already reach the
    # SAME file over SFTP, which has no WAF in front of it. The rule never
    # prevented the content from being stored — it only blocked the UI path
    # while leaving the CLI path open. And the content is never interpreted by
    # the platform: it is written to a file, not evaluated, not rendered into
    # an admin page, not concatenated into a query.
    #
    # Scoped by tag rather than by rule ID so a CRS upgrade that adds new XSS
    # or injection rules does not silently re-break saving a PHP file. Every
    # other argument on this endpoint — `path` above all — keeps full CRS
    # coverage, which is what actually matters here: `path` is the field a
    # traversal attack would use.
    #
    # Non-chained, matching a platform-API-specific URI, for the reason given
    # in the crl.pem rule above: a dangling `chain` bleeds into the next-loaded
    # (dynamic) exclusion file.
    SecRule REQUEST_URI "@rx ^/api/v1/tenants/[^/]+/files/write" \
        "id:9000104,\
         phase:1,\
         pass,\
         nolog,\
         ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.content"

    # ── Raw upload: the body IS the file ──────────────────────────
    #
    # POST /api/v1/tenants/:id/files/upload-raw sends the file bytes as the
    # request body with Content-Type: application/octet-stream. Two problems,
    # both measured on a live cluster:
    #
    #   920420 "Request content type is not allowed by policy" rejects
    #   application/octet-stream outright — so EVERY raw upload failed, even a
    #   plain text file. (Control: plain text via upload-raw 403; the same
    #   bytes via multipart upload 401. The content was never the issue.)
    #
    #   Body-inspection rules then scan the file itself, so a .php or .html
    #   upload trips the injection families on its way to disk.
    #
    # The body of this endpoint is, by definition, an arbitrary file. Scanning
    # it as a request payload is a category error — and SFTP writes the same
    # bytes to the same place with no WAF at all. The `path` query argument is
    # untouched and keeps full coverage.
    SecRule REQUEST_URI "@rx ^/api/v1/tenants/[^/]+/files/upload-raw" \
        "id:9000105,\
         phase:1,\
         pass,\
         nolog,\
         ctl:ruleRemoveById=920420,\
         ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_BODY,\
         ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS_POST"

    # ── Multipart upload: same reasoning, different variables ─────
    #
    # POST /api/v1/tenants/:id/files/upload sends the file as a multipart part.
    # 933110 "PHP Injection Attack: PHP Script File Upload Found" fires on the
    # FILENAME, so uploading index.php was refused on a platform whose purpose
    # is hosting PHP sites. FILES_TMP_CONTENT covers the part's bytes.
    #
    # FILES_NAMES (the form field name) keeps coverage — that is our own field
    # name, not tenant data, so a match there is a real anomaly.
    SecRule REQUEST_URI "@rx ^/api/v1/tenants/[^/]+/files/upload(\?|$)" \
        "id:9000106,\
         phase:1,\
         pass,\
         nolog,\
         ctl:ruleRemoveById=920420,\
         ctl:ruleRemoveTargetByTag=OWASP_CRS;FILES,\
         ctl:ruleRemoveTargetByTag=OWASP_CRS;FILES_TMP_CONTENT,\
         ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_BODY"

    # ── Reading a file back must not be treated as data leakage ───
    #
    # The RESPONSE-side rules fire when the file manager returns file contents:
    # 953120 "PHP source code leakage" matches `<?php` in the response body,
    # and 959100 aggregates it into an outbound block. Opening index.php in the
    # editor — or downloading it — is the tenant reading THEIR OWN file, which
    # they authenticated for. The leakage rules exist to catch a compromised
    # app spilling source it did not mean to; an endpoint whose entire job is
    # returning file bytes is not that.
    #
    # Scoped to the file read/download endpoints only. Every other response on
    # the platform keeps outbound inspection.
    SecRule REQUEST_URI "@rx ^/api/v1/tenants/[^/]+/files/(read|download)" \
        "id:9000107,\
         phase:1,\
         pass,\
         nolog,\
         ctl:ruleRemoveByTag=OWASP_CRS/LEAKAGE,\
         ctl:ruleRemoveById=953100,\
         ctl:ruleRemoveById=953110,\
         ctl:ruleRemoveById=953120"

    # ── File-manager path ARGUMENTS are file paths, by definition ──
    #
    # CRS 930xxx match ARG VALUES against `lfi-os-files.data`, a dictionary of
    # interesting OS filenames: `.htaccess`, `.htpasswd`, `web.config`,
    # `httpd.conf`, `passwd`, `.bash_history`, … The file-manager API takes a
    # FILE PATH as its argument, so a tenant operating on their own `.htaccess`
    # — a completely ordinary web file that ships in most PHP applications —
    # puts that string in an ARG value and scores 5 per match.
    #
    # Reproduced on DEV 2026-08-30, POST …/files/rename:
    #   {"oldPath":"/x/.htaccess","newPath":"/x/.htaccess2"}  → 403 (score 10)
    #   {"oldPath":"/x/web.config","newPath":"/x/w2"}         → 403 (score  5)
    #   {"oldPath":"/x/normal.txt","newPath":"/x/n2.txt"}     → 404 (passed)
    # Two matching arguments score 10, which is why RENAMING a file failed
    # while most other operations on the same tree succeeded. Reported from
    # production after extracting a CMS archive that contains `.htaccess`.
    #
    # 9000100 above already removed ARGS_NAMES from these rules. That is not
    # enough here: the offending string is the ARG VALUE, not the field name.
    #
    # Why dropping ARGS for these endpoints is safe: path traversal is refused
    # by `safePath()` in the sidecar, which resolves the real path and rejects
    # anything outside the tenant's own volume — a check the tenant cannot
    # influence and which does not depend on pattern matching. The WAF adds no
    # defence here that survives a rename to a legitimately-named file, and it
    # is guaranteed to false-positive on ordinary web filenames. REQUEST_URI,
    # headers and the request body as a whole stay inspected by every other
    # rule; only these four rules stop looking at ARGS on these paths.
    #
    # Deliberately NOT scoped by X-Forwarded-Host: the file-manager API is
    # reached from both admin.<apex> and tenant.<apex>, and both were failing.
    SecRule REQUEST_URI "@rx ^/api/v1/tenants/[^/]+/files/" \
        "id:9000111,\
         phase:1,\
         pass,\
         nolog,\
         ctl:ruleRemoveTargetById=930100;ARGS,\
         ctl:ruleRemoveTargetById=930110;ARGS,\
         ctl:ruleRemoveTargetById=930120;ARGS,\
         ctl:ruleRemoveTargetById=930130;ARGS"

    # ── 930120 OS-file DICTIONARY vs. a hosting control panel ──
    #
    # 930120 matches ARG values against `lfi-os-files.data`: `.htaccess`,
    # `.htpasswd`, `web.config`, … In a hosting panel those are ordinary DATA,
    # not attack indicators.
    #
    # IT IS 930120, NOT 930130 — this cost two failed deploys. Read the rules:
    #   930120  ARGS|ARGS_NAMES|REQUEST_COOKIES|…  @pmFromFile lfi-os-files.data
    #   930130  REQUEST_FILENAME                   @pmFromFile restricted-files.data
    # 930130 only ever looks at the URL PATH, so `ctl:…=930130;ARGS` removes a
    # target the rule does not have — a silent no-op that deploys cleanly and
    # changes nothing. The admin panel labels the event "OS File Access
    # Attempt", which IS 930120's name; trust that over any guess.
    #
    # The dictionary membership also explains the probe results exactly:
    #   web.config/.htaccess/.htpasswd → lfi-os-files.data  → blocked (930120)
    #   .env                           → restricted-files only → PASSED
    #   httpd.conf                     → in no data file       → PASSED
    #
    # Measured on DEV
    # 2026-08-30 — every one of these was a 403 that never reached the API:
    #
    #   POST …/files/rename        {"oldPath":"/p/.htaccess"}      (fixed by 9000111)
    #   POST …/files/copy          {"sourcePath":"/p/.htaccess"}   (fixed by 9000111)
    #   POST …/files/delete        {"path":"/p/.htaccess"}         (fixed by 9000111)
    #   POST …/sftp-users          {"homePath":"/.git/config"}
    #   POST …/databases           {"name":"web.config"}
    #   POST …/domains             {"domain":".htpasswd.example.test"}
    #   POST /api/v1/admin/dns/records {"name":".htaccess"}
    #
    # A per-endpoint exclusion for each is whack-a-mole: the offending value
    # can appear in any argument of any endpoint, and the operator only finds
    # out when a tenant reports that something "fails without error".
    #
    # 9000108 already made this argument for 930120 and deliberately kept
    # 930130 — but it was reasoning about ONE config endpoint family, and it
    # scoped that exclusion to /deployments only. Across
    # domains, database names and DNS records the dictionary match is pure
    # noise, and as that same comment says: a dictionary is no real guard for
    # an authenticated API, because an attacker simply names a path that is
    # not in it. The real controls are `safePath()` in the file-manager
    # sidecar, per-tenant authorization, and input validation.
    #
    # DELIBERATELY NARROW:
    #   * Only 930120, and only its ARGS. Traversal (930100/930110) keeps FULL
    #     ARGS coverage — `storage_path=../../etc/passwd` still blocks, and
    #     930130 keeps its REQUEST_FILENAME coverage untouched.
    #   * Only the platform's own API hosts (admin|tenant|api). A tenant's own
    #     workload on their own domain keeps the complete rule set, so a real
    #     app being probed for `.git/config` is still protected.
    #   * REQUEST_URI, headers and cookies are still scanned by 930120 here;
    #     only ARGS are dropped.
    #
    # This is a security-posture change. Reverting it means restricted-file
    # names in API arguments are blocked again, including the legitimate ones
    # listed above.
    # SYNTAX, learned the hard way: the `ctl:` action belongs in the CHAIN
    # STARTER's action list, next to `chain`. Written with the ctl on the
    # second rule of the chain it parses, loads, logs nothing — and silently
    # does not apply. The first version of 9000112 did exactly that: the
    # ConfigMap deployed, `grep 9000112` found it inside the running container,
    # and every probe case was still blocked. 9000108/9000109/9000110 all put
    # the ctl in the starter; copy that shape, not this comment.
    SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx ^(admin|tenant|api)\." \
        "id:9000112,\
         phase:1,\
         pass,\
         nolog,\
         chain,\
         ctl:ruleRemoveTargetById=930120;ARGS"
        # The action list is REQUIRED here because this is the LAST rule in the
        # file. A chained SecRule with no actions leaves the parser expecting
        # one, and at EOF it continues into the NEXT rule file — CRS loads
        # REQUEST-901-…-DYNAMIC.conf immediately after this one, so the failure
        # surfaced as "Line 1, Column 52, Expecting an action, got: #
        # AUTO-GENERATED by waf-rule-exclusions reconciler" in a file that
        # contains nothing but comments. nginx refused to start, modsec-crs
        # CrashLoopBackOff'd, and EVERY request through the WAF returned 502.
        #
        # 9000103/9000108 omit the action list and are fine only because they
        # are mid-file — the parser recovers on the next comment line. Never
        # copy that shape to the end of this file.
        SecRule REQUEST_URI "@rx ^/api/v1/" "t:none"
