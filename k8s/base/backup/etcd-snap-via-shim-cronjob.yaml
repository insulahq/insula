# R-X7: etcd snapshot upload via the universal backup-rclone-shim.
#
# Replaces `etcd-snapshot-cronjob.yaml`'s direct-to-S3 path with a
# uniform shim flow:
#
#   k3s etcd snapshots (hostPath RO) → rclone copy → shim ClusterIP:9000
#                                                       ↓
#                                  s3://system/etcd/<cluster_id>/<host>-<ts>.db
#                                                       ↓
#                                        upstream target (S3 / SFTP / CIFS / NFS)
#
# The SHIM_PREFIX below ships as the legacy `etcd` seed; platform-api's
# etcd-cronjob reconciler rewrites it to `etcd/<cluster_id>` at runtime so two
# clusters sharing one S3 target never cross-contaminate (seed-then-disown via
# the reconcile:disabled annotation — see metadata.annotations).
#
# The shim's `s3://system` bucket is rclone-`crypt` wrapped — the
# on-the-wire payload is encrypted with BACKUP_TARGET_KEY before it
# reaches the upstream backend.
#
# `suspend: true` default — flipped by platform-api's
# `etcd-cronjob` reconciler when the SYSTEM-class shim target is
# bound. When SYSTEM is unassigned, this CronJob stays suspended so
# the hourly tick doesn't generate noisy "shim bucket not found"
# failures.
#
# Hourly schedule per RFC §13. The k3s side already keeps a 24-slot
# rolling local-disk window via `--etcd-snapshot-schedule-cron 0 * * * *`
# and `--etcd-snapshot-retention 24`; this CronJob is the off-box
# (DR) copy on top.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snap-via-shim
  namespace: platform
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: dr-backup
    app.kubernetes.io/managed-by: platform-api-etcd-cronjob
    insula.host/backup-health-watch: "true"
    insula.host/backup-category: "dr"
    insula.host/backup-severity: "critical"
  annotations:
    insula.host/backup-display-name: "etcd snapshot via shim"
    # Seed-then-disown: Flux seeds this CronJob with the legacy `etcd` SHIM_PREFIX
    # (line ~106) and `suspend: true`, then steps back so platform-api's
    # etcd-cronjob reconciler owns both runtime fields — it toggles `suspend` on
    # SYSTEM-target binding AND namespaces the upload prefix by the stable
    # cluster_id (SHIM_PREFIX → `etcd/<cluster_id>`) so two clusters sharing one
    # S3 target can never cross-contaminate (a `--latest` etcd restore pulling
    # ANOTHER cluster's snapshot would be catastrophic). Without this, Flux would
    # revert both on every sync. We disown the whole object (vs the stalwart-
    # snapshot `ssa: Merge` + strip-suspend pattern) because SHIM_PREFIX is a
    # LIST-ELEMENT value the reconciler overrides — `ssa: Merge` is documented
    # not to preserve such ownership (see bootstrap.sh's stalwart strip comment),
    # and a single env-element value can't be cleanly stripped via JSON6902.
    #
    # TRADE-OFF: Flux creates this object on a FRESH cluster (with the full spec,
    # incl. the /tmp emptyDir below) but SKIPS updating it once it exists. So a
    # STRUCTURAL manifest change (e.g. the /tmp volume) does NOT auto-reach an
    # already-running cluster via Flux — apply it once by hand:
    #   kubectl -n platform patch cronjob etcd-snap-via-shim --type=strategic -p \
    #     '{"spec":{"jobTemplate":{"spec":{"template":{"spec":{"volumes":[{"name":"tmp","emptyDir":{}}],"containers":[{"name":"rclone","volumeMounts":[{"name":"tmp","mountPath":"/tmp"}]}]}}}}}}'
    # or delete the CronJob and let Flux recreate it from this manifest.
    kustomize.toolkit.fluxcd.io/reconcile: disabled
spec:
  # Reconciler toggles off when SYSTEM target is bound.
  suspend: true
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 1800
  jobTemplate:
    # The backup-health watcher selects JOBS, not CronJobs, and the CronJob
    # controller copies ONLY spec.jobTemplate.metadata onto the Jobs it
    # creates — labels on the CronJob's own metadata never reach them.
    #
    # backup-health-labels-reconciled-by: backup-rclone-shim/etcd-cronjob.ts
    # This CronJob is seed-then-disown (see `reconcile: disabled` below), so
    # THIS BLOCK ONLY REACHES A FRESH INSTALL — kustomize-controller reports
    # "skipped" for a disowned object on every apply. On DEV the
    # manifest carried it while the live object's spec.jobTemplate.metadata
    # was {}. The reconciler converges the same labels onto existing
    # clusters; keep the two in sync.
    # Proven on DEV: three labelled CronJobs firing normally,
    # `kubectl get jobs -A -l insula.host/backup-health-watch=true` empty.
    # Keep this block in sync with the CronJob-level labels above.
    metadata:
      labels:
        insula.host/backup-health-watch: "true"
        insula.host/backup-category: "dr"
        insula.host/backup-severity: "critical"
      annotations:
        insula.host/backup-display-name: "etcd snapshot via shim"
    spec:
      backoffLimit: 2
      # TTL keeps completed Job + Pod state around for one hour so
      # operators can debug — but not forever (drift cleanup runs
      # daily via job-gc-cronjob).
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: hosting-platform
            app.kubernetes.io/component: dr-backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: default
          # k3s snapshot dir is on the control-plane node only. On a
          # HA cluster this pins to one of the 3 servers; on a
          # single-node cluster the only node matches.
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
              operator: Exists
            - key: node-role.kubernetes.io/master
              effect: NoSchedule
              operator: Exists
          containers:
            - name: rclone
              # rclone image (~25 MiB) — same family as the shim
              # image. We pin the upstream rclone/rclone tag here
              # because the platform-api never edits this manifest at
              # runtime; the reconciler only toggles spec.suspend.
              image: rclone/rclone:1.74.4
              imagePullPolicy: IfNotPresent
              env:
                # Shim S3 endpoint. ClusterIP + Service.internalTraffic
                # Policy=Local mean kube-proxy routes this Pod's
                # request to the on-node shim pod (zero cross-node
                # data hops).
                - name: RCLONE_S3_ENDPOINT
                  value: http://backup-rclone-shim.platform.svc.cluster.local:9000
                # HKDF-derived creds from BACKUP_TARGET_KEY. Same
                # Secret the R-X6 postgres ObjectStore reads.
                - name: RCLONE_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-rclone-shim-creds
                      key: access_key
                - name: RCLONE_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-rclone-shim-creds
                      key: secret_key
                - name: SHIM_BUCKET
                  value: system
                # Legacy day-0 seed. The etcd-cronjob reconciler rewrites this
                # to `etcd/<cluster_id>` at runtime (seed-then-disown) so two
                # clusters on one S3 target never collide. Restore tooling reads
                # the live value back, so upload + restore paths always match.
                - name: SHIM_PREFIX
                  value: etcd
                # 24-snap retention — matches k3s side. The shim's
                # crypt bucket re-encrypts on upload, so old objects
                # are only useful with the current BACKUP_TARGET_KEY
                # (post-rotation, all old objects are inert).
                - name: RETENTION_COUNT
                  value: "24"
              # POSIX sh — alpine rclone image ships sh + coreutils
              # only. No bash arrays.
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  SRC=/snapshots
                  if [ ! -d "$$SRC" ]; then
                    echo "[etcd-shim] snapshot dir missing — is this a k3s server node?"
                    exit 1
                  fi
                  cd "$$SRC"
                  # Pick snapshots modified in the last hour. We
                  # bias toward the latest k3s auto-snapshot — if
                  # the operator triggered a manual snapshot via
                  # `make etcd-snapshot-now`, that one's also <1h
                  # old and will land in the same upload batch.
                  TMP=/tmp/etcd-files
                  find . -maxdepth 1 -type f -mmin -75 2>/dev/null | sed 's|^\./||' > "$$TMP" || true
                  if [ ! -s "$$TMP" ]; then
                    echo "[etcd-shim] no snapshots <75min old. k3s auto-schedule defaults to 0 */12 * * *; first-cycle clusters may skip until the next auto-snap. Exiting clean."
                    exit 0
                  fi
                  # `$$VAR` inside $( ) never reaches the shell as `$VAR`:
                  # this CronJob ships `reconcile: disabled`, so Flux SKIPS it
                  # and never collapses `$$`, and the kubelet — which does
                  # collapse `$$` — leaves any `$( ... )` span untouched
                  # because it cannot resolve it as a variable reference. The
                  # shell then reads `$$` as its own PID. Bind the value
                  # OUTSIDE the substitution, where both renderers behave.
                  t="$$TMP"; COUNT=$(wc -l < "$t" | tr -d ' ')
                  CFG_FLAGS="--s3-provider=Other \
                             --s3-endpoint=$$RCLONE_S3_ENDPOINT \
                             --s3-access-key-id=$$RCLONE_S3_ACCESS_KEY_ID \
                             --s3-secret-access-key=$$RCLONE_S3_SECRET_ACCESS_KEY \
                             --s3-force-path-style \
                             --s3-region=auto \
                             --s3-no-check-bucket"
                  HOST=$(hostname)
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  while IFS= read -r name; do
                    [ -z "$$name" ] && continue
                    DEST="$$HOST-$$TS-$$name.db"
                    echo "[etcd-shim] upload $$name → s3:$$SHIM_BUCKET/$$SHIM_PREFIX/$$DEST"
                    # rclone copy with the shim as :s3: remote. The
                    # source is a single file; rclone reads the local
                    # path and streams to S3 in one PUT.
                    rclone $$CFG_FLAGS copyto "$$name" \
                      ":s3:$$SHIM_BUCKET/$$SHIM_PREFIX/$$DEST"
                    # Sidecar metadata (timestamp + sha256 + source
                    # node) so operators can pick the right snapshot
                    # to restore from without listing object content.
                    # Same `$$`-inside-$( ) trap as COUNT above. Until
                    # this silently produced an EMPTY sha256 on
                    # every uploaded snapshot (24 of 24 on production), so no
                    # stored snapshot could be verified before a restore.
                    f="$$name"; SHA=$(sha256sum "$f" | cut -d ' ' -f 1)
                    META="{\"timestamp\":\"$$TS\",\"sha256\":\"$$SHA\",\"node\":\"$$HOST\",\"source\":\"$$name\"}"
                    echo "$$META" | rclone $$CFG_FLAGS rcat \
                      ":s3:$$SHIM_BUCKET/$$SHIM_PREFIX/$$DEST.meta"
                  done < "$$TMP"
                  # Retention: keep the newest RETENTION_COUNT. List, sort
                  # desc, skip the ones we keep, rm the rest. Both the .db and
                  # .meta are subject to retention — we sort by name
                  # which sorts the .db before its .meta alphabetically.
                  #
                  # The count was the literal `25` here until the operator
                  # got a control for it; it now comes from RETENTION_COUNT.
                  #
                  # awk does the guarding, in ONE expression, because this
                  # exact line is also what the etcd-cronjob reconciler repairs
                  # onto clusters that were installed before it existed — a
                  # multi-line block could not be substituted for a single
                  # pipeline stage, and fresh installs and repaired clusters
                  # must end up running identical scripts.
                  #
                  # `keep+0 >= 1` is the safety: a missing, zero or
                  # non-numeric value yields 0, the guard is false, and NOTHING
                  # is evicted. The failure mode of a bad retention value has
                  # to be "keeps too much", never "deletes the history".
                  TMP_EV=/tmp/etcd-evict
                  rclone $$CFG_FLAGS lsf ":s3:$$SHIM_BUCKET/$$SHIM_PREFIX/" 2>/dev/null \
                    | grep '\.db$$' \
                    | sort -r \
                    | awk -v keep="$${RETENTION_COUNT:-24}" 'keep+0 >= 1 && NR > keep+0' > "$$TMP_EV" || true
                  while IFS= read -r f; do
                    [ -z "$$f" ] && continue
                    echo "[etcd-shim] evict $$SHIM_PREFIX/$$f (+ .meta)"
                    rclone $$CFG_FLAGS deletefile ":s3:$$SHIM_BUCKET/$$SHIM_PREFIX/$$f" || true
                    rclone $$CFG_FLAGS deletefile ":s3:$$SHIM_BUCKET/$$SHIM_PREFIX/$$f.meta" || true
                  done < "$$TMP_EV"
                  echo "[etcd-shim] done ($$COUNT uploaded)"
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                  readOnly: true
                # Writable scratch for the script's file lists ($TMP / $TMP_EV).
                # readOnlyRootFilesystem:true makes the image's own /tmp read-only,
                # so without this the `find … > /tmp/etcd-files` redirect fails and
                # the job silently no-ops ("no snapshots <75min old") — etcd never
                # actually uploads. An emptyDir keeps the root FS locked down.
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                runAsNonRoot: false
                # k3s writes snapshot files as root; we read them.
                runAsUser: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir: {}
            - name: snapshots
              hostPath:
                path: /var/lib/rancher/k3s/server/db/snapshots
                type: Directory
