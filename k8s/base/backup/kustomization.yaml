# DR backup CronJobs. The three surviving nightly jobs (cluster-state,
# secrets-backup, backup-audit) consume the `backup-credentials`
# Secret, which is reconciled from the SYSTEM-class shim binding by
# backend/src/modules/backup-rclone-shim/dr-cronjobs.ts (the legacy
# target-activate path was retired 2026-08-26; its etcd-upload and
# pg-dump CronJobs were removed with it — their replacements are
# etcd-snap-via-shim and CNPG base backups + WAL via the barman plugin).
#
# Included in the staging + production overlays via base/kustomization.yaml
# Included wherever Longhorn + platform-api are available. Dev overlay
# omits them (DinD doesn't have a meaningful etcd and pg_dump on
# DinD backups is noise).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # R-X7: etcd snapshot upload via the universal backup-rclone-shim.
  # Suspend-default; platform-api's etcd-cronjob reconciler toggles
  # spec.suspend on/off based on the SYSTEM-class shim target binding.
  - etcd-snap-via-shim-cronjob.yaml
  - cluster-state-cronjob.yaml
  - secrets-backup-cronjob.yaml
  - backup-audit-cronjob.yaml
  # DR-bundle roadmap Phase 0 — differential secrets-audit allowlist.
  # Empty ConfigMap by default; backend reads + patches the
  # `allowlist.yaml` data key on writes from the admin UI.
  - secrets-audit-allowlist.yaml
  # DR-bundle bundle-everything redesign — shared jq denylist mounted
  # into the secrets-backup CronJob. Parity with the TS predicate +
  # the scripts/lib/secrets-denylist.jq file enforced by
  # scripts/ci-secrets-denylist-check.sh.
  - secrets-denylist-configmap.yaml
  # hostpath-snapshot-cronjob (Phase 5 retirement) had its rollback
  # burn-in — file deleted 2026-08-26 with the legacy-activate cleanup.
