apiVersion: v1
kind: ServiceAccount
metadata:
  name: firewall-reconciler
  namespace: platform-system
  labels:
    app: firewall-reconciler
    app.kubernetes.io/part-of: hosting-platform
---
# RBAC for the consolidated firewall reconciler.
#
# Peer goroutine:
#   Nodes                  read     — InternalIPs → cluster_peers_v{4,6}.
#   ClusterTrustedRange    read     — spec.cidr → trusted_ranges_v{4,6}.
#   ClusterTrustedRange    write    — status subresource (normalizedCidr,
#   /status                          family, lastSyncedAt, conditions).
#   ClusterPendingPeer     read     — spec.ip → cluster_peers_v{4,6}
#                                     (union with Node InternalIPs).
#   ClusterPendingPeer     write    — status subresource (claimedAt,
#   /status                          family, expiresAt, conditions).
#   ClusterPendingPeer     delete   — TTL cleanup + post-claim cleanup.
#
# Tenant-ports goroutine:
#   Pods                   read     — spec.containers[*].ports[*].hostPort
#                                     + platform.io/firewall-{tcp,udp}-ports
#                                     annotations → tenant_ports_{tcp,udp}.
#                                     Filtered server-side by
#                                     spec.nodeName == NODE_NAME.
#   Namespaces             read     — annotation
#                                     insula.host/tenant-namespace
#                                     classifies which Pods the tenant
#                                     reconciler considers.
#
# Traffic goroutine (namespaced Role below):
#   ConfigMaps in          create, get, — node-traffic-<NODE_NAME>, the per-node
#   platform-system        patch, update  traffic snapshot platform-api reads.
#                                      Create cannot be name-restricted, so the
#                                      Role is scoped to the namespace instead.
#
# No other writes: the CRD /status subresources, CPP delete, and that one
# ConfigMap. Host firewall state (and the count-only inet insula_traffic
# table) is mutated locally via libnftnl + CAP_NET_ADMIN, not via the
# kube-API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: firewall-reconciler
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.insula.host"]
    resources: ["clustertrustedranges", "clusterpendingpeers", "clusterfirewallblacklists"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.insula.host"]
    resources: ["clustertrustedranges/status", "clusterpendingpeers/status", "clusterfirewallblacklists/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["networking.insula.host"]
    resources: ["clusterpendingpeers"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: firewall-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: firewall-reconciler
subjects:
  - kind: ServiceAccount
    name: firewall-reconciler
    namespace: platform-system
---
# Traffic accounting: write node-traffic-<NODE_NAME> ConfigMaps (one per
# node) in platform-system. Same shape as security-probe's Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: firewall-reconciler
  namespace: platform-system
  labels:
    app: firewall-reconciler
    app.kubernetes.io/part-of: hosting-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: firewall-reconciler
  namespace: platform-system
  labels:
    app: firewall-reconciler
    app.kubernetes.io/part-of: hosting-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: firewall-reconciler
subjects:
  - kind: ServiceAccount
    name: firewall-reconciler
    namespace: platform-system
