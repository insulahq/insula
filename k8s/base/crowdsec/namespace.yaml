apiVersion: v1
kind: Namespace
metadata:
  name: crowdsec
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: waf
    # Pod Security Standards: baseline is enough — the LAPI runs as non-root
    # and needs no privileged capabilities.
    #
    # The parenthetical this comment used to carry — "(we don't run the
    # log-acquisition modules)" — was load-bearing and is no longer true of the
    # platform as a whole: the log-processing agent added 2026-09-05 DOES do
    # acquisition and needs a hostPath, which `baseline` forbids. Rather than
    # relax this namespace and take the LAPI's posture down with it, the agent
    # lives in platform-system alongside the other host-reading DaemonSets
    # (k8s/base/crowdsec-agent). Keep this at baseline.
    pod-security.kubernetes.io/enforce: baseline
