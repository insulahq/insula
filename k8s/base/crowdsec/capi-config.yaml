# Community blocklist (CAPI) switch — OFF by default, opt-in.
#
# WHY OFF BY DEFAULT
#
# CAPI is CrowdSec's shared threat feed. On production it held 16,220 decisions
# against 2 the platform had made itself: bans decided elsewhere, on evidence
# the operator cannot inspect or appeal, enforced on every hosted site. It also
# caught at least one legitimate service — MXToolbox reported HTTP 403 on every
# site on 2026-09-06 while ordinary visitors and PageSpeed were unaffected,
# which is exactly the shape of a scanner sitting in someone else's blocklist.
#
# That is a reasonable trade to make deliberately, and a bad one to inherit
# silently. So it is opt-in.
#
# HOW THE SWITCH WORKS
#
# The upstream image's /docker_start.sh does, verbatim:
#
#   if istrue "$DISABLE_ONLINE_API"; then
#       conf_set 'del(.api.server.online_client)'
#   fi
#
# Deleting online_client removes registration, signal sharing AND the community
# blocklist pull together — verified in the running image 2026-09-06.
#
# WHO CREATES IT
#
# NOT Flux. `reconcile: disabled` makes the kustomize-controller skip this
# object during apply ENTIRELY — not merely skip reverting it — so Flux
# inventories the ConfigMap and never creates it (verified on DEV 2026-09-06:
# status.inventory listed it while `kubectl get cm` returned NotFound). The
# platform-api creates it at boot with the default below, via
# ensureCommunityBlocklistDefault(). This file is the declaration of intent and
# the documentation; the backend owns the object, exactly as it does for the
# webmail feature-flag ConfigMap.
#
# WHY reconcile: disabled
#
# The admin panel writes this ConfigMap when an operator flips the toggle.
# Without the annotation Flux would revert it on the next reconcile (~1 min)
# and the setting would silently un-apply — the same failure that made a
# hand-raised file-manager memory limit impossible to keep.
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-capi-config
  namespace: crowdsec
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: waf
  annotations:
    kustomize.toolkit.fluxcd.io/reconcile: disabled
data:
  # "true" = online API disabled = NO community blocklist. Opt in by setting
  # this to "false" via Security → WAF, which also rolls the pod (Reloader).
  DISABLE_ONLINE_API: "true"
