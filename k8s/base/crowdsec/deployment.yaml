# CrowdSec local-API (LAPI) Deployment.
#
# A single-replica CrowdSec agent that hosts the Local API (LAPI) at
# :8080 and exposes the bouncer endpoint at :8080/v1/decisions. The
# Traefik bouncer plugin (loaded into the Traefik DaemonSet via
# scripts/bootstrap.sh) queries this Service on each request to check
# IP reputation.
#
# Architecture choice — LAPI-only, no log acquisition:
#   * We are NOT scraping logs from Traefik / web servers here. Log
#     parsing would require Calico-style sidecars on every pod and is
#     a much bigger commitment. Instead, we rely entirely on the
#     CrowdSec community blocklist (free tier) which already covers
#     ~6M known-bad IPs (DDoS sources, scanners, brute-forcers).
#   * The bouncer in Traefik queries this LAPI for decisions; the
#     community blocklist is pulled on a 1-hour interval by CrowdSec
#     itself (no operator action required).
#
# Persistence:
#   * SQLite DB at /var/lib/crowdsec/data/crowdsec.db backed by a 1GiB
#     PVC. Survives pod restarts so the bouncer key + cached
#     decisions don't have to be re-issued.
#   * Postgres is supported (R35) and is what the platform provisions: the
#     crowdsec-db reconciler creates the role + database in the CNPG cluster
#     and writes `crowdsec-db-credentials`, which the seed-config init
#     container renders into db_config below. Without that Secret this stays
#     on SQLite.
#     NB: there is NO DB_TYPE/DB_HOST env route — the image honours no DB_*
#     variables (verified against v1.7.8). Editing config.yaml is the only
#     mechanism; see ROADMAP R35.
#
# Single replica is correct here — CrowdSec LAPI is a single-writer
# system (the bouncer key registration + decision cache update both
# need consistent state). Operators needing HA can run the
# crowdsec-engine in a separate Deployment and point LAPI at a shared
# Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec
  namespace: crowdsec
  annotations:
    # Roll when the agent credentials appear or change. The Secret is created
    # out-of-band by host-migration 2026.9.9/0003, so it can land minutes or
    # hours after this Deployment; the env refs above are `optional: true` so
    # the LAPI starts without it, and this rolls the pod once it exists so the
    # agent actually gets registered. Without this the LAPI would start, serve
    # decisions, and never register the agent — healthy-looking and silently
    # not doing the job.
    #
    # Reloader is deployed cluster-wide (kube-system) on dev, staging and
    # production; verified on production 2026-09-05.
    # crowdsec-db-credentials covers ROTATION only — Reloader does not fire on
    # creation, so first provisioning is rolled by the crowdsec-db reconciler.
    secret.reloader.stakater.com/reload: crowdsec-agent-credentials,crowdsec-db-credentials
    # Rolls the pod when an operator toggles the community blocklist. The
    # switch is read by /docker_start.sh at STARTUP only, so without this the
    # ConfigMap would change and the running process would keep the old
    # setting — applied, not running.
    configmap.reloader.stakater.com/reload: crowdsec-capi-config
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: waf
spec:
  replicas: 1
  strategy:
    # Recreate so the SQLite file isn't opened by two pods simultaneously.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec
        app.kubernetes.io/part-of: hosting-platform
        app.kubernetes.io/component: waf
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        # WHY: without this the LAPI CRASHES ON EVERY START, every time.
        #
        # /etc/crowdsec is an emptyDir, so it is empty on every pod start and
        # the image's entrypoint rsyncs /staging/etc/crowdsec into it. Several
        # of those files are root-owned and mode 0600 inside the image
        # (local_api_credentials.yaml, online_api_credentials.yaml,
        # hub/.index.json, and every hub collection/parser/scenario), and we
        # run as uid 1000. rsync cannot read them, exits 23, and the entrypoint
        # exits with it:
        #
        #   rsync: [sender] send_files failed to open
        #     "/staging/etc/crowdsec/hub/.index.json": Permission denied (13)
        #   rsync error: some files/attrs were not transferred (code 23)
        #
        # The container then restarts, finds /etc/crowdsec non-empty (emptyDir
        # survives a container restart within the pod), skips the copy, and
        # comes up. So it "works" — via a crash loop of exactly one iteration,
        # on a PARTIAL config. Observed on every pod on DEV: RESTARTS is always
        # >= 1, which also means a genuine crash is indistinguishable from the
        # normal state.
        #
        # Two real costs beyond the noise: every LAPI recovery is one extra
        # crash-and-restart slower, and the hub index never arrives — which is
        # what the `cscli hub update` postStart hook below is compensating for.
        #
        # Running as root here is the point: it is the only way to read
        # root-owned 0600 files out of the image. It is scoped to a single
        # copy + chown into an emptyDir, drops all capabilities except the two
        # the copy needs, and the LAPI itself keeps running as uid 1000.
        - name: seed-config
          image: docker.io/crowdsecurity/crowdsec:v1.7.8
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # No shell variables or $(...) anywhere in this script, on
              # purpose: it is rendered through Flux postBuild.substituteFrom,
              # and the escaping rules for $ differ between the two forms.
              # Nothing here needs one.
              #
              # Idempotent via a marker file rather than an emptiness test:
              # config.yaml is the LAPI's own config and is always present in
              # a complete seed, so a partial copy left by an interrupted run
              # is correctly treated as "not seeded" and redone.
              if [ -f /etc/crowdsec/config.yaml ]; then
                echo "seed-config: /etc/crowdsec already seeded"
              else
                cp -a /staging/etc/crowdsec/. /etc/crowdsec/
                echo "seed-config: seeded /etc/crowdsec from the image"
              fi
              # Unconditional: a partial copy left by an older image would
              # otherwise stay unreadable to uid 1000 forever.
              # R35: point the LAPI at Postgres when, and only when, a
              # COMPLETE set of credentials is mounted. Anything less leaves
              # the image's SQLite default in place — a cluster that has not
              # been provisioned is unaffected rather than broken.
              #
              # ALL SIX KEYS ARE CHECKED, not just one. Gating on `password`
              # alone and then reading the rest unconditionally would write a
              # config with an empty dbname, delete db_path, report success and
              # leave no SQLite fallback: healthy-looking, non-functional, and
              # the LAPI is what the Traefik bouncer depends on. That is the
              # 2026-09-05 shape, documented above in this same file.
              #
              # Values are read with yq's load_str, NOT shell interpolation.
              # $(cat /db/host) would splice file content into the yq
              # expression, where a value containing a quote escapes the string
              # literal and can append arbitrary yq stages — running as uid 0
              # in this container. load_str keeps the content inside yq, never
              # passing it through a quoting layer. Verified against a hostile
              # value on DEV: `p"wd$(id)` round-trips literally.
              CS_DB_OK=1
              for f in host port username password dbname sslmode; do
                [ -s "/db/$f" ] || CS_DB_OK=0
              done
              if [ "$CS_DB_OK" = "1" ]; then
                # TMPDIR is load-bearing: `yq -i` writes a temp file and
                # renames it, and this container has readOnlyRootFilesystem,
                # so the default /tmp fails with "read-only file system" and
                # kills the init container — taking the LAPI with it.
                # Observed on DEV 2026-09-07.
                TMPDIR=/etc/crowdsec yq -i '
                  .db_config.type     = "postgresql" |
                  .db_config.host     = load_str("/db/host") |
                  .db_config.port     = (load_str("/db/port") | tonumber) |
                  .db_config.user     = load_str("/db/username") |
                  .db_config.password = load_str("/db/password") |
                  .db_config.db_name  = load_str("/db/dbname") |
                  .db_config.sslmode  = load_str("/db/sslmode") |
                  del(.db_config.db_path)
                ' /etc/crowdsec/config.yaml
                # The file now holds a database password. Never echoed.
                chmod 600 /etc/crowdsec/config.yaml
                echo "seed-config: db_config -> postgresql"
              else
                echo "seed-config: db credentials absent or incomplete — staying on sqlite"
              fi
              chown -R 1000:1000 /etc/crowdsec
              echo "seed-config: ownership set to 1000:1000"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/crowdsec
            # optional: true — a cluster without the Secret keeps SQLite.
            - name: db-credentials
              mountPath: /db
              readOnly: true
      containers:
        - name: crowdsec
          # v1.7.8 (2026-05-11) — latest stable on the v1.7.x line. Includes
          # CVE patches + LAPI metrics-endpoint improvements since v1.7.0.
          image: docker.io/crowdsecurity/crowdsec:v1.7.8
          imagePullPolicy: IfNotPresent
          # DISABLE_ONLINE_API comes from the crowdsec-capi-config ConfigMap
          # (community blocklist opt-in). `optional: true` is deliberate and
          # load-bearing: on a cluster upgrading from a release without that
          # ConfigMap the LAPI must still start. A hard reference here is
          # precisely what took every hosted site to 403 on 2026-09-05.
          envFrom:
            - configMapRef:
                name: crowdsec-capi-config
                optional: true
          env:
            # SQLite WAL. The image honours USE_WAL:
            #   if istrue "$USE_WAL"; then conf_set '.db_config.use_wal = true'
            # and without it the config ships `use_wal: false`, which CrowdSec
            # itself warns about while inserting the community blocklist:
            #
            #   "sqlite is not using WAL mode, LAPI might become unresponsive
            #    when inserting the community blocklist"
            #
            # A community pull inserts 15,000 rows in one transaction (measured
            # on DEV 2026-09-07). In rollback-journal mode readers block for the
            # duration — and every Traefik bouncer on every node is a reader of
            # this LAPI, so a stall here is a stall in the ingress decision path.
            # WAL lets readers proceed while the write commits.
            #
            # Storage is SQLite by design (see the header); this makes that
            # choice behave properly rather than replacing it.
            - name: USE_WAL
              value: "true"
            - name: DISABLE_AGENT
              # No log acquisition in THIS pod — the crowdsec-agent
              # DaemonSet does the parsing. Skipping the loop here keeps the
              # container at ~30MB instead of ~150MB.
              #
              # (This comment used to say "we rely on the community blocklist".
              # That is no longer true by default: CAPI is opt-in, see
              # capi-config.yaml.)
              value: "true"
            - name: LOCAL_API_URL
              value: "http://127.0.0.1:8080"
            # Registers the log-processing agent's machine. The LAPI entrypoint
            # runs `cscli machines add "$AGENT_USERNAME" --password ... --force`
            # whenever both are set, guarded only by DISABLE_LOCAL_API — so it
            # runs here despite DISABLE_AGENT=true above (verified against the
            # image's /docker_start.sh, 2026-09-05).
            #
            # Without this the LAPI knows only `localhost`, and the agent
            # DaemonSet authenticates as a machine that was never created. The
            # agent stays up and reports healthy; its alerts simply never
            # arrive. Same Secret, same values as the agent — the names must
            # match EXACTLY.
            #
            # BOTH ARE `optional: true`, AND THAT IS LOAD-BEARING.
            #
            # This Secret is created by host-migration 2026.9.9/0003, which runs
            # on the platform-ops converger's own timer — NOT in step with the
            # Flux apply that ships this Deployment. Without `optional` the
            # kubelet refuses to create the container
            # (`CreateContainerConfigError: secret ... not found`), the LAPI
            # never starts, and the Traefik CrowdSec bouncer FAILS CLOSED —
            # every request to every hosted site returns 403.
            #
            # That is exactly what happened on production upgrading to 2026.9.9
            # (2026-09-05): total ingress outage caused by a missing credential
            # for a feature that only pre-registers an agent. Nothing on the
            # request path needs these values.
            #
            # Unset, the image's entrypoint simply skips `cscli machines add`
            # (it is guarded by `[ "$AGENT_USERNAME" != "" ]`). The LAPI serves
            # decisions exactly as before; only agent registration waits. The
            # reloader annotation on this Deployment rolls it once the Secret
            # appears, so the wait is self-healing.
            - name: AGENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crowdsec-agent-credentials
                  key: username
                  optional: true
            - name: AGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crowdsec-agent-credentials
                  key: password
                  optional: true
            - name: BOUNCER_KEY_traefik
              # The bouncer key is mounted from a Secret + referenced
              # by env so CrowdSec auto-registers the bouncer on
              # startup. Same key value lives in the Traefik plugin
              # config (Middleware spec.plugin.crowdsec.crowdsecLapiKey)
              # — see bootstrap.sh generate_crowdsec_bouncer_key().
              # Secret data key is `bouncer-key` (NOT `traefik-bouncer-
              # key`) so the file projection in the Traefik pod at
              # /var/run/secrets/crowdsec/bouncer-key matches the
              # Middleware's crowdsecLapiKeyFile path.
              valueFrom:
                secretKeyRef:
                  name: crowdsec-bouncer-key
                  key: bouncer-key
          ports:
            - name: lapi
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: lapi
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: lapi
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
          lifecycle:
            postStart:
              # `cscli capi status` requires /etc/crowdsec/hub/.index.json
              # which is downloaded by `cscli hub update`. The config
              # volume is emptyDir (pod-restart-ephemeral), so without
              # this hook every fresh pod reports CAPI as failed even
              # though credentials are valid + community blocklist is
              # enabled. Bug observed 2026-05-20 — the platform-api
              # status panel showed "Community blocklist: disabled
              # (CAPI auth failed)" until an operator manually ran
              # `cscli hub update`.
              #
              # Retry in-shell because LAPI may not be Ready when the
              # postStart hook fires; the 3-attempt loop covers the
              # typical 1-5s startup window. Failure is non-fatal —
              # the container still starts (LAPI itself doesn't need
              # the hub index).
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in 1 2 3; do
                      cscli hub update && break
                      sleep 2
                    done
          volumeMounts:
            - name: data
              mountPath: /var/lib/crowdsec/data
            - name: config
              mountPath: /etc/crowdsec
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: crowdsec-data
        - name: config
          emptyDir: {}
        # R35 Postgres credentials, written by the crowdsec-db reconciler.
        # optional: true is load-bearing: the LAPI must still start on a
        # cluster that has never been provisioned, and the bouncer fails
        # closed on a LAPI that will not start.
        - name: db-credentials
          secret:
            secretName: crowdsec-db-credentials
            optional: true
            defaultMode: 0400
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-data
  namespace: crowdsec
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: waf
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
# PodDisruptionBudget — explicit minAvailable=0 (Recreate strategy +
# SQLite single-writer means the pod will go down during node drains
# regardless). Documents intent: operators upgrading to multi-replica
# (Postgres backend) can flip this to minAvailable: 1.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: crowdsec
  namespace: crowdsec
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: waf
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec
  namespace: crowdsec
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: waf
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crowdsec
  ports:
    - name: lapi
      port: 8080
      targetPort: lapi
      protocol: TCP
