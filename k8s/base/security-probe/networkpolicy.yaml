# NetworkPolicy locking down egress from the security-probe pods.
# The probe needs the Kubernetes apiserver (typically :443 or :6443
# depending on cluster) plus CoreDNS for in-cluster DNS resolution used
# by client-go — and, for the outbound mail check (outboundmail.go),
# TCP 25/465/587 to public mail servers: it only opens a connection and
# closes it, nothing is sent. Anything else is a data-exfiltration vector
# if the probe binary is ever compromised.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: security-probe
  namespace: platform-system
  labels:
    app: security-probe
    app.kubernetes.io/part-of: hosting-platform
spec:
  podSelector:
    matchLabels:
      app: security-probe
  policyTypes: [Egress]
  egress:
    # CoreDNS — client-go resolves apiserver Service VIP via in-cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Apiserver: in k3s this is the Service VIP (10.43.0.1) on
    # :443. Use a port-only egress rule — Calico's policy engine will
    # match the destination IP via the ServiceVIP routing.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Outbound mail check: does this node's provider let mail ports out?
    # Any address — the targets are public mail servers resolved by name.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 465
        - protocol: TCP
          port: 587
