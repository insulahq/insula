# Allow the kube-apiserver to reach the solver webhook.
#
# The aggregator runs in the host network, so the source address is a
# NODE ip, not a pod ip — none of the podSelector/namespaceSelector
# forms in `allow-ingress-to-platform` can match it, and node addresses
# are not knowable at manifest-render time (they change as the cluster
# grows, and this file cannot read platform-cluster-cidrs).
#
# So this opens exactly one port to any source, and the authentication
# is done on the connection itself: the listener requires a client
# certificate signed by the cluster's requestheader CA and then checks
# the aggregator-asserted user against an allowlist. Reaching the port
# without an aggregator-issued client certificate gets a TLS handshake
# failure, not a request.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-to-acme-webhook
  namespace: platform
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: acme-webhook
spec:
  podSelector:
    matchLabels:
      app: platform-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8443
