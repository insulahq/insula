# Service the API aggregator dials for the DNS-01 solver.
#
# Backed by the platform-api pods themselves (port 8443, a second TLS
# listener started by backend/src/modules/acme-dns01). One image, one
# Deployment, one set of DNS credentials — a separate webhook Deployment
# would need its own copy of the provider config to do the same job.
apiVersion: v1
kind: Service
metadata:
  name: platform-acme-webhook
  namespace: platform
  labels:
    app.kubernetes.io/part-of: hosting-platform
    app.kubernetes.io/component: acme-webhook
spec:
  type: ClusterIP
  selector:
    app: platform-api
  ports:
    - name: https
      port: 443
      targetPort: acme-webhook
      protocol: TCP
