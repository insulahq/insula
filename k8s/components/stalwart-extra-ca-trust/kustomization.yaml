apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Lets Stalwart trust an extra CA (a private/test ACME CA such as Pebble) on top
# of the image's bundled roots.
#
# Why this needs a whole component rather than a one-line mount:
#
# Stalwart's ACME client reads the SYSTEM trust store — proven by
#   masking /etc/ssl/certs, which flipped the failure from a Let's Encrypt
#   application response ("Rate limited") to a transport error ("error sending
#   request"), and back again on restore.
#
#   But it does NOT read /etc/ssl/certs/ca-certificates.crt on its own. Replacing
#   just that file — a subPath mount, the obvious approach — is a silent no-op:
#   verified with a 1-root decoy bundle and the hashed *.0 entries left intact,
#   where ACME still reached Let's Encrypt. The hashed directory has to carry the
#   CA too, which means rebuilding the directory and re-running `openssl rehash`.
#
#   SSL_CERT_FILE / SSL_CERT_DIR are not an escape hatch either: both are absent
#   from the binary (0 occurrences), so the env-var override does nothing.
#
# INERT BY DEFAULT. The Secret is `optional: true`, so with no Secret present the
# initContainer reproduces the image's trust store byte-for-byte and the running
# container sees exactly what it saw before. That is what makes it safe to carry
# in an overlay that also serves clusters which must keep using public LE — the
# production overlay carries it, so any production-mode install (a private or
# air-gapped CA, the local lab's staging) can give Stalwart its root with
# `bootstrap.sh --trust-ca`.
#
# Trust only. A private ACME directory on a port other than 443/80 also needs an
# egress rule — that is the stalwart-extra-ca component (this one + Pebble's 14000).
#
# To activate: create Secret `stalwart-extra-ca` in namespace `mail` with one or
# more PEM keys, e.g.
#   kubectl -n mail create secret generic stalwart-extra-ca \
#     --from-file=pebble-root.crt=/tmp/pebble-root.crt
# and set `stalwart-acme-directory` in the platform-config ConfigMap (consumed by
# stalwart-domain-reconciler) and/or STALWART_ACME_DIRECTORY at bootstrap.

patches:
  - path: extra-ca-patch.yaml
    target:
      kind: Deployment
      name: stalwart-mail
