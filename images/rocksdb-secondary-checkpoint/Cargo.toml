[package]
name = "rocksdb-secondary-checkpoint"
version = "0.1.0"
edition = "2021"
publish = false
description = "Open a RocksDB primary as secondary (no LOCK conflict) and create a hard-linked checkpoint. Used by the Stalwart mail-archive Job."

[[bin]]
name = "rocksdb-secondary-checkpoint"
path = "src/main.rs"

[dependencies]
# ⚠ THIS PIN IS COUPLED TO STALWART'S. DO NOT BUMP IT ON ITS OWN.
#
# This binary opens Stalwart's LIVE RocksDB store as a secondary instance. The
# two processes read the same MANIFEST and SST files, so they must agree on the
# on-disk format — a mismatch risks MANIFEST/SST read failures against the
# production mail database, and the failure mode is at archive time, on real
# data, not at build time.
#
# The pin is therefore whatever `librocksdb-sys` STALWART resolves, not whatever
# is newest. Verified against Stalwart v0.16.16 → librocksdb-sys 0.17.3+10.4.2
# (C++ rocksdb 10.4.2, via rust rocksdb 0.24.0). v0.16.5 resolved the same.
#
# Enforced, not just documented: scripts/ci-rocksdb-stalwart-pin-check.sh fails
# CI when the Stalwart pin moves without this pin being re-verified against it.
# The comment above this line said "Stalwart 0.16.5" while Stalwart had already
# moved to v0.16.16 — a comment cannot hold an invariant, which is why the guard
# exists. To re-verify after a Stalwart bump:
#   ./scripts/ci-rocksdb-stalwart-pin-check.sh --online
librocksdb-sys = "=0.17.3"

# c_char support for FFI string handling.
libc = "0.2"

[profile.release]
# This binary runs once per archive Job, exits in ~20 ms total. There
# is no measurable benefit to fat-LTO + single-codegen-unit + opt=3
# tuning here — the time saved at runtime is microseconds while the
# build cost is 8+ minutes per CI cycle. Optimise for build speed.
strip = true
lto = "thin"        # ~3× faster compile than "fat", ~5% larger binary
codegen-units = 16  # default — parallel codegen
opt-level = 3       # keep -O3; cheap in time terms relative to LTO
panic = "abort"
