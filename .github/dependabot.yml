# Dependabot — proposes dependency-bump PRs (security + version updates).
#
# Complements, does not replace, the component watch (ADR-050): the registry
# (security/components.yaml) + ledger (security/cve-ledger.yaml) remain the
# source of truth for tiering and CVE waivers; Dependabot is the automation
# that opens the actual bump PRs for application dependencies. Security updates
# are always on; version updates are grouped weekly to keep PR noise low.
version: 2

updates:
  # target-branch: development on EVERY ecosystem — NOT the repo default.
  #
  # The default branch is `main`, but under ADR-053 `main` only ever receives
  # `chore(promote)` tree-snapshots of `development` plus `chore(release)`
  # commits. A dependency bump merged straight into `main` is therefore
  # REVERTED by the next promote, silently. Bumps must land on `development`
  # like all other code and reach `main` through the normal promote.
  # (Observed 2026-07-29: PR #176 had been sitting open against `main`.)
  # ── npm (single root workspace: backend, both panels, packages/*) ──
  - package-ecosystem: npm
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the new native compiler) is deferred 2026-07-24:
      # typescript-eslint 8.65 (latest) caps its TS peer below 7, so
      # adopting it forces a split install — TS 6 at root for the linter,
      # TS 7 nested per workspace for builds — meaning lint would parse
      # with a different compiler than the one compiling. Drop this
      # ignore once typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    # Minimum release age before a version bump is proposed (2026-08-06).
    #
    # Every package in the 2026-08 keyv/@adminide-stack compromise was attacked
    # by PUBLISHING A NEW VERSION — which is exactly what Dependabot chases. An
    # unaged bot bumps you onto a malicious release within hours of publication,
    # before the ecosystem has noticed. A week of soak turns Dependabot from an
    # amplifier of that attack into a filter against it.
    #
    # This delays VERSION updates only. Dependabot SECURITY updates (advisory
    # driven) are not gated by cooldown, so a real CVE fix still arrives at once.
    # Majors wait longer: they are the least urgent and the most disruptive.
    cooldown:
      default-days: 7
      semver-major-days: 14
    labels: ["dependencies", "security-watch"]

