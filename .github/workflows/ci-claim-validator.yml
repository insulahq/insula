name: Claim-Validator Sidecar CI

on:
  push:
    branches: [development]
    paths:
      - 'images/claim-validator/**'
      - '.github/workflows/ci-claim-validator.yml'
  pull_request:
    branches: [development, main]
    paths:
      - 'images/claim-validator/**'
      - '.github/workflows/ci-claim-validator.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/claim-validator

jobs:
  build:
    name: Build + Test + Push
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Run unit tests
        working-directory: images/claim-validator
        run: node --test server.test.mjs

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/development' }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: images/claim-validator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Upload Trivy scan results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results.sarif
          category: claim-validator

  # Pin the freshly-pushed image into the development overlay's platform-config,
  # AFTER the push, from the image's OWN workflow — pinning from a different
  # workflow is what caused the 2026-06-06 pull race. The backend resolves this
  # image at RUNTIME from an env var, so it is invisible to the kustomization
  # `images:` transformer; see .github/scripts/pin-config-image.sh.
  #
  # Tag label is the 7-char git sha (exactly what `type=sha,prefix=` pushes)
  # rather than a re-derived timestamp: `{{date}}` is evaluated inside
  # metadata-action, so recomputing it here would name a tag that was never
  # pushed. The digest is authoritative regardless; the tag is a readable label.
  pin-config:
    name: Pin digest into the development overlay
    needs: build
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pin-development-config
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          .github/scripts/pin-config-image.sh claim-validator-image \
            "${IMAGE}:${GITHUB_SHA:0:7}@${DIGEST}"
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
