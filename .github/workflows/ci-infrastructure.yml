name: Infrastructure CI

on:
  push:
    branches: [development]
    paths:
      - 'k8s/**'
      - 'scripts/**'
      - 'security/**'
      # file-manager-auth-guard inspects backend source, so an edit that
      # touches ONLY the backend must still trigger this workflow — otherwise
      # the guard silently skips exactly the change it exists to catch.
      - 'backend/src/modules/file-manager/**'
      - 'backend/src/modules/ingress-routes/**'
      - 'backend/src/modules/system-settings/**'
      # frontend-api-types-guard reads the panels' hooks; without this it would
      # never run on the files it checks (the #391 lesson).
      - 'frontend/*/src/hooks/**'
      # notification-template-coverage-guard reads the seed + template data.
      # Without this path the guard never fires on the module it protects: the
      # (category x channel) matrix was edited across four PRs and the guard
      # sat out every one of them, then failed on the release promote.
      - 'backend/src/modules/notifications/**'
      - 'images/file-manager/**'
      # A change to this workflow must be exercised BY this workflow.
      # Without it a broken (or, as here, a hanging) job could be edited and
      # merged without the fix ever running.
      - '.github/workflows/ci-infrastructure.yml'
  pull_request:
    branches: [development, main]
    paths:
      - 'k8s/**'
      - 'scripts/**'
      - 'security/**'
      - 'backend/src/modules/file-manager/**'
      - 'backend/src/modules/ingress-routes/**'
      - 'backend/src/modules/system-settings/**'
      # frontend-api-types-guard reads the panels' hooks; without this it would
      # never run on the files it checks (the #391 lesson).
      - 'frontend/*/src/hooks/**'
      # notification-template-coverage-guard reads the seed + template data.
      # Without this path the guard never fires on the module it protects: the
      # (category x channel) matrix was edited across four PRs and the guard
      # sat out every one of them, then failed on the release promote.
      - 'backend/src/modules/notifications/**'
      - 'images/file-manager/**'
      - '.github/workflows/ci-infrastructure.yml'

# Least privilege (2026-07-28 security review): these workflows only read the
# repo, so drop the token to read-only instead of inheriting the repository
# default (which may be read-write). Any job needing more must opt in with its
# own job-level `permissions:`.
permissions:
  contents: read

jobs:
  kustomize-build:
    name: Kustomize Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          echo "Building base..."
          kubectl kustomize k8s/base
          echo "Building dev overlay..."
          kubectl kustomize k8s/overlays/dind
          echo "Building development overlay..."
          kubectl kustomize k8s/overlays/development
          echo "Building production overlay..."
          kubectl kustomize k8s/overlays/production

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          # shellcheck is pre-installed on ubuntu-latest runners. The
          # previous `sudo apt-get install -y` step intermittently failed
          # on repo mirror hash mismatches — skip it unless the tool is
          # genuinely missing (and update the lists first if it is).
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          # --severity=error fails CI only on SC1xxx parse errors
          # (genuine bugs that prevent the script from running). SC2xxx
          # warnings (SC2034 unused vars, SC2155 declare-and-assign,
          # SC2087 heredoc-quoting, etc.) are reported as advisory by
          # shellcheck locally but don't fail the job.
          #
          # Note: a prior version of this comment said "--severity=warning
          # skips info-level findings". That was wrong — shellcheck's
          # --severity is a minimum threshold, so --severity=warning
          # reports warnings AND errors. Use --severity=error to gate
          # only on parse-level errors.
          shellcheck --severity=error scripts/*.sh

  # Self-contained shell test harnesses — regression guards for the logic in
  # scripts/ (image-org fork-safety, release cutting). No DinD / root needed.
  shell-unit-tests:
    name: Shell unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/test-image-org.sh
      - run: ./scripts/test-cut-release.sh
      - run: ./scripts/test-sync-development-changelog.sh
      - run: ./scripts/test-ci-no-cluster-push.sh
      - run: ./scripts/test-platform-ops-install.sh
      - run: ./scripts/test-bootstrap-summary.sh
      - run: ./scripts/test-longhorn-reservation.sh
      - run: ./scripts/test-ci-migration-coverage.sh
      - run: ./scripts/test-vmtier-profile-isolation.sh
      - run: ./scripts/ci-platform-migration-rbac.sh
      - run: ./scripts/test-ci-integration-coverage.sh
      - run: ./scripts/test-new-host-migration.sh
      - run: ./scripts/test-cut-release-audit.sh
      - run: ./scripts/test-bootstrap-helm-retry.sh
      - run: ./scripts/test-ui.sh
      - run: ./scripts/test-bootstrap-quiet-wrappers.sh
      - run: ./scripts/test-traefik-plugin-guard.sh
      - run: ./scripts/test-waf-audit-redaction.sh
      - run: ./scripts/test-log-gate.sh
      - run: ./scripts/test-vmtest-log-gate-wiring.sh
      - run: ./.github/scripts/test-pin-image-tag.sh
      - run: ./.github/scripts/test-component-watch-gate.sh
      - run: ./.github/scripts/test-pin-config-image.sh
      # Guards the DEV cluster against a slow build pinning its older images
      # over a newer pin — see pin-would-regress.sh for the incident.
      - run: ./.github/scripts/test-pin-would-regress.sh
      # Runs in a container with NET_ADMIN so the nft operations (and the
      # `flush ruleset` in its fixtures) are isolated from the runner's own
      # networking. Proves the firewall-blacklist host-migration is surgical
      # (the marker-canary table must survive) + idempotent.
      - name: host-migration firewall-blacklist (nftables, containerised)
        run: |
          docker run --rm --cap-add=NET_ADMIN -v "$PWD":/src -w /src debian:trixie-slim \
            sh -c 'apt-get update -qq && apt-get install -y -qq nftables >/dev/null && bash scripts/test-host-migration-blacklist-nft.sh'

  # platform-ops SEA build (Holistic plan W17): prove the binary build pipeline
  # stays green on every PR — bundles the backend graph, the binary runs, and a
  # real cosign sign→verify→install roundtrip succeeds through the bootstrap code.
  platform-ops-binary:
    name: platform-ops binary build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: ./scripts/test-build-platform-ops.sh
        env:
          PLATFORM_OPS_COSIGN_BIN: cosign

  # No-push-to-cluster guard (Holistic plan W7): CI builds images + commits git
  # pins — it never mutates a live cluster (pull model).
  no-cluster-push:
    name: No push-to-cluster guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/ci-no-cluster-push.sh

  admin-auth-gate-check:
    name: Admin-auth gate guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install yq
        run: |
          # mikefarah/yq v4 — exact syntax used in scripts/ci-admin-auth-check.sh.
          # Ubuntu's apt yq is Python-based and incompatible.
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Verify admin-only Ingresses have an auth gate
        run: ./scripts/ci-admin-auth-check.sh

  oauth2-proxy-args-check:
    name: OAuth2-Proxy args complete in every overlay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify every oauth2-proxy args list carries the two-panel flags
        run: ./scripts/ci-oauth2-proxy-args-check.sh

  dex-client-secret-check:
    name: Dex staticClient secrets resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "Verify no Dex staticClient uses an unexpanded secret placeholder"
        run: ./scripts/ci-dex-client-secret-check.sh

  crowdsec-lapi-startup-check:
    name: CrowdSec LAPI can start without out-of-band Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "Verify no secretKeyRef can block the LAPI from starting"
        run: ./scripts/ci-crowdsec-lapi-startup-check.sh

  firewall-check:
    name: Firewall-rule guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify bootstrap.sh firewall rules
        run: ./scripts/ci-firewall-check.sh

  mail-image-pin-check:
    name: Mail image pins agree (Stalwart + stalwart-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify Stalwart and stalwart-cli pins are consistent
        run: ./scripts/ci-mail-image-pin-check.sh

  migration-coverage-guard:
    name: Migration coverage (install-time host shape → host-migration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the guard can diff the PR against origin/main to
          # detect an added host-migration / refreshed baseline / waiver.
          fetch-depth: 0
      - name: Ensure base ref is available
        run: git fetch origin main --depth=200 || true
      - name: Verify an install-time host-shape change ships a host-migration
        run: ./scripts/ci-migration-coverage.sh

  integration-test-coverage:
    name: Integration-test registry coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify every integration-*.sh is registered (no orphans)
        run: ./scripts/ci-integration-coverage.sh

  nginx-real-ip-check:
    name: Nginx real_ip template guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify admin/tenant panel nginx.conf.template has real_ip directives
        run: ./scripts/ci-nginx-real-ip-check.sh

  service-etp-check:
    name: Traefik Service externalTrafficPolicy guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify externalTrafficPolicy is set with externalIPs, and never at helm-install time
        run: ./scripts/ci-service-etp-check.sh

  tls-wildcard-guard:
    name: Wildcard TLS + DNS-01 solver guardrail (ADR-058)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify wildcard routing, solver registration and failure visibility
        run: ./scripts/ci-tls-wildcard-check.sh

  system-tenant-guard:
    name: SYSTEM tenant protection guardrail (ADR-040)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify SYSTEM tenant scheduler filters + DB invariants
        run: ./scripts/ci-system-tenant-check.sh

  custom-deployment-dispatch-guard:
    name: Generic deployment lifecycle dispatches on source (ADR-036)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify no lifecycle verb silently skips custom deployments
        run: ./scripts/ci-custom-deployment-dispatch-check.sh

  dns-records-invalidation-guard:
    name: DNS-writing mutations invalidate the dns-records query
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify panel mutations refresh the DNS Records list
        run: ./scripts/ci-dns-records-invalidation-check.sh

  internal-route-ratelimit-guard:
    name: /internal routes declare a rate limit and an auth gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify /internal/* rate-limit opt-outs are gated
        run: ./scripts/ci-internal-route-ratelimit-check.sh

  tenant-scope-guard:
    name: Tenant-scoped routes enforce tenant ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify every /tenants/:tenantId/ route is scoped to the caller's tenant
        run: ./scripts/ci-tenant-scope-check.sh

  waf-body-limit-guard:
    name: WAF is never attached without its request-body cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify every modsecurity-crs attachment chains waf-body-limit first
        run: ./scripts/ci-waf-body-limit-check.sh

  file-manager-auth-guard:
    name: Direct file-manager calls carry the sidecar auth header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify every direct-ClusterIP sidecar request sends X-Platform-Internal
        run: ./scripts/ci-file-manager-auth-check.sh

  file-manager-bulk-guard:
    name: Multi-select file actions send one request, not one per path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify no client-side per-path loop over a selection
        run: ./scripts/ci-file-manager-bulk-check.sh

  dex-redirect-uri-guard:
    name: Dex clients redirect to their own panel host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify each Dex static client's redirect URI matches its panel
        run: ./scripts/ci-dex-redirect-uri-check.sh
  frontend-api-types-guard:
    name: No new hand-written API request types in frontend hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify the api-contracts ratchet has not regressed
        run: ./scripts/ci-frontend-api-types-check.sh

  platform-netpol-reachability-guard:
    name: Every routed platform Service is reachable through the NetworkPolicy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Verify no routed Service is blocked by default-deny-ingress
        run: ./scripts/ci-platform-netpol-reachability-check.py

  notification-template-coverage-guard:
    name: Every notification channel ships templates for every category
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The guard imports the seed data through node's type-stripping
      # loader (--experimental-strip-types), which needs Node 22.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify the full (category × channel) template matrix
        run: ./scripts/ci-notification-template-coverage.sh

  oom-classification-guard:
    name: Container OOM is classified through one shared helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify no module compares against the OOMKilled literal itself
        run: ./scripts/ci-oom-classification-check.sh

  namespace-classification-guard:
    name: Tenant-vs-platform namespace classification is single-sourced
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify no module classifies namespaces on its own
        run: ./scripts/ci-namespace-classification-check.sh

  required-env-wired-guard:
    name: Every env var the backend hard-fails without is wired for real clusters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify no required env var is unset or dind-only
        run: ./scripts/ci-required-env-wired-check.sh

  waf-scope-coverage-guard:
    name: Every WAF exclusion scope is selectable in both panels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify no contract scope is unreachable from the UI
        run: ./scripts/ci-waf-scope-coverage-check.sh

  waf-admin-carveout-guard:
    name: The WAF-management API is not behind the WAF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify the carve-out exists and is tracked by drift detection
        run: ./scripts/ci-waf-admin-carveout-check.sh

  # 2026-07-28: both guards existed but were never wired into any workflow, so
  # they never ran. ci-node-terminal-check had in fact been FAILING on
  # `development` — its Pino-redact assertion stopped matching when a `jwt`
  # alternative was added to the redact regex, and nothing surfaced it.
  # A guard that nothing executes protects nothing.
  node-terminal-guard:
    name: Node-terminal security invariants (ADR-041)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify node-terminal auth, ws-token and log-redaction invariants
        run: ./scripts/ci-node-terminal-check.sh

  secrets-denylist-guard:
    name: Secrets denylist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify no denylisted secret material is committed
        run: ./scripts/ci-secrets-denylist-check.sh

  platform-apex-conflation-guard:
    name: Platform apex / ingress-domain conflation (R16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify platform subdomains derive from the apex, not ingress_base_domain
        run: ./scripts/ci-platform-apex-conflation.sh

  platform-migration-guard:
    name: Platform-migration registry discipline (ADR-045 W9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify migration registry consistency + idempotency discipline
        run: ./scripts/ci-migration-idempotency.sh

  version-poller-guard:
    name: Version-poller invariants (ADR-045 W11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify cosign-signed manifest + baked key + hourly CronJob + no cosign binary
        run: ./scripts/ci-version-poller-check.sh

  host-config-guard:
    name: Host-config host-side model (ADR-045 W10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify no privileged enforcer pod + observe stays locked + deny-list
        run: ./scripts/ci-host-config-check.sh

  host-migrations-guard:
    name: Host-migration runner + catalog discipline (ADR-045 W10c)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shellcheck
        # Same guard as the shellcheck job above: the tool is pre-installed on
        # ubuntu-latest, and the unconditional `apt-get` here HUNG for 29 min
        # (then 15+ min on a re-run) on the v2026.8.6 promote PR while the
        # identical tree passed this job in 1m31s elsewhere. Only install when
        # it is genuinely missing, and bound it so a wedged mirror fails fast
        # instead of holding a runner for hours.
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            timeout 300 sudo apt-get update
            timeout 300 sudo apt-get install -y shellcheck
          fi
          shellcheck --version
      - name: Verify runner validation + embedding + per-script authoring contract
        run: ./scripts/ci-host-migrations-check.sh
      - name: Verify kubelet graceful node shutdown stays wired (bootstrap ≡ host-migration)
        run: ./scripts/ci-graceful-shutdown-check.sh
      - name: Verify no converger tests kubectl JSON by grepping "key":"value"
        run: ./scripts/ci-no-json-text-grep.sh

  platform-ops-embed-guard:
    name: platform-ops embed-and-launch manifest ≡ dispatch ≡ scripts (ADR-045 R18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify embedded-scripts manifest matches CLI dispatch + build derives from it
        run: ./scripts/ci-platform-ops-embed-check.sh

  system-upgrade-guard:
    name: system-upgrade-controller integration (ADR-045 W12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify no committed Plan + pinned+hardened SUC + skip-a-minor refusal
        run: ./scripts/ci-system-upgrade-check.sh
      - name: Verify ADR-053 GitOps structure (Flux sources / build-deploy / sync-development / cut-release)
        run: ./scripts/ci-gitops-structure-check.sh

  upgrade-repin-guard:
    name: Platform upgrade re-pin invariants (ADR-045 W13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify dry-run-default + resolved-source + clean-tag + decision gates
        run: ./scripts/ci-upgrade-repin-check.sh
      - name: Verify the BREAKING auto-upgrade gate is wired end-to-end
        run: ./scripts/ci-breaking-release-gate-check.sh

  no-dex-in-production:
    name: Dex must not ship in production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Verify production overlay does not deploy Dex
        run: ./scripts/ci-no-dex-in-production.sh
      - name: Verify platform_session spans subdomains (Stalwart web-admin gate)
        run: ./scripts/ci-session-cookie-domain-check.sh

  no-pinned-domains:
    name: No hard-coded apex domains in K8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan k8s/ for pinned apex literals
        run: ./scripts/ci-no-pinned-domains.sh

  no-hardcoded-ips:
    name: No hard-coded public IPs in K8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan k8s/ for literal IPv4 addresses
        # 2026-05-16: testing.example.test re-bootstrap revealed an
        # IP literal hardcoded inside an inline kustomize patch for the
        # mail Service externalIPs. Per-cluster IPs MUST come from the
        # platform-cluster-config ConfigMap and be resolved by Flux
        # postBuild substituteFrom. This guard fails the build on a
        # regression. See scripts/ci-no-hardcoded-ips.sh header.
        run: ./scripts/ci-no-hardcoded-ips.sh

  no-hardcoded-test-infra:
    name: No operator IPs/domains in committed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan the repo for operator domains and node IPs
        # Repo-wide: no committed file may bake one operator's cluster (apex
        # domain anywhere; node-netblock IPs anywhere; any public IP under
        # scripts/). Real values come from the gitignored scripts/integration.env
        # profile (scripts/lib/integration-env.sh). Companion to the two k8s/-only
        # guards above. See docs/development/INTEGRATION_TESTS.md.
        run: ./scripts/ci-no-hardcoded-test-infra.sh

      - name: Image purge must verify removal
        # `crictl rmi` answering "no such image" is ambiguous — it means both
        # "already gone" and "this ref does not resolve", and treating it as
        # success reported reaps that never happened (with a byte count copied
        # from kubelet's node status). Runs the real embedded script against a
        # stub crictl.
        run: ./scripts/test-image-purge-verify.sh

      - name: Wipe must log out Longhorn's iSCSI sessions (and only those)
        # k3s-uninstall.sh knows nothing about Longhorn and the CSI plugin's
        # NodeUnstageVolume never runs when the cluster is torn down underneath
        # it, so kernel iSCSI sessions used to survive both the wipe and the
        # re-bootstrap (the host is not rebooted) and retry login ~1/s forever.
        # Also pins the scoping: an operator's external SAN session must not be
        # torn down by an unfiltered logout. Runs the real embedded block
        # against a stub iscsiadm.
        run: ./scripts/test-destroy-iscsi-sweep.sh

      - name: Harness defaults must derive the test apex
        # PORTABILITY (distinct from the secrecy guard above): a harness default
        # may not bake in an apex, even the sanitised placeholder. A suite that
        # hardcodes one only passes on that cluster — a run against a fresh
        # cluster failed with "expected mail.staging.example.test" while mail was
        # healthy. Derive via resolve_platform_apex() instead.
        run: ./scripts/ci-no-hardcoded-test-apex.sh

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install gitleaks (latest stable)
        # The version lookup MUST authenticate. Unauthenticated api.github.com
        # calls share a 60/hr budget per RUNNER IP — shared across every tenant
        # of that IP — and a 403 here failed the whole Infrastructure CI run on
        # a merge to development (2026-08-21, run 32462915013). GITHUB_TOKEN
        # raises that to 5000/hr scoped to this repo.
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          ver=$(curl -fsSL -H "Authorization: Bearer ${GH_API_TOKEN}" \
                  https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                  | grep -oE '"tag_name": *"v[^"]+"' | head -1 | sed -E 's/.*"v([^"]+)".*/\1/')
          [ -n "$ver" ] || { echo "could not resolve gitleaks version"; exit 1; }
          echo "gitleaks v$ver"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan working tree for secrets
        # --no-git scans the current file contents (what merges to main), not
        # historical commits — so already-rotated leaks in history don't block
        # the build while new secrets are still caught.
        run: gitleaks detect --no-git --source . --redact -c .gitleaks.toml -v

  k8s-patch-check:
    name: K8s client patchNamespaced* Content-Type guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify every patch call has an explicit middleware shim
        run: ./scripts/ci-k8s-patch-check.sh

  job-ttl-check:
    name: Job ttlSecondsAfterFinished guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify every Job spec declares ttlSecondsAfterFinished
        # Completed Jobs (and their Pods) stay forever without
        # ttlSecondsAfterFinished, accumulating etcd objects and Pod
        # log inodes. The job-gc CronJob is a defensive backup for
        # Jobs from sources we don't control (Longhorn, operators);
        # this guard ensures everything we *do* control self-expires.
        run: ./scripts/ci-job-ttl-check.sh

  flux-escape-check:
    name: Flux postBuild ${VAR} escape guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify CronJob/Job inline shell escapes ${VAR} as $${VAR}
        # Flux postBuild.substituteFrom expands every ${VAR} against
        # platform-cluster-config before kubectl apply. Bash locals
        # and pod-env vars get stripped to empty strings, silently
        # breaking the inline script. The 2026-05-10 job-gc E2E
        # caught one live instance; the same class affected 7 other
        # CronJobs across k8s/base/. This guard prevents regression.
        run: ./scripts/ci-flux-escape-check.sh
      - name: Verify no backticks inside unquoted heredoc bodies
        # An unquoted heredoc expands its body — prose backticks in the
        # comments of bootstrap.sh's Flux Kustomization block ran as
        # commands on every install and printed "op:: command not found",
        # "kustomize: command not found" (+5 more) to the operator's
        # console. Harmless-looking because the generated YAML stayed
        # valid, which is why it shipped for months.
        run: ./scripts/ci-heredoc-expansion-check.sh

  task-helper-coverage:
    name: Task Tracker helper coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify long-running surfaces register with the Task Tracker helper
        run: ./scripts/ci-task-helper-coverage.sh

  snapshot-restore-not-fake:
    name: CNPG snapshot Restore is wired to the real PITR endpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify SystemSnapshotsModal posts to /admin/postgres-restore
        # Phase 1 (2026-05-22) — operator pushback: the CNPG snapshot
        # Restore button used to navigate to /backups/disaster-recovery
        # shell instructions instead of actually restoring. This guard
        # blocks reintroduction.
        run: ./scripts/ci-snapshot-restore-not-fake.sh

  cnpg-backup-catalogue-check:
    name: CNPG backup catalogue invariants (graceful degradation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify catalogue auth gate + S3-direct + unavailable-on-failure
        # Phase 2 (2026-05-22) — the catalogue exists for graceful
        # degradation when the CNPG operator is dead. Any regression
        # that makes it throw on failure paths would defeat the entire
        # purpose. This guard locks in the invariants.
        run: ./scripts/ci-cnpg-backup-catalogue-check.sh

  postgres-barman-restore-check:
    name: Barman-cloud restore invariants (source-safety + plugin-shape)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify barman-restore module gates source mutation + plugin parameter shape
        # Phase 3 (2026-05-22) — this module spawns Cluster CRs from
        # off-cluster archives. The two regressions that would matter
        # most are: (a) source-cluster mutation via mistyped name and
        # (b) plugin parameter drift (RFC: barmanObjectName, not
        # objectStoreName — drift caught 2026-05-20). This guard
        # blocks both.
        run: ./scripts/ci-postgres-barman-restore-check.sh

  flux-envsubst-check:
    name: Flux postBuild envsubst safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify no malformed ${...} sequences in rendered overlays
        # Catches the parse-error class that crashed the 2026-05-04
        # staging cutover apply (`${'`, `${ `, `${{` etc.) — Flux's
        # drone/envsubst aborts the kustomization with "unable to
        # parse variable name" and the cluster freezes mid-cutover.
        run: ./scripts/ci-flux-envsubst-check.sh

  empty-cluster-issuer-check:
    name: Empty cluster-issuer guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install python3 + PyYAML
        run: |
          python3 -m pip install --user pyyaml
      - name: Verify no Ingress with TLS + empty/unresolved cluster-issuer
        # Catches the silent-broken-cert class spotted on 2026-05-07:
        # webmail.staging.example.test was serving the nginx-
        # ingress fake self-signed cert because the staging overlay
        # used `${CLUSTER_ISSUER_NAME}` but platform-cluster-config
        # didn't define that key, so Flux postBuild rendered an empty
        # annotation. cert-manager skipped the cert; nginx fell back.
        # ci-flux-envsubst-check only catches MALFORMED `${...`, not
        # unresolved-variable patterns.
        run: ./scripts/ci-empty-cluster-issuer-check.sh

  system-affinity-check:
    name: System node-affinity guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install yq
        run: |
          # Same binary as admin-auth-gate-check — kept as a separate step
          # so this job can fail independently when yq drifts.
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Verify system workloads carry role=server nodeAffinity
        run: ./scripts/ci-system-affinity-check.sh

  # 2026-05-14 streamline: mail-subsystem static probes promoted to
  # required gates. These detect classes of regression that have
  # repeatedly slipped through the existing tests:
  #   - mail-sdk-shape:    catches v0-positional @kubernetes/client-node
  #                        casts that silently fail on the v1 SDK
  #                        (real bug: migration.ts:84 "Node not found"
  #                        while node was healthy).
  #   - no-longhorn-in-mail: enforces the local-path-only decision in
  #                        project_mail_architecture_streamline_2026_05_14.md.
  mail-sdk-shape:
    name: Mail-admin SDK v0/v1 shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - run: ./scripts/ci-mail-sdk-shape.sh

  no-longhorn-in-mail:
    name: No Longhorn refs in mail subsystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/ci-no-longhorn-in-mail.sh

  mail-arch-regressions:
    name: Mail architecture regression guards (Phase 1/2 streamline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/ci-mail-arch-regressions.sh

  # Image-org fork-safety (Holistic plan W2): overlays stay canonical, workflows
  # derive their push org from github.repository, preflight constant agrees.
  image-org:
    name: Image-org fork-safety guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/ci-image-org-check.sh

  # R-X5: universal backup-rclone-shim invariants. 8 checks: super_admin
  # gate, SHIM_CLASSES locked, STATE_ERROR self-heal, consumer-kind
  # coverage, migration 0016 CHECK constraint, registry-membership of
  # every shim-consumer kind, drain_timeout_seconds CHECK, lazy
  # buildK8sClients factory.
  backup-rclone-shim:
    name: Backup-rclone-shim invariants (R-X1..R-X5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/ci-backup-rclone-shim-check.sh

  # DR safety: every backup write/delete callsite must call
  # requireWritableTarget() OR carry a RO-EXEMPT annotation, so a
  # freshly restored DR cluster cannot overwrite/prune the repo it
  # just restored from. Enforces 8 registered sites; flags any new
  # write-path additions under the watched subtrees.
  backup-target-readonly:
    name: Backup target read_only enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/ci-backup-target-ro-check.sh

  # A2 DR-bundle sidecar drift guard: a contributor adding a column to
  # backup_configurations must also extend dr-rows.json's serialiser +
  # the Zod schema. Without this, Unit B's restore importer silently
  # misses fields. Also enforces DR_BUNDLE_VERSION=1 (bumps must be
  # explicit) + the critical-Secret list.
  dr-bundle-drift:
    name: DR bundle sidecar drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/ci-dr-bundle-check.sh

  component-watch-guard:
    name: Component watch registry/ledger (ADR-050)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install python3 + PyYAML
        run: python3 -m pip install --user pyyaml
      - name: Verify registry schema + drift + k8s/bootstrap coverage + ledger SLA
        # The security/components.yaml registry is the single source of truth for
        # the component CVE/version watch. This guard fails if a pinned version
        # drifts from its pin_source, if a k8s image / bootstrap pin is untracked,
        # or if an open KEV/critical ledger item is past SLA without a mitigation.
        run: ./scripts/ci-component-watch-check.sh


  # ── Previously-unwired guards (2026-07-28) ───────────────────────────────
  # These ci-*.sh guards existed but ran in NO workflow, so their invariants
  # were unprotected. Wired here after each was verified to pass on a clean
  # checkout. One of them (ci-tenant-restore-policy-check) had already drifted
  # — it caught three operator-set limit-override columns (bandwidth cap,
  # mailbox-size cap) that a tenant could have restored to reset their own
  # limits; fixed in the same change. See git log for details.
  repo-static-guards:
    name: Repo static guards (mail/backup/restore/pg-dump/argv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: mail PG-removal invariants
        run: ./scripts/ci-mail-pg-removal-check.sh
      - name: modsec-crs exclusion footgun guard
        run: ./scripts/ci-modsec-exclusion-check.sh
      - name: no legacy backup-class routing keys
        run: ./scripts/ci-no-legacy-backup-classes.sh
      - name: no plaintext secret inlined into cli argv
        run: ./scripts/ci-no-secret-in-argv.sh
      - name: pg_dump scope-shrink invariants
        run: ./scripts/ci-pg-dump-scope-check.sh
      - name: snapshot-fallback invariants
        run: ./scripts/ci-snapshot-fallback-check.sh
      - name: tenant-restore deny-list covers all sensitive columns
        run: ./scripts/ci-tenant-restore-policy-check.sh
      - name: every GitHub Action is pinned to a commit SHA
        run: ./scripts/ci-actions-pinned-check.sh
      # Offline half only — hermetic, so it can run on every push. The --online
      # half (does upstream really resolve that crate version?) runs in
      # component-watch.yml, which already has network + a token.
      - name: rocksdb pin stays coupled to Stalwart's
        run: ./scripts/ci-rocksdb-stalwart-pin-check.sh
      - name: runtime-resolved images stay digest-pinned (or declared pending)
        run: ./scripts/ci-config-image-pin-check.sh

  # kubectl is preinstalled on ubuntu-latest runners; these render overlays
  # with `kubectl kustomize` (same as the kustomize-build + admin-auth jobs).
  overlay-invariant-guards:
    name: Overlay guards (stalwart, webmail-feature-css)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Stalwart manifest invariants across overlays
        run: ./scripts/ci-stalwart-check.sh
      - name: Webmail feature-visibility CSS invariants across overlays
        run: ./scripts/ci-webmail-feature-css-check.sh
