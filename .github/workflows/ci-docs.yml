name: Docs CI

# No path filter on purpose: references to docs/ paths can rot from any
# file class (code comments, scripts, manifests, markdown). The guard is
# a sub-second grep sweep — cheap enough to run on every PR.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]

# Least privilege (2026-07-28 security review): these workflows only read the
# repo, so drop the token to read-only instead of inheriting the repository
# default (which may be read-write). Any job needing more must opt in with its
# own job-level `permissions:`.
permissions:
  contents: read

jobs:
  manual-impact:
    # NAME MUST MATCH THE BEHAVIOUR. This was called "Manual freshness
    # (report-only)" long after it stopped being report-only (2026-07-25), so a
    # red run read as advisory noise and got waved through. It BLOCKS: a PR
    # touching user-visible surfaces must update documentation/docs/** or carry
    # a `Manual-Impact: none` commit trailer. If the enforcement flag below is
    # ever turned off again, rename this back.
    name: Documentation freshness guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ./scripts/ci-manual-impact-check.sh
        # Enforcing since 2026-07-25 (operator decision): a PR touching
        # user-visible surfaces must update documentation/docs/** or carry a
        # `Manual-Impact: none` commit trailer. The 2026.6.7→2026.7.2 manual
        # drift (2 wrong + 6 missing pages) happened in the report-only era.
        env:
          DOCS_MANUAL_IMPACT_ENFORCE: '1'

  docs-link-check:
    name: Docs link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify every referenced docs/ path exists
        run: ./scripts/ci-docs-link-check.sh
