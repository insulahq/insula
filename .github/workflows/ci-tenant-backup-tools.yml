name: Tenant-Backup-Tools CI

on:
  push:
    branches: [development]
    paths: ['images/tenant-backup-tools/**', '.github/workflows/ci-tenant-backup-tools.yml']
  pull_request:
    branches: [development, main]
    paths: ['images/tenant-backup-tools/**', '.github/workflows/ci-tenant-backup-tools.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/tenant-backup-tools

jobs:
  build:
    name: Build + Scan + Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # Trivy SARIF upload
      id-token: write          # cosign keyless image signing (sign step gated to main, non-PR)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      timestamp_tag: ${{ steps.tag.outputs.timestamp_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fast script-level guard before the (slow) image build. Catches the
      # Plesk-migration reshape regression where unread new/ messages were
      # dropped (imap-restore reads only cur/).
      - name: Reshape script tests
        run: python3 images/tenant-backup-tools/test-plesk-maildir-reshape.py

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            # Gate on `development`, NOT {{is_default_branch}}: ADR-053 made
            # `development` the branch that builds, but the repo's DEFAULT branch
            # is still `main`, so is_default_branch is FALSE here and NEITHER tag
            # was emitted — every consumer pulls :latest, which therefore froze at
            # its pre-cutover build on 2026-06-22. Fixed across all image
            # workflows; see ci-sftp-gateway (bc278063) and ci-file-manager
            # (5c30f200) for the two that were caught first.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-{{sha}},enable=${{ github.ref == 'refs/heads/development' }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: images/tenant-backup-tools
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance + SBOM attestations — gated to non-PR: PR builds use
          # `load: true` (docker exporter), which is incompatible with buildkit
          # attestations, so they'd fail. On main (push: true) they attach.
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      # Cosign keyless-sign the pushed image by digest (main only). Mirrors
      # ci-backup-rclone.yml. Gated to non-PR (fork PRs get a read-only token).
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
      - name: Sign image (keyless, OCI 1.1 referrers)
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            --registry-referrers-mode=oci-1-1 \
            "${{ env.IMAGE }}@${DIGEST}"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # ignore-unfixed: true — upstream Debian CVEs without an
          # available fix (libgnutls/libexpat/libnghttp2 in trixie-slim
          # as of 2026-05) cannot be remediated at our layer. They
          # still land in the SARIF upload to GitHub Security so an
          # operator gets a per-image report; we only CI-gate on
          # actionable CVEs (where bumping a package version would
          # close them). Tracked as a follow-up: switch base to a
          # distroless variant when Phase 2 JMAP code lands.
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy-results.sarif
          category: tenant-backup-tools

      - id: tag
        name: Extract immutable timestamp tag (for the dev-overlay pin)
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          ts_tag=$(echo "$ALL_TAGS" | grep -oE ':[0-9]{14}-[0-9a-f]{7,}' | head -1 | sed 's/^://')
          [ -n "$ts_tag" ] || { echo "::error::no timestamp tag in $ALL_TAGS"; exit 1; }
          echo "timestamp_tag=$ts_tag" >> "$GITHUB_OUTPUT"
          echo "tenant-backup-tools → $ts_tag"

  # Pin the dev overlay to the immutable tag just pushed. tenant-backup-tools is
  # shared by bulwark + stalwart (deployment, snapshot-cronjob, standby-replicate
  # DaemonSet) — the single images: entry re-pins all of them at once, replacing
  # the standby-replicate deploy-rev bump (no `:latest` pull-race).
  pin:
    name: Pin dev image tag
    needs: build
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request' && needs.build.outputs.timestamp_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # PER-IMAGE group. A single shared `pin-development-${{ github.ref }}` group
      # across seven workflows loses pins: GitHub keeps at most ONE pending job per
      # group and cancels the rest, and `cancel-in-progress: false` only protects a
      # RUNNING job, not a queued one. That silently dropped the tenant-backup-tools
      # digest pin on 2026-08-07 when five workflows fired together. Serialising was
      # never the safety mechanism anyway — both pin-image-tag.sh and
      # apply-development-pin.sh carry a reset/re-apply/retry loop against
      # origin/development precisely because concurrent pins are expected.
      group: pin-development-tenant-backup-tools-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: .github/scripts/pin-image-tag.sh tenant-backup-tools "${{ needs.build.outputs.timestamp_tag }}"

  # Pin the freshly-pushed image into the development overlay's platform-config,
  # AFTER the push, from the image's OWN workflow — pinning from a different
  # workflow is what caused the 2026-06-06 pull race. The backend resolves this
  # image at RUNTIME from an env var, so it is invisible to the kustomization
  # `images:` transformer; see .github/scripts/pin-config-image.sh.
  #
  # Tag label is the 7-char git sha (exactly what `type=sha,prefix=` pushes)
  # rather than a re-derived timestamp: `{{date}}` is evaluated inside
  # metadata-action, so recomputing it here would name a tag that was never
  # pushed. The digest is authoritative regardless; the tag is a readable label.
  pin-config:
    name: Pin digest into the development overlay
    needs: build
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # PER-IMAGE group, deliberately. A single shared group loses pins: GitHub
      # keeps at most ONE pending job per concurrency group and cancels the rest,
      # so when five image workflows fired together on 2026-08-07 the
      # tenant-backup-tools pin was cancelled while the other four ran. Serialising
      # was never needed anyway — pin-config-image.sh has a 4-attempt
      # reset/re-apply/retry loop precisely because concurrent pins are expected.
      group: pin-development-config-tenant-backup-tools
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          .github/scripts/pin-config-image.sh tenant-backup-tools-image \
            "${IMAGE}:${GITHUB_SHA:0:7}@${DIGEST}"
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
