name: Backend CI

on:
  push:
    branches: [development]
    # The guard script and its allowlist live under scripts/, so a change to
    # EITHER must trigger this workflow — otherwise an entry can be added to
    # the allowlist without the guard that reads it ever running (the #391
    # lesson: a paths filter that omits its own subject is not a guard).
    paths: ['backend/**', 'packages/api-contracts/**',
            'scripts/ci-route-body-validation-check.sh',
            'scripts/.route-body-cast-allowlist.txt']
  pull_request:
    branches: [development, main]
    paths: ['backend/**', 'packages/api-contracts/**',
            'scripts/ci-route-body-validation-check.sh',
            'scripts/.route-body-cast-allowlist.txt']

# Least privilege (2026-07-28 security review): these workflows only read the
# repo, so drop the token to read-only instead of inheriting the repository
# default (which may be read-write). Any job needing more must opt in with its
# own job-level `permissions:`.
permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @insula/api-contracts
      - run: npm run lint -w @insula/backend
      - run: npm run typecheck -w @insula/backend

  # Every record type the tenant UI offers, written to a REAL PowerDNS using
  # only the inputs that UI can produce, then read back.
  #
  # The mocked provider tests assert the request body we SEND; they cannot
  # see that PowerDNS REJECTS it. That gap let MX, SRV and CAA stay broken
  # indefinitely — the 422 was swallowed and the API still answered 201 —
  # and published every mail record to `<apex>.<apex>.`.
  route-body-validation-guard:
    name: Request bodies are parsed, not cast (ROADMAP R29a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify no new route reads request.body without a Zod parse
        run: ./scripts/ci-route-body-validation-check.sh

  drizzle-array-binding-guard:
    name: No JS array bound into ANY()/IN()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Lives HERE, not in Infrastructure CI: the guard greps ALL of
      # backend/src, and Infrastructure CI triggers on only a handful of
      # backend modules — so a new ANY(${array}) anywhere else would never be
      # checked. Backend CI already runs on backend/**, which is the guard's
      # actual subject.
      - name: Verify no JS array is interpolated into ANY()/IN()
        run: ./scripts/ci-drizzle-array-binding-check.sh

  dns-powerdns-live:
    name: DNS record types against a live PowerDNS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @insula/api-contracts
      - run: ./scripts/integration-dns-powerdns.sh

  # Mail-subsystem SDK shape probe — catches v0-positional
  # @kubernetes/client-node casts that silently fail on the v1 SDK.
  # Same probe as in ci-infrastructure.yml, wired here so it also runs
  # on backend-only PRs (where the violations actually land).
  mail-sdk-shape:
    name: Mail-admin SDK v0/v1 shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - run: ./scripts/ci-mail-sdk-shape.sh

  no-longhorn-in-mail:
    name: No Longhorn refs in mail subsystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/ci-no-longhorn-in-mail.sh

  mail-arch-regressions:
    name: Mail architecture regression guards (Phase 1/2 streamline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/ci-mail-arch-regressions.sh

  tenant-bundles-coverage-audit:
    name: tenant-bundles coverage audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pure bash + grep + awk + sed; no Node setup needed. Fails
      # when a new client-FK'd table lands in db/schema.ts without
      # being added to CONFIG_DUMP_TABLES or the explicit exclusion
      # list in config.ts. Also flags new tenant-namespace
      # PVCs/Secrets created in code without a backup-coverage
      # decision. Prevents the silent-drop bug where a new tenant
      # data dimension stops being backed up because nobody updated
      # the bundle.
      - name: Audit tenant data coverage vs bundle components
        run: ./scripts/ci-tenant-bundles-schema-audit.sh
      - name: Audit tenant PVC/Secret creation sites
        run: ./scripts/ci-tenant-bundles-resource-audit.sh
      # Every table dumped to a bundle MUST also appear in the restore
      # executor's allow-list — otherwise rows hit the bundle but are
      # rejected at restore-time ("table X is not in the restore
      # allow-list"). This is how tenantCertificates was found in
      # production. The guard demands CONFIG_DUMP_TABLES ⊆
      # ALLOWED_TABLE_TO_SQL.
      - name: Audit config dump ↔ restore allow-list parity
        run: ./scripts/ci-config-dump-restore-parity.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: platform_test
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://platform:platform@localhost:5432/platform_test
      JWT_SECRET: ci-test-secret-key-at-least-16-chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @insula/api-contracts
      - run: npm run test:coverage -w @insula/backend
      # The unit run EXCLUDES **/*.integration.test.ts, so the Postgres and
      # Redis services above were provisioned and never used by it. Run the
      # mail-stats integration test against them.
      #
      # Scoped to one file on purpose. `GET /admin/mail/stats` answered 400 for
      # its entire life because its only test covered the pure string parser
      # and nothing exercised the query — a raw sql`` fragment comparing an
      # enum column to a label the enum has never had, which TypeScript cannot
      # see inside and a mocked database happily agrees with. Only a real
      # server rejects it.
      #
      # The other 17 integration files have never run in CI either. Turning
      # them all on in the same change would mix "is the new test green" with
      # "do seventeen untried suites pass", so that is deliberately left as its
      # own decision rather than smuggled in here.
      - name: Integration — mail stats against real Postgres
        run: npm run test:integration -w @insula/backend -- src/modules/mail-stats
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @insula/api-contracts
      - run: npm run build -w @insula/backend
