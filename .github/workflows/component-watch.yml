name: Component Watch

# Component CVE & version watch (ADR-050).
#   * PR gate  — registry guard + OSV dep-scan that fails on a new HIGH/CRITICAL
#                not waived in security/cve-ledger.yaml, and on ANY malicious
#                (MAL-) package regardless of severity.
#   * Daily    — the same dep-scan, unattended (see WHY DAILY below).
#   * Weekly   — OSV + upstream-behind sweep → rolling tracking issue.
# Registry: security/components.yaml   Ledger: security/cve-ledger.yaml
# Runbook:  docs/operations/COMPONENT_WATCH.md
#
# THIS IS THE ONLY OSV SCANNER IN CI (consolidated 2026-08-06). A second,
# lockfile-only OSV job briefly lived in ci-dependency-audit.yml with its own
# inline MAL- gate; two scanners meant two sets of rules and two places to waive
# a finding. The malicious-package gating moved into component-watch-gate.py
# (where the ledger already is) and that job was deleted. ci-dependency-audit.yml
# keeps only `npm audit signatures`, which is a genuinely different signal —
# registry signature/provenance verification, not an advisory lookup.

on:
  pull_request:
    branches: [development, main]
    paths:
      - 'security/**'
      - 'package-lock.json'
      - '**/package.json'
      - '.npmrc'
      - '.github/workflows/component-watch.yml'
      - '.github/scripts/component-watch-gate.py'
      - 'images/**/go.mod'
      - 'images/**/go.sum'
      - 'images/**/Cargo.toml'
  schedule:
    # WHY DAILY: a dependency is compromised on the advisory's clock, not ours.
    # Nothing in the lockfile has to change for a package already in it to turn
    # hostile, so a PR-only trigger never re-examines it — and the weekly sweep
    # alone means up to 7 days between a MAL- advisory being published and this
    # repo noticing. Daily bounds that to ~24h. The scan is a few minutes of a
    # hosted runner; a malicious transitive dep sitting undetected for a week is
    # not worth the saving.
    - cron: '17 4 * * *'   # daily 04:17 UTC — dep-scan + registry guard
    - cron: '0 6 * * 1'    # Mondays 06:00 UTC — adds the sweep + tracking issue
  workflow_dispatch:

permissions:
  contents: read

env:
  # osv-scanner is installed via `go install` so the version resolves through the
  # Go module proxy (no fragile release-asset name guessing). v2 module path.
  OSV_VERSION: v2.0.2

jobs:
  registry-guard:
    name: Registry schema + drift + coverage + SLA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m pip install --user pyyaml
      - run: ./scripts/ci-component-watch-check.sh

  dep-scan:
    name: OSV dependency scan (gate on malicious + new HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m pip install --user pyyaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Install osv-scanner
        run: |
          go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_VERSION}"
          osv-scanner --version
      - name: Scan lockfiles
        run: osv-scanner scan source --recursive --format json --output osv.json . || true
      - name: Gate on non-waived HIGH/CRITICAL
        run: python3 .github/scripts/component-watch-gate.py osv.json security/cve-ledger.yaml

  sweep:
    name: Weekly sweep → tracking issue
    # Weekly cron + manual dispatch only. The daily cron exists for the dep-scan;
    # rewriting the rolling tracking issue every morning would turn a signal
    # people read into a notification people mute.
    if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m pip install --user pyyaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Install osv-scanner
        run: go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_VERSION}"
      - name: Scan
        run: osv-scanner scan source --recursive --format json --output osv.json . || true
      - name: Upstream-behind check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/component-watch.sh --latest --json > latest.json || true
      - name: Build issue body
        run: python3 .github/scripts/component-watch-sweep.py osv.json latest.json security/components.yaml security/cve-ledger.yaml > issue-body.md
      - name: Open or update rolling issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="🔭 Component watch — open items"
          num=$(gh issue list --label component-watch --state open --limit 1 --json number --jq '.[0].number' || true)
          if [[ -n "${num:-}" && "${num}" != "null" ]]; then
            gh issue edit "$num" --body-file issue-body.md
            echo "updated #$num"
          else
            gh label create component-watch --color 0E8A16 --description "ADR-050 component CVE/version watch" 2>/dev/null || true
            gh issue create --title "$title" --label component-watch --body-file issue-body.md
          fi
