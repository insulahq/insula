name: node-terminal CI

# Privileged-Pod harness for the admin node-terminal feature.
# Built from images/node-terminal/Dockerfile (alpine + util-linux for
# `nsenter` into the k3s node host namespaces).
#
# Mirrors ci-rocksdb-secondary-checkpoint.yml — same registry, tagging,
# and Trivy gate. The image surface is tiny (~10MB alpine + util-linux).

on:
  push:
    branches: [development]
    paths:
      - 'images/node-terminal/**'
      - '.github/workflows/ci-node-terminal-image.yml'
  pull_request:
    branches: [development, main]
    paths:
      - 'images/node-terminal/**'
      - '.github/workflows/ci-node-terminal-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/node-terminal

jobs:
  build:
    name: Build + Scan + Push
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            # Gate on `development`, NOT {{is_default_branch}}: ADR-053 made
            # `development` the branch that builds, but the repo's DEFAULT branch
            # is still `main`, so is_default_branch is FALSE here and NEITHER tag
            # was emitted — every consumer pulls :latest, which therefore froze at
            # its pre-cutover build on 2026-06-22. Fixed across all image
            # workflows; see ci-sftp-gateway (bc278063) and ci-file-manager
            # (5c30f200) for the two that were caught first.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-{{sha}},enable=${{ github.ref == 'refs/heads/development' }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: images/node-terminal
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Tiny image — cache hits are essentially the apk add layer.
          cache-from: type=gha,scope=node-terminal
          cache-to: type=gha,mode=max,scope=node-terminal

      # Smoke-test: nsenter must be present and runnable from PATH.
      - name: Smoke test (nsenter --version)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --entrypoint=/bin/sh \
            ${{ fromJSON(steps.meta.outputs.json).tags[0] }} \
            -c "command -v nsenter && nsenter --version"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          # Image is internal-only (admin-only privileged pod, ephemeral)
          # and only ships util-linux/bash from a pinned alpine base.
          # Advisory mode keeps the build green; findings surface in
          # GitHub Security.
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results.sarif

  # Pin the freshly-pushed image into the development overlay's platform-config,
  # AFTER the push, from the image's OWN workflow — pinning from a different
  # workflow is what caused the 2026-06-06 pull race. The backend resolves this
  # image at RUNTIME from an env var, so it is invisible to the kustomization
  # `images:` transformer; see .github/scripts/pin-config-image.sh.
  #
  # Tag label is the 7-char git sha (exactly what `type=sha,prefix=` pushes)
  # rather than a re-derived timestamp: `{{date}}` is evaluated inside
  # metadata-action, so recomputing it here would name a tag that was never
  # pushed. The digest is authoritative regardless; the tag is a readable label.
  pin-config:
    name: Pin digest into the development overlay
    needs: build
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # PER-IMAGE group, deliberately. A single shared group loses pins: GitHub
      # keeps at most ONE pending job per concurrency group and cancels the rest,
      # so when five image workflows fired together on 2026-08-07 the
      # tenant-backup-tools pin was cancelled while the other four ran. Serialising
      # was never needed anyway — pin-config-image.sh has a 4-attempt
      # reset/re-apply/retry loop precisely because concurrent pins are expected.
      group: pin-development-config-node-terminal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          .github/scripts/pin-config-image.sh node-terminal-image \
            "${IMAGE}:${GITHUB_SHA:0:7}@${DIGEST}"
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
