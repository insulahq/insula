name: rocksdb-secondary-checkpoint CI

# Tiny Rust binary that opens a live Stalwart RocksDB primary as a SECONDARY
# instance (no LOCK conflict) and creates a hard-linked Checkpoint. Used as
# the initContainer in mail-archive Jobs to enable zero-downtime app-level
# archives via `stalwart -e` against the checkpoint dir.
#
# Mirrors ci-tenant-backup-tools.yml exactly — same registry, same tagging
# scheme, same Trivy gate.

on:
  push:
    branches: [development]
    paths:
      - 'images/rocksdb-secondary-checkpoint/**'
      - '.github/workflows/ci-rocksdb-secondary-checkpoint.yml'
  pull_request:
    branches: [development, main]
    paths:
      - 'images/rocksdb-secondary-checkpoint/**'
      - '.github/workflows/ci-rocksdb-secondary-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/rocksdb-secondary-checkpoint

jobs:
  build:
    name: Build + Scan + Push
    runs-on: ubuntu-latest
    outputs:
      # Consumed by the pin job below. The digest is what containerd resolves;
      # the timestamp tag rides along so the pinned line stays human-readable.
      digest: ${{ steps.build.outputs.digest }}
      timestamp_tag: ${{ steps.tag.outputs.timestamp_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            # Gate on `development`, NOT {{is_default_branch}}: ADR-053 made
            # `development` the branch that builds, but the repo's DEFAULT branch
            # is still `main`, so is_default_branch is FALSE here and NEITHER tag
            # was emitted — every consumer pulls :latest, which therefore froze at
            # its pre-cutover build on 2026-06-22. Fixed across all image
            # workflows; see ci-sftp-gateway (bc278063) and ci-file-manager
            # (5c30f200) for the two that were caught first.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-{{sha}},enable=${{ github.ref == 'refs/heads/development' }}

      # Read the timestamp tag back OUT of metadata-action rather than
      # recomputing it. `{{date}}` is evaluated inside that action, so a second
      # `date` call here would be seconds off and would pin a tag that was never
      # pushed. Extract, don't re-derive.
      - id: tag
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          tag="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | sed 's/.*://' | grep -E '^[0-9]{14}-' | head -1)"
          [ -n "$tag" ] || { echo "::error::no <timestamp>-<sha> tag in metadata-action output — refusing to pin"; exit 1; }
          echo "timestamp_tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: images/rocksdb-secondary-checkpoint
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit cache via GitHub Actions cache backend. The Dockerfile
          # has separate FROM build / FROM runtime stages with a `cargo
          # fetch` step before `cargo build` — both layers cache cleanly
          # when only src/main.rs changes (~30s rebuilds vs ~8min cold).
          # `mode=max` caches every intermediate layer including the
          # librocksdb-sys vendored C++ compile output.
          cache-from: type=gha,scope=rocksdb-secondary-checkpoint
          cache-to: type=gha,mode=max,scope=rocksdb-secondary-checkpoint

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          # Don't fail the build on findings — same policy as tenant-backup-tools.
          # The image is internal-only (initContainer in a privileged Job)
          # and the binary is a static rocksdb glue; surface area is tiny.
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results.sarif

  # Pin the freshly-pushed image into the development overlay's platform-config,
  # AFTER the push. This runs here — in the image's own workflow — rather than in
  # build-deploy.yml on purpose: pinning from a different workflow is what caused
  # the 2026-06-06 pull race (the roll fired before the tag finished pushing).
  #
  # The backend resolves this image at RUNTIME from an env var, so it is invisible
  # to the kustomization `images:` transformer that pin-image-tag.sh drives —
  # hence the ConfigMap-key variant. See .github/scripts/pin-config-image.sh.
  pin:
    name: Pin digest into the development overlay
    needs: build
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # Shared with the other pin jobs: they all commit to `development`, and the
      # push race-recovery loop is cheaper to avoid than to exercise.
      # PER-IMAGE group, deliberately. A single shared group loses pins: GitHub
      # keeps at most ONE pending job per concurrency group and cancels the rest,
      # so when five image workflows fired together on 2026-08-07 the
      # tenant-backup-tools pin was cancelled while the other four ran. Serialising
      # was never needed anyway — pin-config-image.sh has a 4-attempt
      # reset/re-apply/retry loop precisely because concurrent pins are expected.
      group: pin-development-config-rocksdb-secondary-checkpoint
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin rocksdb-secondary-checkpoint by digest
        run: |
          .github/scripts/pin-config-image.sh rocksdb-secondary-checkpoint-image \
            "${IMAGE}:${{ needs.build.outputs.timestamp_tag }}@${{ needs.build.outputs.digest }}"
