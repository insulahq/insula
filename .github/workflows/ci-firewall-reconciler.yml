name: Firewall-Reconciler CI

on:
  push:
    branches: [development]
    paths:
      - 'images/firewall-reconciler/**'
      - '.github/workflows/ci-firewall-reconciler.yml'
  pull_request:
    branches: [development, main]
    paths:
      - 'images/firewall-reconciler/**'
      - '.github/workflows/ci-firewall-reconciler.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/firewall-reconciler

jobs:
  build:
    name: Build + Test + Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless image signing (sign step gated to main, non-PR)
      security-events: write   # Trivy SARIF upload
    outputs:
      timestamp_tag: ${{ steps.tag.outputs.timestamp_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Track the module's go directive — a hard-coded version here went
          # stale at the Go 1.26 move and only kept working because setup-go
          # <v6 left GOTOOLCHAIN=auto (the old binary silently downloaded the
          # right toolchain). v7 pins GOTOOLCHAIN=local, which exposed it.
          go-version-file: images/firewall-reconciler/go.mod
          cache-dependency-path: images/firewall-reconciler/go.sum

      - name: go mod download
        working-directory: images/firewall-reconciler
        run: go mod download

      - name: go vet
        working-directory: images/firewall-reconciler
        run: go vet ./...

      - name: go test
        working-directory: images/firewall-reconciler
        run: go test -race -count=1 ./...

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-{{sha}},enable=${{ github.ref == 'refs/heads/development' }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/firewall-reconciler
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA provenance + SBOM attestations — gated to non-PR: on a PR the
          # build uses no registry exporter (push: false), and buildkit
          # attestations require an OCI/registry exporter, so enabling them on a
          # PR build fails. On main (push: true) they attach to the pushed image.
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Trivy vulnerability scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Upload Trivy scan results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results.sarif
          category: firewall-reconciler

      # Cosign keyless-sign the pushed image by digest (main only). Mirrors
      # ci-backup-rclone.yml — a transparency-log attestation for the internal
      # image. Gated to non-PR (fork PRs get a read-only token anyway).
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
      - name: Sign image (keyless, OCI 1.1 referrers)
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            --registry-referrers-mode=oci-1-1 \
            "${{ env.IMAGE }}@${DIGEST}"

      - id: tag
        name: Extract immutable timestamp tag (for the dev-overlay pin)
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          ts_tag=$(echo "$ALL_TAGS" | grep -oE ':[0-9]{14}-[0-9a-f]{7,}' | head -1 | sed 's/^://')
          [ -n "$ts_tag" ] || { echo "::error::no timestamp tag in $ALL_TAGS"; exit 1; }
          echo "timestamp_tag=$ts_tag" >> "$GITHUB_OUTPUT"
          echo "firewall-reconciler → $ts_tag"

  # Pin the dev overlay to the immutable tag just pushed, so Flux rolls to a tag
  # that is GUARANTEED to exist (no `:latest` pull-race). Shares build-deploy's
  # pin concurrency group so all pin commits across workflows serialize.
  pin:
    name: Pin dev image tag
    needs: build
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request' && needs.build.outputs.timestamp_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # PER-IMAGE group. A single shared `pin-development-${{ github.ref }}` group
      # across seven workflows loses pins: GitHub keeps at most ONE pending job per
      # group and cancels the rest, and `cancel-in-progress: false` only protects a
      # RUNNING job, not a queued one. That silently dropped the tenant-backup-tools
      # digest pin on 2026-08-07 when five workflows fired together. Serialising was
      # never the safety mechanism anyway — both pin-image-tag.sh and
      # apply-development-pin.sh carry a reset/re-apply/retry loop against
      # origin/development precisely because concurrent pins are expected.
      group: pin-development-firewall-reconciler-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: .github/scripts/pin-image-tag.sh firewall-reconciler "${{ needs.build.outputs.timestamp_tag }}"
