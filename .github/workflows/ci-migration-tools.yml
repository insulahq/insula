name: Migration-Tools CI

on:
  push:
    branches: [development]
    paths: ['images/migration-tools/**', '.github/workflows/ci-migration-tools.yml']
  pull_request:
    branches: [development, main]
    paths: ['images/migration-tools/**', '.github/workflows/ci-migration-tools.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/migration-tools

jobs:
  build:
    name: Build + Scan + Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # Trivy SARIF upload
      id-token: write          # cosign keyless signing (main, non-PR)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            # Gate on `development`, NOT {{is_default_branch}}: ADR-053 made
            # `development` the branch that builds, but the repo's DEFAULT branch
            # is still `main`, so is_default_branch is FALSE here and NEITHER tag
            # was emitted — every consumer pulls :latest, which therefore froze at
            # its pre-cutover build on 2026-06-22. Fixed across all image
            # workflows; see ci-sftp-gateway (bc278063) and ci-file-manager
            # (5c30f200) for the two that were caught first.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-{{sha}},enable=${{ github.ref == 'refs/heads/development' }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: images/migration-tools
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations are incompatible with the PR `load: true` path.
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
      - name: Sign image (keyless, OCI 1.1 referrers)
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            --registry-referrers-mode=oci-1-1 \
            "${{ env.IMAGE }}@${DIGEST}"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # unfixable trixie-slim base CVEs (see ci-tenant-backup-tools.yml)
          exit-code: '1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy-results.sarif
          category: migration-tools

  # No `pin` job: migration-tools is not referenced by any Deployment
  # manifest — the backend spawns it as a one-shot Job by `:latest` (env
  # PLESK_MIGRATION_TOOLS_IMAGE overridable), like the discovery Job.

  # Pin the freshly-pushed image into the development overlay's platform-config,
  # AFTER the push, from the image's OWN workflow — pinning from a different
  # workflow is what caused the 2026-06-06 pull race. The backend resolves this
  # image at RUNTIME from an env var, so it is invisible to the kustomization
  # `images:` transformer; see .github/scripts/pin-config-image.sh.
  #
  # Tag label is the 7-char git sha (exactly what `type=sha,prefix=` pushes)
  # rather than a re-derived timestamp: `{{date}}` is evaluated inside
  # metadata-action, so recomputing it here would name a tag that was never
  # pushed. The digest is authoritative regardless; the tag is a readable label.
  pin-config:
    name: Pin digest into the development overlay
    needs: build
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # PER-IMAGE group, deliberately. A single shared group loses pins: GitHub
      # keeps at most ONE pending job per concurrency group and cancels the rest,
      # so when five image workflows fired together on 2026-08-07 the
      # tenant-backup-tools pin was cancelled while the other four ran. Serialising
      # was never needed anyway — pin-config-image.sh has a 4-attempt
      # reset/re-apply/retry loop precisely because concurrent pins are expected.
      group: pin-development-config-migration-tools
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          .github/scripts/pin-config-image.sh migration-tools-image \
            "${IMAGE}:${GITHUB_SHA:0:7}@${DIGEST}"
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
