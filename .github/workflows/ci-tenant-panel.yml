name: Tenant Panel CI

on:
  push:
    branches: [development]
    paths: ['frontend/tenant-panel/**', 'packages/api-contracts/**', 'packages/ui-restore-cart/**', '.github/workflows/ci-tenant-panel.yml']
  pull_request:
    branches: [development, main]
    paths: ['frontend/tenant-panel/**', 'packages/api-contracts/**', 'packages/ui-restore-cart/**', '.github/workflows/ci-tenant-panel.yml']

# Least privilege (2026-07-28 security review): these workflows only read the
# repo, so drop the token to read-only instead of inheriting the repository
# default (which may be read-write). Any job needing more must opt in with its
# own job-level `permissions:`.
permissions:
  contents: read

jobs:
  lint-typecheck-test-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @insula/api-contracts
      - run: npm run build -w @insula/ui-restore-cart
      - run: npm run lint -w @insula/tenant-panel
      - run: npm run typecheck -w @insula/tenant-panel
      - run: npm run test -w @insula/tenant-panel
      - run: npm run build -w @insula/tenant-panel
