name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The tag MUST match platform/VERSION at the tagged commit (ADR-045
      # Decision 5 — cut-release.sh keeps them in lockstep). Refuse a mismatch
      # so a hand-pushed tag can never ship a version the code doesn't claim.
      - name: Validate tag matches platform/VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(tr -d '[:space:]' < platform/VERSION)
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != platform/VERSION ($FILE_VERSION) — use scripts/cut-release.sh"
            exit 1
          fi
          echo "tag matches platform/VERSION: $FILE_VERSION"

      # Build all 3 images with semver tag only (no :latest — that's build-deploy.yml's job)
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: frontend/admin-panel/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/admin-panel:${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: frontend/tenant-panel/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/tenant-panel:${{ steps.version.outputs.version }}

      # platform-ops operator CLI (ADR-045 / W17): build the self-contained Node
      # SEA binary for both arches and cosign-sign each (key-based, OFFLINE — no
      # Rekor upload, matching the bootstrap verify path). Uploaded as Release
      # assets that bootstrap.sh fetches + verifies. If COSIGN_PRIVATE_KEY is not
      # set the binaries ship UNSIGNED and the bootstrap auto-install stays
      # dormant (fail-closed) — see scripts/lib/bootstrap-phases.sh.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Build & sign platform-ops binaries
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # arm64 cross-build: inject the (arch-independent) SEA blob into a
          # downloaded target-arch Node runtime. That runtime IS the binary we
          # ship + cosign-sign, so verify its integrity against Node's official
          # SHA256 manifest (TLS-authenticated nodejs.org) BEFORE extracting —
          # the cosign signature only attests the output, never its inputs.
          # (Follow-up hardening: GPG-verify SHASUMS256.txt.asc against Node's
          # release keyset for full provenance.)
          NODE_VER="$(node -p 'process.version')"
          TARBALL="node-${NODE_VER}-linux-arm64.tar.xz"
          curl -fsSL "https://nodejs.org/dist/${NODE_VER}/${TARBALL}" -o "/tmp/${TARBALL}"
          curl -fsSL "https://nodejs.org/dist/${NODE_VER}/SHASUMS256.txt" -o /tmp/SHASUMS256.txt
          ( cd /tmp && grep " ${TARBALL}\$" SHASUMS256.txt | sha256sum -c - )
          mkdir -p /tmp/node-arm64 && tar -xJf "/tmp/${TARBALL}" -C /tmp/node-arm64 --strip-components=1
          ./scripts/build-platform-ops.sh --version "$VERSION" --arch amd64
          ./scripts/build-platform-ops.sh --version "$VERSION" --arch arm64 --node-binary /tmp/node-arm64/bin/node
          if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
            # Sign BOTH the canonical `insula-linux-<arch>` (ADR-055) and the
            # legacy `platform-ops-linux-<arch>` (kept so a not-yet-migrated
            # node's old self-upgrade/bootstrap can still fetch + verify).
            for name in insula platform-ops; do
              for a in amd64 arm64; do
                cosign sign-blob --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --yes \
                  "dist-platform-ops/${name}-linux-${a}" > "dist-platform-ops/${name}-linux-${a}.sig"
              done
            done
            echo "platform-ops: signed insula + platform-ops (amd64 + arm64)"
          else
            echo "::warning::COSIGN_PRIVATE_KEY not set — uploading UNSIGNED binaries; bootstrap auto-install stays dormant (fail-closed)."
          fi

      # W11 version-poller trust artifact: a tiny cosign-signed manifest naming
      # the released version + image refs. The in-cluster poller downloads THIS
      # (a few hundred bytes — never the 120 MB binaries) and verifies the
      # signature with pure Node crypto against the pinned platform/cosign.pub
      # before it will ever surface `available_version`. Signed ONLY when
      # COSIGN_PRIVATE_KEY is set — same fail-closed posture as the binaries, so
      # an unsigned release is refused by the poller (never auto-trusted).
      - name: Build & sign release manifest (version-poller trust artifact)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          # Build the JSON with python (no heredoc-whitespace pitfalls). The
          # `version` field MUST equal the tag (the poller binds them) — it's the
          # tag-validated platform/VERSION, so they match by construction.
          python3 - > dist-release/release-manifest.json <<'PY'
          import json, os, datetime
          v = os.environ["VERSION"]
          pfx = os.environ["IMAGE_PREFIX"]
          print(json.dumps({
              "version": v,
              "images": {
                  "backend": f"{pfx}/backend:{v}",
                  "adminPanel": f"{pfx}/admin-panel:{v}",
                  "tenantPanel": f"{pfx}/tenant-panel:{v}",
              },
              "releasedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, separators=(",", ":")))
          PY
          echo "manifest: $(cat dist-release/release-manifest.json)"
          if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
            cosign sign-blob --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --yes \
              dist-release/release-manifest.json > dist-release/release-manifest.json.sig
            echo "release-manifest: signed"
          else
            echo "::warning::COSIGN_PRIVATE_KEY not set — release-manifest.json uploaded UNSIGNED; the version-poller will refuse it (fail-closed)."
          fi

      # Release notes = the matching CHANGELOG section (curated by cut-release.sh),
      # not auto-generated commit logs.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Literal prefix match (index, not regex) so the version's dots are not
          # treated as wildcards — `## [2026.6.1]` must not match `## [2026.6.10]`.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 {f=1; next}
            f && /^## \[/ {f=0}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::no CHANGELOG section for ${VERSION}"
            printf 'Release %s\n' "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          fi

      # Create GitHub Release (with the platform-ops binaries + signatures as
      # assets; .sig files are absent when unsigned → don't fail on unmatched).
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            dist-platform-ops/insula-linux-amd64
            dist-platform-ops/insula-linux-amd64.sig
            dist-platform-ops/insula-linux-arm64
            dist-platform-ops/insula-linux-arm64.sig
            dist-platform-ops/platform-ops-linux-amd64
            dist-platform-ops/platform-ops-linux-amd64.sig
            dist-platform-ops/platform-ops-linux-arm64
            dist-platform-ops/platform-ops-linux-arm64.sig
            dist-release/release-manifest.json
            dist-release/release-manifest.json.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After the release publishes, reconcile the `development` branch's CHANGELOG
  # so it isn't left carrying the just-released content under [Unreleased] with
  # no [version] section (ADR-053: cut-release promotes the CHANGELOG on `main`
  # only). Idempotent — a no-op once synced. Only CHANGELOG.md changes, so this
  # push does not (and must not) re-trigger build-deploy.
  sync-development-changelog:
    needs: build-and-release
    runs-on: ubuntu-latest
    # Skip prereleases: an -rc.N tag does not promote a stable [version] section.
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: write
    concurrency:
      group: sync-development-changelog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile development CHANGELOG against the release tag
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true
          rc=0
          ./scripts/sync-development-changelog.sh --tag "${GITHUB_REF_NAME}" --write || rc=$?
          if [ "$rc" = "2" ]; then echo "CHANGELOG already in sync — nothing to push."; exit 0; fi
          if [ "$rc" != "0" ]; then echo "::error::sync-development-changelog failed (rc=$rc)"; exit 1; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): sync development with ${GITHUB_REF_NAME} release [skip ci]"
          # Concurrency-safe push: rebase onto the latest development before pushing.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:development; then echo "pushed."; exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto development…"
            git fetch origin development
            git rebase origin/development || { echo "::error::rebase conflict syncing CHANGELOG"; exit 1; }
          done
          echo "::error::could not push CHANGELOG sync after retries"; exit 1
