name: Admin Panel CI

on:
  push:
    branches: [development]
    paths: ['frontend/admin-panel/**', 'packages/api-contracts/**', 'packages/ui-restore-cart/**', '.github/workflows/ci-admin-panel.yml']
  pull_request:
    branches: [development, main]
    paths: ['frontend/admin-panel/**', 'packages/api-contracts/**', 'packages/ui-restore-cart/**', '.github/workflows/ci-admin-panel.yml']

# Least privilege (2026-07-28 security review): these workflows only read the
# repo, so drop the token to read-only instead of inheriting the repository
# default (which may be read-write). Any job needing more must opt in with its
# own job-level `permissions:`.
permissions:
  contents: read

jobs:
  lint-typecheck-test-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @insula/api-contracts
      - run: npm run build -w @insula/ui-restore-cart
      - run: npm run lint -w @insula/admin-panel
      - run: npm run typecheck -w @insula/admin-panel
      - run: npm run test -w @insula/admin-panel
      - run: npm run build -w @insula/admin-panel
      # A password input in an eagerly-loaded chunk makes the operator's
      # password manager prompt on every navigation. Bundle-level check —
      # unit tests cannot see it. Reuses the dist/ built above.
      - run: ./scripts/ci-no-password-fields-in-entry-chunk.sh --skip-build admin-panel
