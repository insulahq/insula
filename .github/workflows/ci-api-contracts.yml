name: API Contracts CI

# Fast standalone validation for the shared API contracts package.
# Runs before (and in parallel with) downstream consumer CI so a broken
# schema fails in ~30s instead of after all three consumer builds.

on:
  push:
    branches: [development]
    paths: ['packages/api-contracts/**', '.github/workflows/ci-api-contracts.yml']
  pull_request:
    branches: [development, main]
    paths: ['packages/api-contracts/**', '.github/workflows/ci-api-contracts.yml']

# Least privilege (2026-07-28 security review): these workflows only read the
# repo, so drop the token to read-only instead of inheriting the repository
# default (which may be read-write). Any job needing more must opt in with its
# own job-level `permissions:`.
permissions:
  contents: read

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (tsc)
        run: npm run build -w @insula/api-contracts
      - name: Verify dist was produced
        run: test -f packages/api-contracts/dist/index.d.ts && test -f packages/api-contracts/dist/index.js
      - name: Verify dist actually EXPORTS what consumers call
        # File presence is not the failure mode. A dist whose .d.ts and .js
        # disagree typechecks clean and only breaks at runtime ("X is not a
        # function"). The panels' vitest now resolves contracts from source, so
        # this is the CI step that imports the compiled output for real.
        run: ./scripts/ci-api-contracts-runtime-exports.sh
      - name: Unit tests
        # Until 2026-09-10 the *.test.ts files in this package were collected by
        # NO runner: the backend's vitest is scoped `--dir src` (its own src),
        # and this workflow only built the package and checked its exports. Four
        # test files sat here passing by never running, and extra-mounts.test.ts
        # had gone stale against a validation rule that was deliberately
        # reversed — uppercase folder names became legal, the test still
        # asserted they were refused, and nothing noticed.
        #
        # Contracts are the single source of truth for every API shape in the
        # platform, so this is the last place that should be silently skipped.
        #
        # Invoked through node against the hoisted package, not `npm run -w`
        # and not node_modules/.bin/vitest.
        #
        # vitest is a devDependency of backend and both panels, never of this
        # workspace, so npm hoists the PACKAGE to the root but creates no
        # root-level .bin shim for it — `node_modules/.bin/vitest` exists on a
        # developer machine with an incremental install and does NOT exist
        # after a clean `npm ci`, which is how the first attempt at this step
        # passed locally and failed on the runner with exit 127. Declaring the
        # dependency here would fix the shim but means regenerating
        # package-lock.json for a package that needs no other dependency
        # change. The package's own entry point is stable either way.
        #
        # Asserts the number of tests that ACTUALLY RAN, not the exit code and
        # not the number of files on disk. `vitest run` over an empty match set
        # can exit 0, so a green step is no evidence anything executed — which
        # is exactly how these four files went unnoticed for months. A future
        # change that mis-scopes the runner then fails here instead of quietly
        # reverting the package to zero coverage.
        run: |
          set -euo pipefail
          # ABSOLUTE path: `--outputFile` resolves against `--root`, so a bare
          # filename lands in packages/api-contracts/ and the jq below reads a
          # file that is not there.
          OUT="${RUNNER_TEMP:-/tmp}/vitest-api-contracts.json"
          node node_modules/vitest/vitest.mjs run --root packages/api-contracts \
            --reporter=default --reporter=json --outputFile.json="$OUT"
          total=$(jq -r '.numTotalTests // 0' "$OUT")
          passed=$(jq -r '.numPassedTests // 0' "$OUT")
          echo "vitest executed ${total} test(s), ${passed} passed"
          test "${total}" -gt 0
          rm -f "$OUT"
