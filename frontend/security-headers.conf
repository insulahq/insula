# Shared security headers for the admin + tenant panels (2026-07-28).
#
# WHY AN INCLUDE AND NOT JUST SERVER-LEVEL add_header:
#   nginx's add_header is NOT additive across levels. A `location` block that
#   declares ANY add_header of its own REPLACES the entire inherited set — so
#   the static-asset and config.js locations (which set Cache-Control) would
#   silently serve no security headers at all. That is the worst place to lose
#   `nosniff`. This file is therefore `include`d at server level AND inside
#   every location that sets its own header.
#
# `always` is required so the headers survive on 4xx/5xx responses too.
#
# $insula_hsts is computed by a `map` on $http_x_forwarded_proto in each
# panel's nginx.conf.template: the value is empty for plain-HTTP requests and
# nginx omits an add_header whose value is empty, so a non-TLS deployment is
# never pinned.

# frame-ancestors 'self': neither panel is embedded cross-origin. The admin
# panel is the PARENT of the Stalwart/Longhorn iframes, so this governs who
# may embed the panel — not what the panel may embed.
add_header Content-Security-Policy "frame-ancestors 'self'" always;

# Legacy companion to frame-ancestors for browsers that predate CSP L2.
add_header X-Frame-Options "SAMEORIGIN" always;

# Stops MIME sniffing turning a proxied or uploaded blob into executable
# script — most relevant on exactly the static-asset locations that would
# otherwise have dropped these headers.
add_header X-Content-Type-Options "nosniff" always;

# Panel URLs embed tenant / deployment / domain ids; don't leak them to third
# parties on outbound navigation.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

add_header Strict-Transport-Security $insula_hsts always;
